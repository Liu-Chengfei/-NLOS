name: contract-ci

on:
  push:
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        env:
          PYTHONPATH: src
        run: pytest -q
      - name: Run minimal smoke
        env:
          PYTHONPATH: src
        run: python scripts/99_mini_smoke.py
      - name: Audit minimal outputs
        env:
          PYTHONPATH: src
        run: python scripts/15_audit_outputs.py
      - name: Verify high-level consumers
        env:
          PYTHONPATH: src
        run: python scripts/19_verify_high_level_consumers.py
