# Fast smoke version of e1_main_table_paper.
# 保留与 paper 版相同的 5 轴、5 方法，但序列数限制到 2 个以快速验证集成路径。
# 注意：此 fast 配置不构成论文级数据，论文级数据走 e1_main_table_paper.yaml。

experiment_id: e1_main_table
primary_axis: public_sequence_category
frozen_axes:
  dataset: sim
  split: sim_e9
  A: [A2, A3]   # 异步档（2×2 网格仍含 A2 主档）
  N: [N2, N3]   # NLOS 档（2×2 网格仍含 N2 主档）
  V: [V0]       # V0 健康档（V1/V2/V3 仅用于敏感性实验）
  K: K1         # K1 主档（handbook S2 协议裁决项）
  M: M1         # M1 主档（UWB 5% 成簇丢包）
methods: [ekf, robust_ekf, lstm_ekf, transformer_ekf, liquid_ekf]
mode_overrides:
  quick:
    repeats: 1
    max_sequences: 2
  full:
    repeats: 1
    max_sequences: 2
