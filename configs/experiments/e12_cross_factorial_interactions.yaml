# 这个文件定义交叉因子交互实验入口。
# 它会同时展开多个退化轴，主要看不同因素叠加后会不会出现非线性交互。
# 这是比单轴更重的组合实验。

# 实验编号。# 方便和其他实验文件区分。
experiment_id: e12_cross_factorial_interactions  # 交叉因子实验编号。

# 主研究轴仍然是目标退化组合。# 这里强调的是多个轴同时展开，而不是单轴主导。
primary_axis: target_degradation_bundle  # 主轴仍保持组合退化口径。

# 这里把四个主退化轴都展开到全范围。# 这样能最大限度看交互项。
frozen_axes:
  # 异步轴展开全部档位。# 从最轻到最重全覆盖。
  A: [A0, A1, A2, A3]  # A 轴全档位展开。
  # NLOS 轴展开全部档位。# 从直视到重度非视距全覆盖。
  N: [N0, N1, N2, N3]  # N 轴全档位展开。
  # VIO 轴展开全部档位。# 从正常到严重退化全覆盖（e12 交叉因子实验的语义要求全因子展开）。
  V: [V0, V1, V2, V3]  # V 轴全档位展开。
  # 2026-09-03：五轴档位协议。K0=最优几何，不拉梯度，避免与 V 交叉因子混淆。
  # 锚点数量固定在 4。# 保持测距几何不过度发散。
  K: K0  # 协议 K0：4 锚对称矩形四角，好几何，锚数固定 4。
  # 模态缺失固定为无缺失。e12 交叉因子实验关心 A/N/V 交互，不引入模态丢失压力，
  # 显式冻结 M=M0 与六轴协议保持一致。
  M: M0  # 固定为无模态缺失。

# 参与比较的方法。# 这些方法覆盖传统、鲁棒和学习式方案。
# ekf：标准 EKF，对多退化交互无特殊处理，预期交互效应最明显。
# robust_ekf：鲁棒 EKF，部分抵抗多退化交互，但交互效应仍然存在。
# fgo：因子图优化，鲁棒核函数可能部分缓解交互。
# lstm_ekf：LSTM 增强 EKF，学习式方法可能学到部分交互模式。
# liquid_ekf：液态网络增强 EKF，核心方法，期望在多退化交互下仍保持鲁棒。
methods: [ekf, robust_ekf, fgo, lstm_ekf, liquid_ekf]  # 代表方法全量参与。

# quick/full 模式覆盖项。# 这里的 quick 仍然需要较大的组合覆盖。
mode_overrides:
  # 轻量模式。# 虽然叫 quick，但交叉组合本身就比较重。
  quick:
    # 重复次数。# 与其他实验对齐：quick 模式重复 2 次，保证烟雾结果稳定性。
    repeats: 2  # quick 模式重复 2 次（与其他实验对齐）。
    # quick 也要覆盖较多序列，因为组合空间很大。# 这里优先保覆盖面。
    max_sequences: 64  # quick 模式最多 64 个序列。
  # 完整模式。# 这里用于更充分地收集交互结果。
  full:
    # 重复次数。# 与其他实验对齐：full 模式重复 5 次，保证统计可靠性。
    repeats: 5  # full 模式重复 5 次（与其他实验对齐）。
    # 不限制序列数。# 表示完整模式不额外裁剪。
    max_sequences: null  # full 模式不设序列上限。
