# 这个文件定义相位切换实验入口。# 它主要看系统在不同阶段切换时，整体行为会不会发生突变。
# 它主要看系统在不同阶段切换时，整体行为会不会发生突变。# 这类实验通常关注状态切换是否平滑。

# 实验编号。# 便于结果目录和报告索引。
experiment_id: e11_phase_switch  # 相位切换实验编号。

# 实验状态。# 当前 scene_sampler 未实现事件级相位切换执行路径，标记 disabled。
# sample_scenes 命中此 primary_axis 时优雅降级为空任务列表，不抛 ValueError。
status: disabled  # 实验声明但执行路径未实现，由 scene_sampler 优雅降级。

# 主研究轴是相位切换画像。# 这个轴强调阶段变化，而不是单一退化等级。
primary_axis: phase_switch_profile  # 主轴定义为相位切换画像。

# 其余场景轴固定在中等退化水平。# 这样能把切换本身的影响凸显出来。
frozen_axes:
  # 异步固定为中度。# 保持中等时间错位。
  A: A2  # 固定为 A2。
  # NLOS 固定为中度。# 保持中等非视距。
  N: N2  # 固定为 N2。
  # VIO 固定为中度。# 保持中等视觉退化。
  V: V2  # 固定为 V2。
  # 几何固定为中等条件。# 避免几何过强或过弱。
  # 2026-09-03：五轴档位协议——K 轴 3 档（K0=最优、K1=中等、K3=近共线退化），锚数全档固定 4。
  K: K1  # 协议 K1：4 锚非对称欠定，中等几何质量。

# 参与比较的方法。# 这里仍然保留完整代表方法集合。
# ekf：标准 EKF，无相位切换机制，状态切换时可能出现跳变。
# robust_ekf：鲁棒 EKF，通过异常值抑制部分缓解切换时的跳变。
# fgo：因子图优化，批量方法天然平滑，切换影响较小。
# lstm_ekf：LSTM 增强 EKF，学习式方法可能学到切换模式。
# liquid_ekf：液态网络增强 EKF，核心方法，期望在相位切换时保持平滑。
methods: [ekf, robust_ekf, fgo, lstm_ekf, liquid_ekf]  # 所有主流方法参与比较。

# quick/full 模式覆盖项。# 这里控制不同规模的实验重复和序列覆盖。
mode_overrides:
  # 轻量模式。# 快速检查切换逻辑是否正常。
  quick:
    # 重复次数。# 让小规模结果稍微稳定一点。
    repeats: 2  # quick 模式重复 2 次。
    # 序列上限。# 限制烟雾规模。
    max_sequences: 8  # quick 模式最多 8 个序列。
  # 完整模式。# 用于更正式的收集。
  full:
    # 重复次数。# full 模式保留默认重复。
    repeats: 5  # full 模式重复 5 次。
    # 不限制序列数。# 表示完整模式不收缩覆盖。
    max_sequences: null  # full 模式不设序列上限。
