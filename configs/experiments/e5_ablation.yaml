# 文件职责：定义消融实验入口。
# 它主要比较液态方法（liquid_ekf）的不同变体，看看去掉某些机制后会发生什么。
# 这类实验用来解释各组件的贡献，是论文消融分析的核心实验。
# 每个变体从完整模型中去掉一个关键机制，通过对比可以量化该机制的独立贡献。

# 实验编号。# 这个值用于日志、产物目录和结果汇总时标识这一组实验。
experiment_id: e5_ablation  # 消融实验编号。

# 主研究轴是消融变体。# 这里不是扫描退化轴，而是比较同一方法的不同组件配置。
# 使用 public_sequence_category 路由，走 public benchmark 路径，读取真实仿真数据集。
primary_axis: public_sequence_category  # 主轴定义为公开序列类别，启用数据集路由。

# 消融实验中固定的场景条件。
# 路由层通过 frozen_axes 注入降档，所有变体在同一场景下运行，确保差异只来自组件变化。
frozen_axes:
  # 异步固定为中度。# A1 表示轻微时间错位。
  A: A1  # 固定为 A1。

  # NLOS 固定为中度。# N2 表示中等非视距偏差，论文消融实验的标准设置。
  N: N2  # 固定为 N2。

  # VIO 退化固定为中度。# V2 表示中等视觉退化。
  V: V2  # 固定为 V2。

  # 几何固定为中等条件。# G1 表示中等几何布局。
  G: G1  # 固定为 G1。

  # 锚点数量固定为 4。# K4 是主表欠定默认（B30）。
  K: K4  # 主表欠定默认（B30）。

  # 模态缺失固定为无缺失。# M0 表示不引入模态丢失压力。
  M: M0  # 固定为无模态缺失。

# 参与比较的消融变体。# 每个变体从完整 liquid_ekf 中去掉一个关键机制。
# liquid_ekf_full：完整液态网络增强 EKF，包含所有组件，作为消融基准。
# liquid_ekf_wo_liquid：去掉液态神经网络核心，退化为普通 EKF，验证液态网络的贡献。
# liquid_ekf_wo_bias_memory：把 intermediate.bias 强制为 0.0，验证偏置记忆贡献。
# liquid_ekf_wo_risk_gate：把 intermediate.risk 强制为 0.0，验证风险门控贡献。
# liquid_ekf_wo_vio_confidence：在 VIO 模态把 intermediate.vio_scaling 强制为 1.0，验证 VIO 置信度贡献。
methods:
  - liquid_ekf_full
  - liquid_ekf_wo_liquid
  - liquid_ekf_wo_bias_memory
  - liquid_ekf_wo_risk_gate
  - liquid_ekf_wo_vio_confidence  # 论文消融分析的 5 个方法。

# quick/full 下的运行规模。# 消融实验不用扫退化轴，用 repeats 控制规模。
mode_overrides:
  # 快速模式。# 仅做最小验证，确认消融逻辑正确。
  quick:
    repeats: 2        # 重复 2 次。
    max_sequences: 6  # 仅跑前 6 个序列。

  # 完整模式（论文级）。# 用于正式消融结果，选取仿真数据的子集。
  full:
    repeats: 5           # 重复 5 次，提高统计可靠性。
    max_sequences: 240   # 选取 240 个序列 ≈ 5 次 × 48 序列/repeat，覆盖主要场景变体。
