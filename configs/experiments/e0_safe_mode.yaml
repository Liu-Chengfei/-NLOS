# 这个文件定义安全模式实验入口。# 它是最保守的起步实验，主要用来确认全链路能否稳定跑通。
# 它说明这组实验冻结哪些场景轴、跑哪些方法，以及 quick/full 两种规模下怎么跑。# 这里的设置会被实验编排器直接读取。

# 实验编号。# 这个值用于日志、产物目录和结果汇总时标识这一组实验。
experiment_id: e0_safe_mode  # 安全模式实验的唯一编号。

# 这一组实验的主研究轴。# 这里不是单一退化轴，而是“安全模式行为”这个总口径。
primary_axis: safe_mode_behavior  # 用来标识这组实验关注的是保守基线行为。

# 本实验固定不变的场景轴。# 这些轴不参与扫描，只负责把场景压到最简单、最稳定的状态。
frozen_axes:
  # 异步轴固定在最轻档。# 这样可以尽量减少时序错位对结果的干扰。
  A: A0  # 使用 A0 作为最小异步基线。
  # NLOS 轴固定在最轻档。# 这样可以避免非视距偏差引入额外不确定性。
  N: N0  # 使用 N0 作为最小 NLOS 基线。
  # VIO 轴固定在最轻档。# 这样可以保持视觉退化影响尽量小。
  V: V0  # 使用 V0 作为最小视觉退化基线。
  # 几何轴固定在最好档（K 轴兼几何分布语义）。# 几何条件越好，越适合作为系统起跑检查。
  K: K0  # 按「五轴档位协议定义」K0 = 4 锚对称矩形四角，好几何基线；锚数全档固定 4。

  # 2026-09-03：本实验 baseline 是 A0/N0/V0/K0（M=M0），
  # 即"无任何退化"的理想基线；V0/K0 显式固定，与主表 A/N 退化形成对照。

# 本实验要比较的方法列表。# 这里保留完整主流方法集合，方便检查谁先掉链子。
# ekf：标准扩展卡尔曼滤波，最基础的融合方法，作为性能下限。
# robust_ekf：鲁棒扩展卡尔曼滤波，在 EKF 基础上增加异常值抑制。
# fgo：因子图优化，基于图优化的批量估计方法。
# lstm_ekf：LSTM 增强 EKF，学习式基线方法，本实验中启用安全模式。
# liquid_ekf：液态网络增强 EKF，核心方法，本实验中启用安全模式。
methods: [ekf, robust_ekf, fgo, lstm_ekf, liquid_ekf]  # 传统、鲁棒和学习式方法都保留。

# quick/full 运行规模覆盖项。# 这部分控制同一实验在烟雾与完整模式下跑多少序列和重复次数。
mode_overrides:
  # 轻量烟雾规模。# 只做最小验证，不追求覆盖面。
  quick:
    # 重复次数。# 用于看最小规模下是否稳定。
    repeats: 2  # quick 模式下重复 2 次。
    # 最多跑多少个序列。# 控制烟雾验证的工作量。
    max_sequences: 4  # quick 模式最多 4 个序列。
  # 完整真实规模。# 这里用于较完整的正式验证或论文级运行。
  full:
    # 重复次数。# 需要更充分地观察波动。
    repeats: 5  # full 模式下重复 5 次。
    # 不限制序列数。# 表示完整模式不主动裁剪验证范围。
    max_sequences: null  # full 模式不设置序列上限。

# 本实验显式开启 safe_mode。# 默认模型配置不自动启用收敛保护，需要在这里手动打开。
# model_cfgs 允许对每个方法单独覆盖模型级参数，而不影响其他方法或全局协议。
model_cfgs:
  # 对 liquid_ekf 方法单独开启安全模式。# liquid_ekf 是液态神经网络增强的 EKF，需要显式启用收敛保护。
  liquid_ekf:
    # safe_mode 子配置。# 控制液态网络在检测到发散风险时的收敛保护行为。
    safe_mode:
      # 是否启用安全模式。# 启用后，模型会在估计风险超过阈值时自动降级到保守策略。
      enabled: true  # 显式开启安全模式。
      # 风险阈值。# 当模型内部风险估计值超过此阈值时，触发收敛保护机制；0.5 表示中等风险即触发。
      risk_threshold: 0.5  # 风险阈值设为 0.5，即半数概率以上即降级。
  # 对 lstm_ekf 方法单独开启安全模式。# lstm_ekf 是 LSTM 增强的 EKF，同样需要显式启用收敛保护。
  lstm_ekf:
    # safe_mode 子配置。# 控制 LSTM 网络在检测到发散风险时的收敛保护行为。
    safe_mode:
      # 是否启用安全模式。# 启用后，模型会在估计风险超过阈值时自动降级到保守策略。
      enabled: true  # 显式开启安全模式。
      # 风险阈值。# 与 liquid_ekf 保持一致，便于公平比较两种学习式方法的安全模式行为。
      risk_threshold: 0.5  # 风险阈值设为 0.5，与 liquid_ekf 对齐。
