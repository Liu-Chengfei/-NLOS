# 这个文件定义异步轴实验入口。# 它专门研究时间不同步对定位结果的影响。
# 它专门研究时间不同步对定位结果的影响。# 重点看异步程度变化会怎样破坏融合效果。

# 实验编号。# 方便日志和结果目录识别。
experiment_id: e2_async  # 异步轴实验编号。

# 主研究轴是异步程度。# 这里直接把 A 轴作为扫描对象。
primary_axis: A  # 主轴设为异步程度 A。

# 其他场景轴固定在中等退化水平。# 这样可以把异步的影响单独拎出来。
frozen_axes:
  # NLOS 固定为中度。# 避免非视距过弱或过强干扰结论。
  N: N2  # 固定为中度 NLOS。
  # V 固定为 V0（无 VIO 退化）。
  V: V0
  # G 轴已并入 K 轴（v27 协议），不再独立声明。
  # 锚点数量固定为 K1（协议主档，4 锚等边矩形布局）。
  K: K1

# 参与比较的方法。# 这里保留代表方法，便于观察异步对不同范式的影响。
# ekf：标准 EKF，对异步无特殊处理，时间错位直接传播到状态估计。
# robust_ekf：鲁棒 EKF，通过异常值抑制部分抵抗异步导致的观测异常。
# fgo：因子图优化，可通过时间对齐因子部分缓解异步。
# lstm_ekf：LSTM 增强 EKF，学习式方法可能学到异步模式。
# liquid_ekf：液态网络增强 EKF，核心方法，期望在异步下表现最好。
methods: [ekf, robust_ekf, lnn, lstm, transformer, liquid_ekf]  # 全 5 方法参与异步扫描。

# quick/full 模式覆盖项。# 这里按规模决定抽哪些异步等级。
mode_overrides:
  # 轻量模式。# 只抽取部分异步等级。
  quick:
    # quick 只抽取部分异步等级。# 这里是为了减少烟雾成本。
    levels: [A0, A2, A3]  # 只抽取代表性的三个档位。
    # 重复次数。# 保证最低限度的稳定性。
    repeats: 2  # quick 模式重复 2 次。
  # 完整模式。# 覆盖全部异步等级。
  full:
    # full 覆盖全部异步等级。# 这里是完整扫描口径。
    levels: [A0, A1, A2, A3]  # 四个异步档位全覆盖。
    # 重复次数。# full 模式保留更充分的重复。
    repeats: 5  # full 模式重复 5 次。
