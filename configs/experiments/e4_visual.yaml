# 文件职责：定义 VIO（视觉惯性里程计）退化轴实验入口。
# 它专门研究视觉跟踪和重投影质量变化对定位结果的影响。
# 通过扫描 V 轴从 V0（无退化）到 V3（严重退化），重点看视觉退化如何影响融合稳定性。
# 这是检验视觉模态鲁棒性的关键实验。

# 实验编号。# 这个值用于日志、产物目录和结果汇总时标识这一组实验。
experiment_id: e4_visual  # VIO 退化实验编号。

# 主研究轴是 VIO 退化程度。# 这里直接把 V 轴作为扫描对象，其他轴固定。
primary_axis: V  # 主轴设为 VIO 退化程度 V。

# 其余场景轴固定。# 这样可以把视觉退化的影响单独拎出来，避免其他退化因素干扰结论。
frozen_axes:
  # 异步固定为中度。# A2 表示中等时间错位，保持时间错位压力稳定，不让异步干扰视觉退化结论。
  A: A2  # 固定为 A2。

  # NLOS 固定为轻度。# N1 表示轻微非视距偏差，给距离偏差留一点但不太重，避免 NLOS 掩盖视觉效应。
  N: N1  # 固定为轻度 NLOS。

  # G 轴已并入 K 轴（v27 协议），不再独立声明。
  # 锚点数量固定为 K1（协议主档，4 锚等边矩形布局）。
  K: K1

# 参与比较的方法。# 覆盖传统、鲁棒和学习式方法，便于观察视觉退化对不同范式的影响。
# ekf：标准 EKF，对 VIO 退化无特殊处理，容易受视觉噪声影响。
# robust_ekf：鲁棒 EKF，通过异常值抑制部分抵抗视觉退化。
# fgo：因子图优化，可通过鲁棒核函数抵抗视觉异常。
# lstm_ekf：LSTM 增强 EKF，学习式方法可能学到视觉退化模式。
# liquid_ekf：液态网络增强 EKF，核心方法，期望在 VIO 退化下表现最好。
methods: [ekf, robust_ekf, lnn, lstm, transformer, liquid_ekf]  # 全 5 方法参与视觉退化扫描。

# quick/full 的等级抽样和重复设置。# 这里按规模决定抽哪些视觉等级。
mode_overrides:
  # 轻量模式。# 只抽取代表性视觉等级，降低烟雾成本。
  quick:
    # quick 只抽取部分 VIO 等级。# 保留代表性更强的档位：V0（无退化）、V2（中度）、V3（重度）。
    levels: [V0, V2, V3]  # 代表性 VIO 等级集合，跳过 V1 以减少组合。

    # 重复次数。# 保证小规模下可回看，避免单次偶然结果。
    repeats: 2  # quick 模式重复 2 次。

  # 完整模式。# 全量覆盖视觉等级，用于正式结果收集。
  full:
    # full 覆盖全部 VIO 等级。# 这是完整扫描口径，从 V0 到 V3 四档全覆盖。
    levels: [V0, V1, V2, V3]  # 四档全覆盖。

    # 重复次数。# full 模式保留更充分的重复，提高统计可靠性。
    repeats: 5  # full 模式重复 5 次。
