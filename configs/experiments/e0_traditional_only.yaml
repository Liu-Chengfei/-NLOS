# 文件职责：定义传统方法对照实验入口。
# 它和安全模式实验 (e0_safe_mode) 共用同一组冻结轴，但只保留传统基线方法（不含学习式模型）。
# 这样能直接看传统方法在无退化场景下的下限表现，作为后续对比的参照基线。

# 实验编号。# 这个值用于日志、产物目录和结果汇总时标识这一组实验。
experiment_id: e0_traditional_only  # 传统方法对照实验的唯一编号。

# 这一组实验的主研究轴。# 与 e0_safe_mode 保持一致，便于横向比较安全模式对学习式方法的影响。
primary_axis: safe_mode_behavior  # 主轴仍为安全模式行为，方便与传统方法对照。

# 本实验固定不变的场景轴。# 与 e0_safe_mode 完全一致，冻结在最轻退化水平，确保传统方法在最有利条件下运行。
frozen_axes:
  # 异步轴固定在最轻档。# A0 表示无时间错位，即传感器数据完全同步。
  A: A0  # 使用 A0 作为最小异步基线。

  # NLOS 轴固定在最轻档。# N0 表示无视距偏差，即所有信号都是直射路径。
  N: N0  # 使用 N0 作为最小 NLOS 基线。

  # VIO 轴固定在最轻档。# V0 表示视觉惯性里程计无退化，跟踪质量正常。
  V: V0  # 使用 V0 作为最小视觉退化基线。

  # 几何轴固定在最好档。# K0 表示锚点几何布局最优（4 锚对称矩形四角），GDOP 最小。
  K: K0  # 按「五轴档位协议定义」K0 = 4 锚对称矩形四角，好几何基线。

  # 2026-08-29 档位重制定：本实验与传统 e0_safe_mode 共用同一组冻结轴，方法集合更窄（仅传统基线）。

# 本实验要比较的方法列表。# 只保留传统基线方法，去掉学习式模型（lstm_ekf、liquid_ekf）。
# ekf：标准扩展卡尔曼滤波，最基础的融合方法。
# robust_ekf：鲁棒扩展卡尔曼滤波，在 EKF 基础上增加异常值抑制。
# fgo：因子图优化，基于图优化的批量估计方法。
methods: [ekf, robust_ekf, fgo]  # 只比较传统基线方法，去掉学习式模型。

# quick/full 运行规模覆盖项。# 与 e0_safe_mode 一致，只是方法集合更窄。
mode_overrides:
  # 轻量烟雾规模。# 只做最小验证，不追求覆盖面。
  quick:
    # 重复次数。# 用于看最小规模下是否稳定。
    repeats: 2  # quick 模式下重复 2 次。

    # 最多跑多少个序列。# 控制烟雾验证的工作量。
    max_sequences: 4  # quick 模式最多 4 个序列。

  # 完整真实规模。# 这里用于较完整的正式验证或论文级运行。
  full:
    # 重复次数。# 需要更充分地观察波动。
    repeats: 5  # full 模式下重复 5 次。

    # 不限制序列数。# 表示完整模式不主动裁剪验证范围。
    max_sequences: null  # full 模式不设置序列上限。
