# 这个文件定义模态恢复实验入口。# 它主要看某些模态恢复或缺失后，系统表现会怎么变化。
# 它主要看某些模态恢复或缺失后，系统表现会怎么变化。# 这是模态缺失鲁棒性的专门实验。

# 实验编号。# 用于区分这一组实验输出。
experiment_id: e10_modality_recovery  # 模态恢复实验编号。

# 实验状态。# 当前 scene_sampler 未实现事件级模态恢复执行路径，标记 disabled。
# sample_scenes 命中此 primary_axis 时优雅降级为空任务列表，不抛 ValueError。
status: disabled  # 实验声明但执行路径未实现，由 scene_sampler 优雅降级。

# 主研究轴是模态恢复画像。# 这里关心的是模态恢复过程本身，而不是单一退化轴。
primary_axis: modality_recovery_profile  # 主轴定义为模态恢复画像。

# 其余场景轴固定在中等退化水平。# 这样能把“模态恢复”这个因素单独拎出来看。
frozen_axes:
  # 异步固定为中度。# 让时间错位保持在中等压力。
  A: A2  # 固定为 A2。
  # NLOS 固定为中度。# 让非视距保持在中等压力。
  N: N2  # 固定为 N2。
  # VIO 固定为中度。# 让视觉也处于明显但非极端的退化状态。
  V: V2  # 固定为 V2。
  # 几何固定为中等条件。# 避免几何太好或太差掩盖模态变化。
  # 2026-09-03：五轴档位协议——K 轴 3 档（K0=最优、K1=中等、K3=近共线退化），锚数全档固定 4。
  K: K1  # 协议 K1：4 锚非对称欠定，中等几何质量。

# 参与比较的方法。# 这里保留传统和学习式方法，便于看恢复机制差异。
# ekf：标准 EKF，无模态恢复机制，模态缺失时直接用剩余观测。
# robust_ekf：鲁棒 EKF，通过异常值抑制部分适应模态变化。
# fgo：因子图优化，可通过因子激活/停用适应模态变化。
# lstm_ekf：LSTM 增强 EKF，学习式方法可能学到模态恢复模式。
# liquid_ekf：液态网络增强 EKF，核心方法，期望在模态恢复场景下表现最好。
methods: [ekf, robust_ekf, fgo, lstm_ekf, liquid_ekf]  # 全方法集合参与对照。

# quick/full 模式覆盖项。# 这里控制最小和完整两种规模下的工作量。
mode_overrides:
  # 轻量模式。# 只做小范围验证。
  quick:
    # 重复次数。# 保证烟雾结果不至于太偶然。
    repeats: 2  # quick 模式重复 2 次。
    # 序列上限。# 防止烟雾验证过大。
    max_sequences: 8  # quick 模式最多 8 个序列。
  # 完整模式。# 这里用于更完整的结果收集。
  full:
    # 重复次数。# full 模式保留较稳妥的重复。
    repeats: 5  # full 模式重复 5 次。
    # 不限制序列数。# 表示完整模式不裁剪覆盖范围。
    max_sequences: null  # full 模式不设序列上限。
