# 文件职责：定义几何相关实验入口。
# 五轴档位协议下 G 已并入 K：扫描 K 轴档位覆盖协议定义的几何质量维度。
# 协议 K 轴档位：K0（最优 GDOP 0.8-1.2） / K1（中等 GDOP 1.8-2.2） / K3（近共线退化 GDOP 9-11+）。
# 本实验扫 K1/K3 观察不同几何条件下各方法的定位表现差异。
#
# 2026-08-29 改造：原 primary_axis: [G, K] 走 core route，用 _default_core_events
# 硬编码事件 fixture，与 sim_e9 数据集不兼容。改为 public_sequence_category 路由，
# 与 E5 同构，consume sim_e9_protocol_20260726 数据集。
#
# 2026-09-03 五轴档位协议：sim_e9 数据集覆盖 (K1, K3) 几何档位——
#   sim_curve_01*: K3 (93 base × 30 seeds = 2790 entries, 实有 ~93)
#   sim_curve_02*: K1 (93 base × 30 seeds = 2790 entries, 实有 ~93)
# 论文级 full 模式要求的 K0/K1/K3 几何全档扫描在 sim_e9 中（已全部覆盖）。
# 当前 quick 模式只覆盖 K1 + K3 两个 K 档位组合，在 commit message 中明确说明覆盖度局限。

# 实验编号。# 这个值用于日志、产物目录和结果汇总时标识这一组实验。
experiment_id: e6_geometry  # 几何实验编号。

# 主研究轴改成公开序列路由。# 启用数据集路由，让 _resolve_sim_protocol_seq_ids 按 frozen_axes 过滤 sim_e9。
# A/N/V/K 轴以 sim_meta.json 的 axes_override 为准，frozen_axes 只用于路由过滤。
primary_axis: public_sequence_category  # 公开序列路由。

# 数据集名称。# 路由到 sim 公开补充路线，走 Prepare + Core 完整链路。
dataset_name: sim  # 仿真数据集。

# 冻结轴。# 这里只声明 K 档位扫描维度，其余轴由 sim_meta.json 的 axes_override 决定。
# A/N/V 不写入 frozen_axes，避免 _resolve_sim_protocol_seq_ids 严格匹配时把 sim_e9 全部过滤掉。
# sim_curve_01*: A3/N2/V0/K3；sim_curve_02*: A3/N3/V0/K1。
#
# 2026-09-03: 五轴档位协议下合同从原 K3+K1 扫描。
frozen_axes:
  # 几何扫描维：覆盖 sim_e9 实际拥有的 K3 (sim_curve_01) 和 K1 (sim_curve_02)。
  K: [K1, K3]  # K 轴档位扫描维（五轴档位协议 G 已并入 K）。

# 参与比较的方法。# 覆盖传统、鲁棒和学习式方法，便于观察几何条件对不同范式的影响。
# ekf：标准 EKF，对几何退化敏感，GDOP 恶化时精度下降明显。
# robust_ekf：鲁棒 EKF，对几何退化有一定抵抗力。
# fgo：因子图优化，可通过图结构部分缓解几何退化。
# lstm_ekf：LSTM 增强 EKF，学习式方法可能学到几何退化模式。
# liquid_ekf：液态网络增强 EKF，核心方法，期望在几何退化下表现最好。
methods: [ekf, robust_ekf, fgo, lstm_ekf, liquid_ekf]  # 全方法参与几何扫描。

# quick/full 下的运行规模。# public_sequence_category 模式下用 max_sequences 控制规模。
mode_overrides:
  # 轻量模式。# 只取代表性序列数，降低烟雾成本。
  quick:
    # 重复次数。# public_sequence_category 不支持 repeats（allow_repeats=False），此字段作占位。
    repeats: 2  # quick 模式重复 2 次（占位，不生效）。

    # 序列上限。# 覆盖 K1×K3 全部基础序列（约 12 个 base curve），足够快速验证。
    max_sequences: 24  # quick 模式最多 24 个序列。

  # 完整模式。# 论文级全量覆盖。
  full:
    # 完整模式仍保留重复采样。
    repeats: 5  # full 模式重复 5 次（占位，不生效）。

    # 论文级全量 sim_e9 序列。
    max_sequences: 1860  # full 模式不设上限（sim_e9 共有 1860 序列）。
