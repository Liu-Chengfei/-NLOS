# 文件职责：定义运行时剖面实验入口。
# 它主要看不同锚点数量下的方法速度和资源开销，不是看精度主表。
# 这是性能画像而不是精度对比，关注的是推理延迟、内存占用等工程指标。
# K 轴（锚点数量）放在 frozen_axes 中以列表形式展开，是因为运行时画像需要扫描不同 K 值，
# 但 K 不是 primary_axis 所指的"研究语义"，而是运行时画像的扫描维度。

# 实验编号。# 这个值用于日志、产物目录和结果汇总时标识这一组实验。
experiment_id: e8_runtime  # 运行时实验编号。

# 主研究轴是运行时画像。# 这里不关心精度退化，而是关注方法在不同配置下的计算开销。
primary_axis: runtime_profile  # 主轴定义为运行时画像。

# 其他轴固定。# 运行时画像在基准条件下扫描 K 轴，A/N/V/G 冻结到基准档位。
frozen_axes:
  # 异步程度固定为近似同步，排除时间偏差对运行时的干扰。
  A: [A0]  # 基准：近似同步。
  # NLOS 固定为 LOS 主导，排除非视距对运行时的干扰。
  N: [N0]  # 基准：LOS 主导。
  # VIO 固定为正常，排除视觉退化对运行时的干扰。
  V: [V0]  # 基准：正常 VIO。
  # G 轴已并入 K 轴（v27 协议），不再独立声明。
  # 锚点数量在多个档位间切换。# K0（3 锚最优几何）/ K1（4 锚主档）/ K3（3 锚近共线），
  # 锚点数量直接影响计算量：锚点越多，每次更新的 UWB 观测越多，计算开销越大。
  K: [K0, K1, K3]

# 参与比较的方法。# 覆盖传统、鲁棒和学习式方法，比较它们的运行时差异。
# ekf：标准 EKF，计算量最小，作为速度基线。
# robust_ekf：鲁棒 EKF，比标准 EKF 多一步异常值检测，略慢。
# fgo：因子图优化，批量方法，通常比 EKF 慢但精度更高。
# lstm_ekf：LSTM 增强 EKF，需要额外的前向推理时间。
# liquid_ekf：液态网络增强 EKF，核心方法，关注其推理开销是否可接受。
methods: [ekf, robust_ekf, lnn, lstm, transformer, liquid_ekf]  # 全 5 方法参与运行时画像。

# quick/full 下的规模控制。# 运行时实验更依赖重复次数来获得稳定的计时统计。
mode_overrides:
  # 轻量模式。# 以较低重复和少量序列做快速画像，先看大致趋势。
  quick:
    # 重复次数。# 运行时指标需要一定重复才能稳定，quick 模式至少 5 次。
    repeats: 5  # quick 模式重复 5 次。

    # 序列上限。# 控制烟雾成本，3 个序列足够看趋势。
    max_sequences: 3  # quick 模式最多 3 个序列。

  # 完整模式。# 更重的运行时收集，用于正式的性能报告。
  full:
    # 重复次数更高，方便观察波动。# 运行时指标更依赖统计稳定性，20 次重复可以给出可靠的均值和置信区间。
    repeats: 20  # full 模式重复 20 次。
