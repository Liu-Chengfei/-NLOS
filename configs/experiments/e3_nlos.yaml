# 文件职责：定义 NLOS（非视距）轴实验入口。
# 它专门研究非视距程度变化对定位结果的影响，是检验距离偏差鲁棒性的关键实验。
# 通过扫描 N 轴从 N0（无视距偏差）到 N3（重度非视距），观察各方法在不同 NLOS 压力下的表现差异。

# 实验编号。# 这个值用于日志、产物目录和结果汇总时标识这一组实验。
experiment_id: e3_nlos  # NLOS 轴实验编号。

# 主研究轴是 NLOS 程度。# 这里直接把 N 轴作为扫描对象，其他轴固定。
primary_axis: N  # 主轴设为非视距程度 N。

# 其他场景轴固定在中等或轻度退化水平。# 这样可以把 NLOS 的影响单独拎出来，避免其他退化因素干扰结论。
frozen_axes:
  # 异步固定为中度。# A2 表示中等时间错位，保持时间错位压力稳定，不让异步干扰 NLOS 结论。
  A: A2  # 固定为中度异步。

  # V 固定为 V0（无 VIO 退化）。
  V: V0
  # G 轴已并入 K 轴（v27 协议），不再独立声明。
  # 锚点数量固定为 K1（协议主档，4 锚等边矩形布局）。
  K: K1

# 参与比较的方法。# 覆盖传统、鲁棒和学习式方法，便于观察 NLOS 对不同范式的影响。
# ekf：标准扩展卡尔曼滤波，对 NLOS 无特殊处理。
# robust_ekf：鲁棒 EKF，通过异常值抑制部分抵抗 NLOS。
# fgo：因子图优化，可通过鲁棒核函数抵抗 NLOS。
# lstm_ekf：LSTM 增强 EKF，学习式方法可能学到 NLOS 模式。
# liquid_ekf：液态网络增强 EKF，核心方法，期望在 NLOS 下表现最好。
methods: [ekf, robust_ekf, lnn, lstm, transformer, liquid_ekf]  # 全 5 方法参与 NLOS 扫描。

# quick/full 模式下的抽样和重复设置。# 这里按规模决定抽哪些 NLOS 等级。
mode_overrides:
  # 轻量模式。# 只抽取代表性的 NLOS 档位，降低烟雾成本。
  quick:
    # quick 只抽取部分 NLOS 等级。# 保留代表性更强的档位：N0（无偏差）、N2（中度）、N3（重度）。
    levels: [N0, N2, N3]  # 代表性档位集合，跳过 N1 以减少组合。

    # 重复次数。# 保证最小稳定性，避免单次偶然结果。
    repeats: 2  # quick 模式重复 2 次。

  # 完整模式。# 全量覆盖 NLOS 等级，用于正式结果收集。
  full:
    # full 覆盖全部 NLOS 等级。# 这是完整扫描口径，从 N0 到 N3 四档全覆盖。
    levels: [N0, N1, N2, N3]  # 四档全覆盖。

    # 重复次数。# full 模式保留更多重复，提高统计可靠性。
    repeats: 5  # full 模式重复 5 次。
