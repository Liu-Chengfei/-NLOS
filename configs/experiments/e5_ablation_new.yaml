# Ablation statistics reporting format (参考《消融实验方案.txt》第 3 节)
# 每个变体需要报告 4 个头的激活统计：
# - bias：输出均值 >0.1m 且有分布
# - risk：risk≠0 的事件比例 5-30%
# - uwb_scaling：输出偏离 1.0 的比例
# - vio_scaling：输出偏离 1.0 的比例