# 文件职责：定义 FGO（因子图优化）模型的固定参数，供工厂和脚本路由使用。
# 这里保存因子图优化器的固定参数，用于不依赖学习前端的几何优化基线。
# 下游通常由基线脚本读取，负责把传感器量测拼成滑窗因子图进行联合优化。
# 与 EKF 系列的区别：FGO 在滑窗内同时优化多个时间步的状态，而非逐步递推。
# 铁律 10：无核 FGO——禁止 robust_weight / 可学习核；代码侧 _huber_weight≡1.0。

# 模型名称，供工厂和脚本路由使用。
name: fgo  # 因子图优化器。

# 滑窗大小决定每次联合优化覆盖多少个时间步。# 窗口越大，约束信息越多，但计算量也越高。
# 窗口过小会导致约束不足，过大则增加延迟和内存开销。
# §3.4 + §10.3 / B10–B11：当前标称 IMU 100Hz、τ_filt=5s 时，[0.5, 3]×τ_filt
# 对应 [250, 1500] 步；取 500 步（=5s = 1×τ_filt）作为默认，落在区间正中。
# 修改此值必须配合 nominal_event_rate_hz / tau_filt_s 一起评估，FGOCore.__init__
# 会按三者换算并断言 ℓ_win/τ_filt ∈ [0.5, 3]，越界直接 raise（spec 硬约束）。
window_size: 500  # 因子图滑窗长度，单位为时间步（IMU 事件步）。

# §3.4 + §10.3 / B10–B11：窗长与滤波记忆同量级档；ℓ_win / τ_filt ∈ [0.5, 3]。
# 配置若以「步」计窗，须用标称事件率换算秒后再验比。这里写死协议层
# nominal_event_rate_hz（FGO 窗按 IMU 事件推进，sim 默认 IMU 100Hz，故 100.0）
# 与 tau_filt_s（§10.3 默认 min(5s, 0.2·T_eff)；T_eff≥25s 时退化为 5s）。
# 二者都是开跑前写死、禁止测试后调，与 §27.3 / B11 同口径。
nominal_event_rate_hz: 100.0  # FGO 窗步换算秒的标称事件率（与 sim 默认 IMU 100Hz 对齐）。
tau_filt_s: 5.0  # 滤波记忆尺度（秒），§10.3 写死。
# §10.3 诚实边界守卫（B2 v6 / 协议填槽表 L103 C8 修复）：tau_filt=5.0 是 spec
# §10.3 选项 1 "τ_filt = min(5s, 0.2·T_eff)" 的退化写死值，须 T_eff ≥ 25s 时
# min(5, 0.2·T_eff) = 5 才成立。本字段显性声明协议层 T_eff 域假设，与
# configs/base/experiment_protocol.yaml scene_scale.t_eff_min_s=20.0 同口径
# 升级前置保证：若 v0.2 协议升 t_eff_min_s 时须同步本字段。FGOCore.__init__
# 强制校验 tau_filt_s ≤ min(5.0, 0.2 × tau_filt_assumed_t_eff_min_s)。
tau_filt_assumed_t_eff_min_s: 25.0  # §10.3 τ_filt=5.0 隐含的协议层 T_eff 下限。
window_length_ratio_min: 0.5  # ℓ_win / τ_filt 下界（§10.3 / B10 α=0.5）。
window_length_ratio_max: 3.0  # ℓ_win / τ_filt 上界（§10.3 / B10 β=3）。

# 优化器配置：当前仅支持高斯牛顿求解器。
# max_iters 控制最大高斯牛顿迭代轮数；过小会过早收敛到次优解，过大增加延迟。
optimizer:
  name: gauss_newton  # 求解器类型，fgo_core 仅支持 "gauss_newton"。
  max_iters: 10  # 最大高斯牛顿迭代轮数，默认 10。

# 因子权重：各模态因子在联合优化中的相对权重（正标量）。
# 权重越大表示越信任该模态的约束。所有权重默认 1.0，保持与 EKF 系列同口径。
factor_weights:
  imu: 1.0  # IMU 运动因子权重（先验+运动模型）。
  uwb: 1.0  # UWB 测距因子权重。
  vio: 1.0  # VIO 相对位姿因子权重。

# 过程噪声按状态分量单独拆开。# 保持和其他滤波器配置一致的口径，便于公平比较。
# 这些噪声值在 IMU 预测步（与 EKF 共享的 run_predict_step）中构建过程噪声协方差 Q=σ²·dt。
# 配置值是噪声强度（PSD平方根，单位: state_unit/sqrt(s)），代码中离散化为 σ²*dt。
# 注意：这与 measurement_noise 的语义不同——measurement_noise 是标准差，直接平方为方差。
# 前提指导 §1.1 主表 8 维 + §2.3 紧耦合扩维（uwb_clock_bias / vio_scale），全体同增同模型。
process_noise:
  # 位置状态的过程噪声。# 值越大，滤波器越允许位置缓慢漂移。
  pos: 0.05  # 位置扩散强度。
  # 速度状态的过程噪声。# 值越大，滤波器越允许速度随时间变化。
  vel: 0.10  # 速度扩散强度。
  # 航向角的过程噪声。# 值越大，滤波器越允许朝向变化更快。
  yaw: 0.02  # 航向扩散强度。
  # 加速度计偏置的过程噪声。# 表示对 IMU 偏置随时间变化的容忍度。
  accel_bias: 0.001  # 加速度计偏置扩散强度。
  # 陀螺仪偏置的过程噪声。# 表示对角速度偏置漂移的容忍度。
  gyro_bias: 0.001  # 陀螺仪偏置扩散强度。
  # UWB 钟差随机游走噪声（PSD 平方根，单位: m/√s）。§2.3 在线时间偏移与钟差态前提要求显式配非零值。
  uwb_clock_bias: 0.001  # UWB 钟差扩散强度（与加速度/陀螺偏置同量级）。
  # VIO 尺度因子随机游走噪声（PSD 平方根，无量纲/√s）。§2.3 在线外参/尺度因子前提要求显式配非零值。
  vio_scale: 0.001  # VIO 尺度因子扩散强度（与加速度/陀螺偏置同量级）。

# 量测噪声仍然按传感器来源拆开。# 这样可以保持和 EKF 系列的比较口径一致。
# 这些噪声值会作为因子图中 UWB/VIO 因子的信息矩阵的逆。
# 配置值是标准差，代码中会平方为方差后使用。
measurement_noise:
  # UWB 距离量测噪声标准差。# 数值越大表示越不信任 UWB 距离。
  uwb: 0.25  # UWB 测距噪声标准差（米）。
  # VIO 量测噪声块。# 位置和航向分别单独给出。
  vio:
    # VIO 位置量测噪声标准差。# 值越大表示越不信任视觉位置结果。
    pos: 0.08  # VIO 位置噪声标准差（米）。
    # VIO 航向量测噪声标准差。# 值越大表示越不信任视觉航向结果。
    yaw: 0.03  # VIO 航向噪声标准差（弧度）。

# 初始状态默认放在原点附近。# 这样表示系统启动时不强行假设偏离很大，避免给优化器额外偏置。
# 差冷启动（§1.4 / §8.4）：均值不给真值邻域热启动；P0 故意偏大。
# 全员同一分布（EKF / Robust-EKF / FGO 同口径）。位置 σ≈5 m、航向 σ≈1 rad。
# §2.3 紧耦合扩维：uwb_clock_bias 初值 0.0（无钟差），vio_scale 初值 1.0（标准尺度）。
init_state:
  px: 0.0
  py: 0.0
  vx: 0.0
  vy: 0.0
  yaw: 0.0
  bax: 0.0
  bay: 0.0
  bg: 0.0
  uwb_clock_bias: 0.0  # UWB 钟差初值（m），0.0 表示无初始钟差。
  vio_scale: 1.0  # VIO 尺度因子初值（无量纲），1.0 表示标准尺度（紧耦合 §2.3）。

# 初始协方差与 state_items 顺序一一对应（10 维，§2.3 紧耦合扩维）。
init_cov:
  - 25.0   # px σ≈5 m
  - 25.0   # py
  - 1.0    # vx
  - 1.0    # vy
  - 1.0    # yaw σ≈1 rad
  - 0.05   # bax
  - 0.05   # bay
  - 0.02   # bg
  - 0.05   # uwb_clock_bias σ≈0.22 m（与加速度/陀螺偏置同量级，允许在线辨识）
  - 0.01   # vio_scale σ≈0.1（小方差围绕标准尺度 1.0，避免初期尺度剧烈震荡）
