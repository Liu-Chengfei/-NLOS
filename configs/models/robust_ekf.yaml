# 文件职责：定义 Robust-EKF 模型的固定超参数，供工厂和脚本路由使用。
# 这里保存不依赖学习前端的鲁棒滤波参数，重点是抑制离群量测。
# 下游通常用它作为纯几何/纯滤波基线，与普通 EKF 的区别在于增加了鲁棒核和门限过滤。

# 模型名称，供工厂和脚本路由使用。
name: robust_ekf  # 鲁棒扩展卡尔曼滤波器。

# 过程噪声按状态分量单独拆开。# 这样可以分别控制位置、速度、航向和偏置的扩散速度。
# 和其他 EKF 系列保持同一口径，便于公平比较。
# 配置值是噪声强度（PSD平方根，单位: state_unit/sqrt(s)），代码中离散化为 σ²*dt。
# 注意：这与 measurement_noise 的语义不同——measurement_noise 是标准差，直接平方为方差。
# 前提指导 §1.1 主表 8 维 + §2.3 紧耦合扩维（uwb_clock_bias / vio_scale），全体同增同模型。
process_noise:
  # 位置状态的过程噪声。# 值越大，滤波器越允许位置缓慢漂移。
  pos: 0.05  # 位置扩散强度。
  # 速度状态的过程噪声。# 值越大，滤波器越允许速度随时间变化。
  vel: 0.10  # 速度扩散强度。
  # 航向角的过程噪声。# 值越大，滤波器越允许朝向变化更快。
  yaw: 0.02  # 航向扩散强度。
  # 加速度计偏置的过程噪声。# 表示对 IMU 偏置随时间变化的容忍度。
  accel_bias: 0.001  # 加速度计偏置扩散强度。
  # 陀螺仪偏置的过程噪声。# 表示对角速度偏置漂移的容忍度。
  gyro_bias: 0.001  # 陀螺仪偏置扩散强度。
  # UWB 钟差随机游走噪声（PSD 平方根，单位: m/√s）。§2.3 在线时间偏移与钟差态前提要求显式配非零值。
  uwb_clock_bias: 0.001  # UWB 钟差扩散强度（与加速度/陀螺偏置同量级）。
  # VIO 尺度因子随机游走噪声（PSD 平方根，无量纲/√s）。§2.3 在线外参/尺度因子前提要求显式配非零值。
  vio_scale: 0.001  # VIO 尺度因子扩散强度（与加速度/陀螺偏置同量级）。

# 量测噪声同样按传感器来源拆开。# 这样便于单独调 UWB 和 VIO 的可信度。
# 与 ekf.yaml / fgo.yaml 保持同一口径，RobustEKF 的鲁棒性通过 Huber 权重实现，不通过加大噪声 std 实现。
# 配置值是标准差，代码中会平方为方差后使用。
measurement_noise:
  # UWB 距离量测噪声标准差。# P13 R/Q 真实标定，与 ekf.yaml 同步。
  # P13 R/Q 真实标定 (2026-09-02 修复): sim_e9 LOS 段 σ≈0.6m，与 S4 LOS σ0.6m 对齐。
  uwb: 0.6   # UWB 测距噪声标准差（米）。
  # VIO 量测噪声块。# P13 与 ekf.yaml 同步。
  vio:
    # VIO 位置量测噪声标准差。# V0 健康档位置噪声。
    pos: 0.02
    # VIO 航向量测噪声标准差。# V0 健康档航向噪声。
    yaw: 0.02

# B16: 标定段冻结 (LOS 标定后禁止 R 在线缩放)。NN 头 (uwb_scaling/vio_scaling) 仍可生效。
calibration_frozen: true

# 初始状态默认放在原点附近。# 这样表示系统启动时不强行假设偏离很大，避免人为偏置。
# 差冷启动（§1.4 / §8.4）：均值不给真值邻域热启动；P0 故意偏大。
# 全员同一分布（EKF / Robust-EKF / FGO 同口径）。位置 σ≈5 m、航向 σ≈1 rad。
# §2.3 紧耦合扩维：uwb_clock_bias 初值 0.0（无钟差），vio_scale 初值 1.0（标准尺度）。
init_state:
  px: 0.0
  py: 0.0
  vx: 0.0
  vy: 0.0
  yaw: 0.0
  bax: 0.0
  bay: 0.0
  bg: 0.0
  uwb_clock_bias: 0.0  # UWB 钟差初值（m），0.0 表示无初始钟差。
  vio_scale: 1.0  # VIO 尺度因子初值（无量纲），1.0 表示标准尺度（紧耦合 §2.3）。

# 2026-07-26 协议 B14 落地（必须显式写 gate 块，否则代码 _nis_threshold 默认 inf → 永不拒识）。
# 协议 B14 取值：uwb/vio 双侧卡方 0.95（χ²(1, 0.95) = 3.841；旧 6.635 是 0.99 临界值，B14 不允许）。
# 与 ekf.yaml 同步写 gate 块（B14 不允许只在 ekf 写、robust_ekf 不写不等价）。
gate:
  mahalanobis_sq:
    uwb: 3.841   # χ²(1, 0.95) = 3.841；UWB 残差 1 维标量
    vio: 7.815   # χ²(3, 0.95) = 7.815；VIO 残差 3 维 [dx, dy, dyaw]
  # quality_floor 走代码默认 BRIDGE_THRESHOLDS；如需调可在 override 网格覆盖。

# Robust-EKF 身份核心：固定 Huber 核（B15）。标准 ekf.yaml **不得**含本块。
# cmp2：双方共享 gate 卡方；本方法额外固定 Huber δ=1.345，不可学习、不可按场景私调。
robust_weight:
  type: huber
  delta: 1.345   # Huber δ；95% 高斯效率（经典）。

# 初始协方差与 state_items 顺序一一对应（10 维，§2.3 紧耦合扩维）。
init_cov:
  - 25.0   # px σ≈5 m
  - 25.0   # py
  - 1.0    # vx
  - 1.0    # vy
  - 1.0    # yaw σ≈1 rad
  - 0.05   # bax
  - 0.05   # bay
  - 0.02   # bg
  - 0.05   # uwb_clock_bias σ≈0.22 m（与加速度/陀螺偏置同量级，允许在线辨识）
  - 0.01   # vio_scale σ≈0.1（小方差围绕标准尺度 1.0，避免初期尺度剧烈震荡）
