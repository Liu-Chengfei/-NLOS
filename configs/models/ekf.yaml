# 文件职责：定义 EKF 模型的固定超参数，供工厂和脚本路由使用。
# 这里保存纯扩展卡尔曼滤波器的固定超参数，不包含任何学习模型参数。
# 下游通常由训练、评估或基线脚本直接读取，让传统滤波器按同一套口径实例化。
name: ekf  # 模型名称，供工厂和脚本路由使用。

# 过程噪声按状态分量单独拆开。# 这样可以分别控制位置、速度、航向和偏置的扩散速度。
# 配置值是噪声强度（PSD平方根，单位: state_unit/sqrt(s)），代码中离散化为 σ²*dt。
# 注意：这与 measurement_noise 的语义不同——measurement_noise 是标准差，直接平方为方差。
# 前提指导 §1.1 主表 8 维 + §2.3 紧耦合扩维（uwb_clock_bias / vio_scale），全体同增同模型。
process_noise:
  # 位置状态的过程噪声。# 值越大，滤波器越允许位置缓慢漂移。
  pos: 0.05  # 位置扩散强度。
  # 速度状态的过程噪声。# 值越大，滤波器越允许速度随时间变化。
  vel: 0.10  # 速度扩散强度。
  # 航向角的过程噪声。# 值越大，滤波器越允许朝向变化更快。
  yaw: 0.02  # 航向扩散强度。
  # 加速度计偏置的过程噪声。# 表示对 IMU 偏置随时间变化的容忍度。
  accel_bias: 0.001  # 加速度计偏置扩散强度。
  # 陀螺仪偏置的过程噪声。# 表示对角速度偏置漂移的容忍度。
  gyro_bias: 0.001  # 陀螺仪偏置扩散强度。
  # UWB 钟差随机游走噪声（PSD 平方根，单位: m/√s）。§2.3 在线时间偏移与钟差态前提要求显式配非零值，
  # 否则即使更新步雅可比列非零，卡尔曼增益也会因 P 不增长而接近 0，钟差永远卡在初值。
  uwb_clock_bias: 0.001  # UWB 钟差扩散强度（与加速度/陀螺偏置同量级）。
  # VIO 尺度因子随机游走噪声（PSD 平方根，无量纲/√s）。§2.3 在线外参/尺度因子前提要求显式配非零值。
  vio_scale: 0.001  # VIO 尺度因子扩散强度（与加速度/陀螺偏置同量级）。

# 量测噪声同样按传感器来源拆开。# 这样便于单独调 UWB 和 VIO 的可信度。
# 配置值是标准差，代码中会平方为方差后使用。
measurement_noise:
  # UWB 距离量测噪声标准差。# 数值越大表示越不信任 UWB 距离。
  # P13 R/Q 真实标定 (2026-09-02 修复): sim_e9 LOS 段 σ≈0.6m（手册 S4 LOS 基准 σ0.6m），
  # 原 0.25m 偏低导致 EKF 过拟合 LOS 段；与 sim_materializer 注入噪声一致改 0.6m。
  uwb: 0.6   # UWB 测距噪声标准差（米），与 S4 LOS σ0.6m 对齐。
  # VIO 量测噪声块。# 位置和航向分别单独给出。
  vio:
    # VIO 位置量测噪声标准差。# 值越大表示越不信任视觉位置结果。
    pos: 0.02  # V0 健康档位置噪声 σ≈0.01-0.03m/步 中位值
    # VIO 航向量测噪声标准差。# 值越大表示越不信任视觉航向结果。
    yaw: 0.02  # V0 健康档航向噪声

# B16: 标定段冻结 (LOS 标定后禁止 R 在线缩放)。NN 头 (uwb_scaling/vio_scaling) 仍可生效。
# §2.2 注释放宽后这里通过显式 opt-in 标定冻结满足 B16 硬门。
calibration_frozen: true

# 初始状态默认放在原点附近。# 这样表示系统启动时不强行假设偏离很大。
# 差冷启动（§1.4 / §8.4）：均值不给真值邻域热启动；P0 故意偏大。
# 全员同一分布（EKF / Robust-EKF / FGO 同口径）。位置 σ≈5 m、航向 σ≈1 rad。
# §2.3 紧耦合扩维：uwb_clock_bias 初值 0.0（无钟差），vio_scale 初值 1.0（标准尺度）。
init_state:
  px: 0.0
  py: 0.0
  vx: 0.0
  vy: 0.0
  yaw: 0.0
  bax: 0.0
  bay: 0.0
  bg: 0.0
  uwb_clock_bias: 0.0  # UWB 钟差初值（m），0.0 表示无初始钟差。
  vio_scale: 1.0  # VIO 尺度因子初值（无量纲），1.0 表示标准尺度（紧耦合 §2.3）。

# 门控（B14）：标准 EKF 与 Robust-EKF **共享卡方**门槛；必须显式写 gate，
# 否则 _nis_threshold 在 gate 缺失时返回 inf → 永不拒识。
# 协议 B14：uwb/vio 双侧卡方 0.95。
# cmp2 同档前提：双方卡方开启且参数同源；差异只应来自「有无固定 Huber 核」。
gate:
  mahalanobis_sq:
    uwb: 3.841   # χ²(1, 0.95)；UWB 1-DoF
    vio: 7.815   # χ²(3, 0.95)；VIO 3-DoF

# 标准 EKF 身份：禁止 robust_weight / Huber。
# 有 robust_weight 会与 robust_ekf 实质同实现，cmp2「标准≈Robust」同档叙事破产。
# ekf_core._huber_weight 在 robust_weight 缺失时强制返回 1.0（平方损失）。
# Robust-EKF 见 robust_ekf.yaml 的 robust_weight 块。

# 初始协方差与 state_items 顺序一一对应（10 维，§2.3 紧耦合扩维）。
init_cov:
  - 25.0   # px σ≈5 m
  - 25.0   # py
  - 1.0    # vx
  - 1.0    # vy
  - 1.0    # yaw σ≈1 rad
  - 0.05   # bax
  - 0.05   # bay
  - 0.02   # bg
  - 0.05   # uwb_clock_bias σ≈0.22 m（与加速度/陀螺偏置同量级，允许在线辨识）
  - 0.01   # vio_scale σ≈0.1（小方差围绕标准尺度 1.0，避免初期尺度剧烈震荡）
