# 条款 [146] 决策日志（decision log）配置
# 手册原文：Pre-2 决策日志（decision log）自实验方案冻结起，每次改动（数据/代码/配置/参数）记录：时间、改动内容、原因、影响范围、git commit

clause_id: "146"
clause_name: "决策日志（decision log）- 实验方案冻结后所有改动记录"

# 核心断言：自方案冻结起所有改动必须记录
decision_log:
  required: true
  description: "自实验方案冻结（Pre-2）起，每次改动必须记录决策日志"
  freeze_start: "实验方案冻结（Pre-2）时刻"
  scope:
    - "数据改动"
    - "代码改动"
    - "配置改动"
    - "参数改动"
  trigger: "实验方案冻结（Pre-2）后自动启用"
  required_fields:
    - "timestamp（时间）"
    - "change_content（改动内容）"
    - "reason（原因）"
    - "impact_scope（影响范围）"
    - "git_commit（git commit）"
  audit_trail: true
  rollback_capable: true

# 实施载体
implementation:
  file: "src/liquidloc/common/parallel_scheduling_decision_log.py"
  mechanism: "decision_log 记录机制"
  pre2_trigger: "实验方案冻结后自动启用"
  existing_templates:
    - "decision_log_template.md"
    - "decision_log_run1.md"
    - ".audit/decision_log.json"

# 相关条款
related_checks:
  - "Pre-2"
  - "P144"
  - "P145"
  - "R-2"
  - "R-3"

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: >
  实验方案冻结（Pre-2）后，任何数据/代码/配置/参数的改动都必须记录决策日志。
  决策日志必须包含五个必记录字段：时间（timestamp）、改动内容（change_content）、
  原因（reason）、影响范围（impact_scope）、git commit（git_commit）。
  未记录决策日志的改动视为非法变更，相关实验结果必须作废。
  决策日志用于审计追踪和回滚能力，确保实验全程可追溯。

# 违规后果
violation_consequence: "未记录决策日志 → 无法追溯变更，影响实验可复现性，相关实验结果作废"
