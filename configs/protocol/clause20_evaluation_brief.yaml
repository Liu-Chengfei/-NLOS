# 条款[20]：评估口径（治理层）
# 版本: 2026-05-04 (初始版本)
# 修订: 2026-05-04 (补全规则文件)

clause_id: 20
clause_name: 评估口径
constraint_level: 硬约束
governance_phase: 零

# 核心判据
criterion:
  - Sim/Umeyama轨迹对齐（必做）
  - 2D（x,y）世界系误差
  - warm-up前10秒剔除
  - 轨迹级汇总
  - 分析单位统一

# 禁止项
forbidden:
  - 帧级评估代替轨迹级评估
  - 修改warm-up剔除时长
  - 图表口径与正文/表不一致

# 允许范围
allowed:
  - 帧级仅作描述性补充（需显式标注）

# 执行保障
execution:
  rule_file: rules/评估口径.md
  config_file: configs/protocol/clause20_evaluation_brief.yaml
  check_function: clause_gates.py:p20_gate_exit_deliverables
  precommit_hook: .git/hooks/pre-commit
  agents_md: AGENTS.md
  status_table: rules/指令状态表.md
  report: outputs/compliance_report_20.md
