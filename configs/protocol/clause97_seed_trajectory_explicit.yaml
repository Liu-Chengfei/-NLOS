# 条款 [97] seed/轨迹数/独立实验数是否明示？
# 手册原文：seed/轨迹数/独立实验数是否明示？；高兼容默认：表注或实验设置（含 seed 数、轨迹级样本数、独立实验数）；不满足时：补明示
# 对应手册 docs/最终交付_异步手册_424条_20260917.md:332

clause_id: "97"
clause_name: "seed/轨迹数/独立实验数明示"

# 明示要求
explicit_declaration:
  seed_count:
    required: true
    paper_level: 10  # 论文级硬约束，见 [129]
  trajectory_per_seed:
    required: true
    paper_level: 100  # 每条测试轨迹，见 [62]
  independent_experiments:
    required: true
    description: "10 seed × 5 方法 = 50 单元（见 [47] 三层证据结构总表）"

# 高兼容默认：表注或实验设置
compliance_path:
  table_footnote:
    enabled: true
    required_fields:
      - "seed_count"
      - "trajectory_per_seed"
      - "independent_experiments"
  experiment_settings_section:
    enabled: true
    required_fields:
      - "seed_count"
      - "trajectory_per_seed"
      - "independent_experiments"
      - "layout_configuration"
      - "gear_levels"

# 四组合验证
four_combinations:
  required: true
  combinations:
    - "A2N2"
    - "A2N3"
    - "A3N2"
    - "A3N3"
  per_combination_min_trajectory: 25  # 每组合>=25，见 [62]
  total_min_trajectory: 100  # 总计>=100，见 [62]

# 数据层对应
data_layers:
  main_scenario: "S1-S3 固定布局，10 seed × 5 方法 = 50 单元"
  layout_randomization: "N_layout >= 6(入门)/10(推荐)，每布局 5 方法 × 2-3 seed"
  miluv_external: "MILUV 数据集，独立声明"

# 明示格式示例
example_declaration:
  table_footnote_example: |
    表注：本文实验基于 10 个独立随机种子（seed 0-9），每个种子包含 >=100 条测试轨迹，
    四组合（A2N2/A2N3/A3N2/A3N3）各至少 25 条。50 个独立单元（10 seed × 5 方法）
    构成论文级规模（见条款 [62]）。
  experiment_settings_example: |
    实验设置：seed 数=10，每条测试轨迹长度=120s（论文级），
    每 seed 测试轨迹数 >=100，四组合各 >=25 条，
    独立实验数=50（10 seed × 5 方法）。

# 验证规则
validation_rules:
  - "配置必须存在且能正确解析"
  - "clause_id 必须为 '97'"
  - "explicit_declaration.seed_count.required 必须为 true"
  - "explicit_declaration.trajectory_per_seed.required 必须为 true"
  - "explicit_declaration.independent_experiments.required 必须为 true"
  - "four_combinations.required 必须为 true"
  - "four_combinations.combinations 必须包含全部四个组合"
  - "manual_ref 必须指向正确路径和行号"
  - "手册真源文件必须存在"

# 参考路径
manual_ref: "docs/最终交付_异步手册_424条_20260917.md:332"
manual_line: 332
verification_gate: "p102_seed_trajectory_explicit"
