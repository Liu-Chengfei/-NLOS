# 条款 [191] · 每 seed 一份校验报告（JSON），与 manifest 并存
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 609 行

clause_id: "191"
clause_name: "每seed校验报告（JSON），与manifest并存"
severity: hard

output_spec:
  purpose: |
    每 seed 一份校验报告（JSON），与 manifest 并存。
    该报告须在 s9_validate_seeds.py 执行时写入各 seed 子目录，
    字段须与整体聚合报告中的对应字段一致。

  per_seed_report:
    description: "每 seed 的独立 S9 校验报告"
    filename: "s9_validation_report.json"
    location: "seed 子目录（与 manifest.json 同级）"
    required_fields:
      - "seed"
      - "n_sequences"
      - "composition"
      - "composition_pass"
      - "nlos_injection"
      - "nlos_pass"
      - "missing_stats"
      - "missing_pass"
      - "gdop"
      - "gdop_pass"
      - "boundary_violations"
      - "boundary_pass"
      - "timestamp_monotonic"
      - "imu_rate_hz"
      - "imu_rate_pass"
      - "schema_pass"
      - "schema_failures"
      - "overall_pass"

  implementation:
    script: "scripts/s9_validate_seeds.py"
    function: "main()"
    loop_body: "在 for seed_root in seeds 循环内，验证完成后写入 seed_root / 's9_validation_report.json'"
    trigger_timing: "S9 校验脚本每次执行时"
    co_exist: "报告文件与 manifest.json 同目录（seed 根目录下）"

verification_items:
  per_seed_report_exists:
    description: "每个 seed 目录下存在 s9_validation_report.json"
    checks:
      - per_seed_report_file_exists
      - per_seed_report_has_required_fields
      - per_seed_report_fields_match_aggregate

boundaries:
  forbidden:
    - "只有聚合报告无 per-seed 报告"
    - "per-seed 报告字段缺失或不完整"
    - "per-seed 报告写在错误路径（非 seed 根目录）"
  required:
    - "每个 seed 子目录必须有 s9_validation_report.json"
    - "报告字段完整，含 overall_pass"
    - "报告与 manifest.json 同目录"

related_clauses:
  - "190"
  - "192"
  - "195"
  - "202"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
