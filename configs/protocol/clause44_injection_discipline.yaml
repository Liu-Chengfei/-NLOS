# 文件职责：声明手册第44条配置落点 —— 档位注入纪律。
# 本文件是手册第44条的配置落点，回答「参数怎么注入」。
# 第44条要求：A轴为静态时钟偏移/延迟统计口径，严格按静态口径注入，不引入随时间线性增长的时钟漂移作为额外档位。

# 档位注入纪律（对应手册第[44]条）
discipline_name: "条款44 档位注入纪律"

# 注入什么：静态时钟偏移/延迟统计口径
inject_what: "静态时钟偏移/延迟统计口径"

# A轴性质：静态时钟偏移/延迟统计口径（数值见 Stage 1 档位协议条款 A 轴表）
a_axis_nature: "静态时钟偏移/延迟统计口径"
a_axis_source: "Stage 1 档位协议条款 A 轴表"

# 严格按静态口径注入（不引入动态漂移）
strict_static_injection: true

# 禁止引入随时间线性增长的时钟漂移作为额外档位
forbidden_drift_as_level: true

# 漂移评估路径：协议裁决项 + 敏感性分析
drift_evaluation_path: "协议裁决项 + 敏感性分析"
forbidden_drift_description: "不引入随时间线性增长的时钟漂移作为额外档位（如需评估 → 协议裁决项 + 敏感性分析）"
