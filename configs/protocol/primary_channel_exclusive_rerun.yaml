# 主执行通道独占重跑协议（硬约束）
# 对应手册第35条 (docs/异步实验_执行手册_终版v15_总纲条款版.md 第280行)
# 五铁律：唯一真源=手册原文，状态只认磁盘，逐字执行
protocol_version: "v15"
manual_reference: "docs/异步实验_执行手册_终版v15_总纲条款版.md 第280行"
clause_id: "35"

# 重跑策略
rerun_policy:
  policy_name: "主执行通道独占重跑"
  primary_channel_exclusive: true
  description: >
    需重跑时，必须由主执行通道独占执行重跑操作，
    不派发给其他通道（如辅助通道、备用通道、并行通道等）。
    重跑期间其他通道禁止介入或共享重跑资源。

# 通道分配
channel_assignment:
  primary_channel_only: true
  other_channels_not_assigned: true
  description: >
    重跑任务仅分配给主执行通道，其他通道不分配任何重跑任务。
    禁止将重跑拆分或派发给非主通道执行。

# 禁止项
prohibition:
  no_rerun_delegation: true
  description: >
    严禁将重跑任务派发给其他通道执行。
    重跑期间其他通道不得介入、不得共享重跑上下文、
    不得以协作、辅助、并行等名义参与重跑执行。

# 约束声明
constraint_declaration:
  clause_reference: "手册第35条"
  discipline_level: "hard"
  primary_channel_exclusive: true
  no_delegation_allowed: true
  other_channels_barred: true
  rerun_solo_execution: true
  description_constraint: >
    需重跑时，主执行通道独占重跑，不派给其他通道。
    任何情况下不得将重跑任务拆分或分配给非主通道。
