# 档位协议条款 · [31] gate 出口全绿才前进
# 对应手册第272行 (docs/异步实验_执行手册_终版v15_总纲条款版.md 第272行)
# 五铁律：唯一真源=手册原文，状态只认磁盘，逐字执行
#
# [31] gate 出口全绿才前进——本批 gate 的必交物（对照必交物表逐行）全部存在且断言通过（核对脚本），才写 decision log 增量并进入下一 gate

protocol_version: 27
clause_reference: "docs/异步实验_执行手册_终版v15_总纲条款版.md 第272行"
clause_number: 31
clause_name: "gate 出口全绿才前进"

description: "本批 gate 的必交物（对照必交物表逐行）全部存在且断言通过（核对脚本），才写 decision log 增量并进入下一 gate"

constraint_declaration:
  # 核心约束：gate 出口全绿才前进
  exit_green_only: true
  # 必交物判定方式：对照必交物表逐行
  check_method: "逐行对照必交物表"
  # 断言通过方式：核对脚本
  assertion_method: "核对脚本"
  # 全绿才写 decision log 增量并进入下一 gate
  write_decision_on_green_only: true
  advance_on_green_only: true

# 必交物对照检查项（逐行对照）
required_items:
  # 核对脚本断言通过
  - name: "断言通过（核对脚本）"
    description: "gate 的必交物全部断言通过，核对脚本返回全绿"
    check_via: "核对脚本"
  # 必交物全部存在
  - name: "必交物全部存在"
    description: "对照必交物表逐行核对，所有必交物均存在于磁盘"
    check_via: "逐行对照"
  # 写 decision log 增量
  - name: "写 decision log 增量"
    description: "仅 gate 全绿时才写 decision log 增量"
    check_via: "decision log"
  # 进入下一 gate
  - name: "进入下一 gate"
    description: "仅 gate 全绿时才进入下一 gate"
    check_via: "gate 出口判据"

# 禁止项
forbidden:
  # 不允许未全绿就前进
  - name: "未全绿前进"
    description: "gate 未全绿时不允许写 decision log 增量或进入下一 gate"
