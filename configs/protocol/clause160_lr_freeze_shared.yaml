# Clause [160] 分阶段 lr 冻结 + 5 方法共用
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [160]

clause_id: "160"
clause_name: "分阶段 lr 属训练超参方案（冻结 + 5 方法共用）"
severity: hard

# 核心约束
constraints:
  lr_is_hyperparameter: true
  freeze_at_code_freeze: true
  write_to_manifest: true
  shared_schedule_among_5_methods: true
  equal_tuning_budget: true
  no_degradation: true

# 5 方法共用
methods:
  shared_schedule: true
  methods:
    - "LNN"
    - "LSTM"
    - "Transformer"
    - "EKF"           # 不适用 lr，manifest 标注"不适用"
    - "Robust-EKF"    # 不适用 lr，manifest 标注"不适用"
  note_filter_methods: "EKF 和 Robust-EKF 无训练过程，不适用 lr schedule，但需在 manifest 中注明"

# manifest 要求
manifest_requirements:
  lr_schedule_params:
    - "lr_peak"
    - "lr_end"
    - "warmup_epochs"
    - "decay_type"  # cosine_annealing 或 piecewise_constant
  required_fields:
    - "lr_schedule_params"

# 相关条款
related_checks:
  - "159"    # 学习率分阶段调度实现
  - "161"    # lr 参数写入 manifest
  - "145"    # 代码冻结清单

# 手册参照
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
