# 条款 [184] · 与主场景的数据独立性
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 588 行

clause_id: "184"
clause_name: "与主场景的数据独立性"
severity: hard

# 核心约束：每个布局的轨迹必须重新生成，禁止复用主场景轨迹或"换标签"
data_independence:
  # 每布局必须重新生成
  regenerate_per_layout: true
  # 禁止复用主场景轨迹
  forbid_reuse_main_scene: true
  # 禁止"换标签"冒充新数据
  forbid_label_swapping: true

# scene manifest 化要求
scene_manifest:
  # 同协议、同代码，只换 scene 配置参数
  same_protocol: true
  same_code: true
  scene_config_changed_only: true
  # scene manifest 化后每个布局使用独立的 scene 配置
  per_layout_scene_config: true

# 验证项
verification_items:
  # 1. 配置文件存在且内容正确
  config_exists: true
  # 2. 规则文档存在
  rule_doc_exists: true
  # 3. 验证器函数存在
  validator_exists: true

# 相关条款映射
related_checks:
  - "183"   # 每布局全部参数 + 随机根种子写入该布局 manifest
  - "186"   # 新增验证层，复用脚手架，S9 校验按各布局专属期望执行
  - "295"   # S9 校验：场景 manifest 化后每布局独立校验

# 边界约束
boundaries:
  forbidden:
    - "复用主场景轨迹"
    - "换标签冒充新数据"
    - "不同布局共享同一轨迹文件"
  required:
    - "每个布局必须重新生成轨迹"
    - "轨迹生成只换 scene 配置参数"
    - "scene manifest 化"

# 约束声明
constraint_declaration:
  clause_id: "184"
  binding_level: "hard"
  violation_consequence: "复用主场景轨迹或换标签 → 数据独立性破坏，须 RZ-1 重生成所有布局数据"
  related_clauses:
    - "[183] 每布局全部参数 + 随机根种子写入该布局 manifest"
    - "[186] 新增验证层，复用 I-1–I-5/P22 脚手架，S9 校验按各布局专属期望执行"
    - "[295] S9 校验：场景 manifest 化后每布局独立校验"

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: >
  本条款规定每个布局的轨迹必须重新生成，禁止复用主场景轨迹或"换标签"冒充新数据。
  核心要求包括：
  1. 同协议、同代码，只换 scene 配置参数（scene manifest 化）
  2. 每个布局有独立的轨迹生成过程
  3. scene 配置通过 manifest 管理，不同布局使用不同的 scene 配置参数
  
  关键约束：
  - 禁止跨布局复用轨迹文件
  - 禁止通过修改标签来冒充新数据
  - scene 配置必须 manifest 化，每个布局独立配置
