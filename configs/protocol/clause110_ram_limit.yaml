# [110] RAM ≤12G 硬上限
# 手册原文（第 348 行）：[110] RAM ≤12G 硬上限（执行模式/执行模式·RAM ≤12G 硬上限）；代码实现要求（细化）：并发调度器按"并发单元数 × 单单元峰值内存 ≤ 12GB"计算 RAM 闸门；无 0.8 模糊系数；超限降并发或降为串行排队

clause_id: "110"

# 约束声明（binding_level = hard 表示违反则阻断完整规模训练入口）
constraint_declaration:
  clause_id: "110"
  binding_level: hard
  violation_consequence: "超过 12GB 硬上限时，自动降并发或转为串行排队，阻止完整规模训练启动"

# RAM 硬上限配置
ram_limit_hard_cap:
  max_gb: 12
  no_fuzzy_coefficient: true
  unit: GB
  description: "RAM 硬上限 12GB，无 0.8 模糊系数"

# 并发调度器规则
concurrent_scheduler_rule:
  enforcement: hard
  formula: "并发单元数 × 单单元峰值内存 ≤ 12GB"
  formula_vars:
    - concurrent_units: "当前调度的并发单元数"
    - peak_memory_per_unit_mb: "单单元峰值内存（MB）"
    - max_gb: 12
  description: "并发调度器按公式计算 RAM 闸门"

# 超限策略
over_limit_strategy:
  strategies:
    - reduce_concurrency
    - fallback_serial_queue
  description: "超过 RAM 硬上限时，优先降并发，若仍超限则降为串行排队"

# 手册真源引用
manual_line: 348
manual_text: |
  [110] RAM ≤12G 硬上限（执行模式/执行模式·RAM ≤12G 硬上限）；代码实现要求（细化）：并发调度器按"并发单元数 × 单单元峰值内存 ≤ 12GB"计算 RAM 闸门；无 0.8 模糊系数；超限降并发或降为串行排队