# Clause [168] 训练超参显式表（硬约束）
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [168]

clause_id: "168"
clause_name: "训练超参显式表"
severity: hard

# 核心约束
training_hyperparam_table:
  required: true
  code_freeze_frozen: true          # 方案冻结（code freeze）时按此表定死
  manifest_write: true              # 逐项写入 manifest
  shared_among_5_methods: true      # 5 方法共用同一表
  filter_methods_excluded: true     # 滤波方法（EKF/Robust-EKF）无训练不适用

# 训练超参表字段（硬约束，缺一不可）
hyperparam_table:
  - field: "lr_start"
    value: 0
    description: "warm-up 起始 lr"
    write_to_manifest: true
  - field: "warmup_epochs"
    alias: "N1"
    description: "warm-up 线性升阶段 epoch 数"
    write_to_manifest: true
  - field: "lr_peak"
    description: "峰值 lr；论文级值写入 manifest"
    paper_level_range:
      literature: [1e-4, 1e-3]
      ltc_original: [1e-3, 2e-2]
    write_to_manifest: true
  - field: "lr_end"
    description: "后段衰减结束 lr"
    write_to_manifest: true
  - field: "switch_epoch"
    description: "前/后段切换 epoch 点（warmup 结束点）"
    write_to_manifest: true
  - field: "decay_type"
    allowed_values:
      - "cosine_annealing"
      - "piecewise_constant"
    description: "后段衰减方式二选一"
    write_to_manifest: true
  - field: "learning_rate_range"
    value: "1e-4 至 1e-3"
    description: "学习率区间必须覆盖文献推荐范围"
    write_to_manifest: true

# 适用网络（硬约束，三者统一采用三段式 lr 调度）
applicable_networks:
  - "LNN"
  - "LSTM"
  - "Transformer"

# 不适用网络
excluded_networks:
  - "EKF"
  - "Robust-EKF"

# 方案冻结要求
code_freeze:
  frozen_at: "code_freeze 时刻"
  no_modification_after_freeze: true
  exceptions: "仅允许在 code freeze 前修改，freeze 后不得修改超参表"

# 写入 manifest 要求
manifest_write:
  required: true
  fields:
    - "lr_start"
    - "warmup_epochs"
    - "lr_peak"
    - "lr_end"
    - "switch_epoch"
    - "decay_type"
    - "learning_rate_range"

# 非全量规模说明
non_full_scale:
  smoke:
    description: "冒烟：1 序列/seed 级临时小数据（I-3 口径）"
  quick:
    description: "quick 校准按 Part 2 冒烟合格标准"

# 相关条款
related_checks:
  - "P39"        # 结果持久化
  - "157"        # checkpoint 落盘格式
  - "158"        # 日志含 git commit + 配置 hash
  - "159"        # 学习率分阶段调度协议
  - "160"        # 5 方法共用 lr 调度
  - "161"        # lr 参数写入 manifest
  - "165"        # 对照基线
  - "166"        # 产物存活性

# 手册参照
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
