clause_id: "135"
clause_name: "档位参数回查 Stage 1 档位协议条款"
status: enforced

sole_authority:
  reference: "Stage 1 档位协议条款"
  source_document: "docs/五轴档位协议定义.md"
  config_directory: "configs/protocol"
  
gear_param_checks:
  axis_a:
    params: ["UWB_clock_offset", "UWB_round_trip_delay", "IMU_clock_offset", "IMU_sampling_jitter", "VIO_clock_offset", "VIO_processing_latency"]
    reference: "axis_a_sync.yaml"
    rule: "rules/档位协议_A 轴_同步精度.md"
    
  axis_n:
    params: ["NLOS_proportion_rho", "bias_mu", "noise_sigma"]
    reference: "axis_n_nlos.yaml"
    rule: "rules/档位协议_N 轴_NLOS 偏差.md"
    
  axis_v:
    params: ["feature_count", "incremental_noise_sigma", "scaling_factor", "frame_valid_rate", "gap_duration"]
    reference: "axis_v_visual.yaml"
    rule: "rules/档位协议_V 轴_视觉退化.md"
    
  axis_k:
    params: ["anchor_count", "gdop", "geometry_pattern"]
    reference: "axis_k_anchor.yaml"
    rule: "rules/档位协议_K 轴_锚分布.md"
    
  axis_m:
    params: ["uwb_loss_rate", "vio_loss_rate", "imu_loss_rate", "cluster_gap_duration"]
    reference: "axis_m_missing.yaml"
    rule: "rules/档位协议_M 轴_数据缺失.md"

referenced_checks:
  pre_checks: ["P1", "P3", "P4", "P25"]
  data_quality: ["D15", "D17"]
  other_gears: ["0-5", "0-6"]

validation:
  gear_configs_required:
    - "axis_a_sync.yaml"
    - "axis_n_nlos.yaml"
    - "axis_v_visual.yaml"
    - "axis_k_anchor.yaml"
    - "axis_m_missing.yaml"
  
  manual_source_required: "docs/五轴档位协议定义.md"
  
  forbidden_patterns:
    - "hardcoded_gear_values"
    - "duplicate_gear_definitions"
