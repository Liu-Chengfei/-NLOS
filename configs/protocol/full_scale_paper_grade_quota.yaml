# 条款 [86] 论文级完成满额判据
# 手册原文：全量必须满额 10 seed × 5 方法 × ≥100 测试轨迹才算论文级完成
# 对应 docs/最终交付_异步手册_424条_20260917.md 第321行

clause_id: "86"
clause_name: "论文级完成满额判据"

full_seed_count: 10
full_method_count: 5
full_test_trajectory_count_min: 100
paper_grade_completion_requires_full_quota: true

description: "全量必须满额 10 seed × 5 方法 × ≥100 测试轨迹才算论文级完成。缺任何一个维度即为未完成，不可用统计推断或敏感性分析替代满额要求。"

mandatory_quota:
  - dimension: "seed"
    required_count: 10
    hard_constraint: true
  - dimension: "method"
    required_count: 5
    hard_constraint: true
  - dimension: "test_trajectory"
    required_count_min: 100
    hard_constraint: true

completion_criteria:
  - full_seed_count_reached
  - full_method_count_reached
  - full_test_trajectory_count_reached
  - all_three_dimensions_satisfied

non_compliance_consequences:
  - "不得声称论文级完成"
  - "不得进入诊断/统计推断阶段"
  - "不得用敏感性分析替代满额"
  - "必须补充缺失维度至满额或如实声明规模不足"

manual_ref: "docs/最终交付_异步手册_424条_20260917.md 第321行"