# 条款 [70] 评估并行配置
# 手册原文：docs/最终交付_异步手册_424条_20260917.md 第297行
# 内容：[70] 评估并行：测试轨迹推理在 GPU 上按轨迹独立并行执行（轨迹内窗口批大小 16，轨迹间不混批，评估协议不变）

clause_id: "70"
clause_name: "评估并行"

# 评估并行核心参数
evaluation_parallel:
  mode: "轨迹独立并行"  # 轨迹独立并行执行
  gpu_execution: true     # GPU 执行目标
  trajectory_batch_size: 16  # 轨迹内窗口批大小 16
  no_batch_mixing: true   # 轨迹间不混批
  evaluation_protocol_unchanged: true  # 评估协议不变

# 参考准则
criterion_ref: "C-2"  # 参考 C-2：推理 batch=16 + 轨迹间不混批

# 实现约束
constraint_declaration:
  # 轨迹内批大小
  window_batch_size: 16
  # 轨迹独立并行
  trajectory_independent_parallel: true
  # 不混批
  no_mixing_across_trajectories: true
  # GPU 默认执行
  gpu_execution_default: true
  # 评估协议保持不变
  eval_protocol_unchanged: true

description: >
  评估并行：测试轨迹推理在 GPU 上按轨迹独立并行执行。
  - 轨迹内窗口批大小 16：每个轨迹内部采用 batch_size=16 进行窗口推理
  - 轨迹间不混批：不同轨迹的数据独立处理，不混合在同一 batch 中
  - GPU 执行：推理计算在 GPU 上完成
  - 评估协议不变：保持原有的评估逻辑与统计方法

manual_ref: "docs/最终交付_异步手册_424条_20260917.md 第297行"