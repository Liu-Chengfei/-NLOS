# 条款 [87] 诊断前洁净性 gate
# 手册原文：docs/最终交付_异步手册_424条_20260917.md 第314行
# 若少单元/坏文件/指标不可读/告警未清零，直接进诊断会让诊断结论失真

clause_id: "87"
clause_name: "诊断前洁净性gate"

diagnostic_cleanliness_gate:
  required: true
  description: "诊断前的洁净性门控，确保分析结果的可信度"
  purpose: "防止因数据缺失或文件损坏导致诊断结论失真"

issues_pre_diagnosis:
  - name: "少单元检查"
    description: "检查是否存在缺失的实验单元（如少 1 个 seed 的 LNN）"
    check_function: "check_missing_units"
    required: true

  - name: "坏文件检查"
    description: "检查是否存在损坏或不可读的实验文件"
    check_function: "check_bad_files"
    required: true

  - name: "指标不可读性检查"
    description: "检查实验指标是否完全可读（RMSE、位置偏差等）"
    check_function: "check_metrics_readable"
    required: true

  - name: "告警未清零检查"
    description: "检查诊断过程中是否存在未清零的告警"
    check_function: "check_warnings_cleared"
    required: true

disclaimer_distortion_risk:
  enabled: true
  description: "若诊断前存在上述问题，直接进入诊断会导致结论失真"
  risk_example: "少 1 个 seed 的 LNN 恰好是拖后腿的单元，诊断会误判'LNN 非最低'"
  mitigation: "必须先清理问题后才能进行诊断"

diagnostic_prohibition:
  when_issues_present: true
  description: "若 issues_pre_diagnosis 中任意一项检查失败，禁止进行后续诊断"

handbook_ref:
  file: "docs/最终交付_异步手册_424条_20260917.md"
  line: 314