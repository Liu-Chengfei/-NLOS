# 条款 [195] · DQ 检查时机：S9 正确性校验通过后、进入 Step 1 前执行
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 617 行

clause_id: "195"
clause_name: "DQ 检查时机：S9 正确性校验通过后、进入 Step 1 前执行"
severity: hard

purpose: |
  DQ（数据适配性检查 DQ-1–DQ-4）必须在 S9 正确性校验通过后、
  进入 Step 1（代码实现）前执行，形成严格的前置顺序 gate，
  确保数据适配性合格后才允许进入代码实现阶段。

execution_order:
  gate_sequence:
    - step: 1
      name: "S9 正确性校验"
      script: "src/liquidloc/analysis/s9_check.py"
      output: "每 seed 一份校验报告 JSON"
      prerequisite: "数据生成完成（manifest 存在）"
    - step: 2
      name: "DQ 检查（数据适配性检查）"
      items:
        - "DQ-1：难度梯度（信息量）"
        - "DQ-2：信噪比/可区分度"
        - "DQ-3：分布一致性（可学性）"
        - "DQ-4：样本量充分性（功效支撑）"
      prerequisite: "S9 正确性校验全部通过"
      forbidden_before: "S9 正确性校验未通过前执行 DQ 检查"
    - step: 3
      name: "进入 Step 1（代码实现）"
      prerequisite: "DQ-1–DQ-4 全部通过"
      note: "S9 通过 + DQ 通过后才允许进入 Step 1"

boundaries:
  forbidden:
    - "S9 未通过就先执行 DQ 检查"
    - "DQ 检查在 S9 正确性校验之前执行"
    - "S9 与 DQ 检查顺序颠倒"
    - "DQ 检查在 Step 1 代码实现之后才执行"
    - "先实现代码再回头补 DQ 检查"
  required:
    - "S9 正确性校验全部通过后才能执行 DQ 检查"
    - "DQ-1–DQ-4 全部通过后才能进入 Step 1"
    - "DQ 检查时序必须在 S9 之后、Step 1 之前"
    - "执行顺序须有留痕（gate 通过记录可追溯）"

verification_items:
  dq_timing_precondition:
    description: "DQ 检查时机配置：S9 通过后、Step 1 前"
    checks:
      - s9_before_dq_order_defined
      - dq_before_step1_order_defined
      - forbidden_timing_items_specified
      - prerequisite_chain_complete

related_clauses:
  - "192"
  - "193"
  - "194"
  - "196"
  - "220"
  - "262"
  - "268"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
