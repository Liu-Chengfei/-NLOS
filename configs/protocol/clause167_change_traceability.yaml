# 条款 [167] · 变更追溯链配置
# 手册位置：docs/异步实验_执行手册_终版v15_总纲条款版.md 第 554 行
# 条款原文：第9项 变更追溯链；检查方式：变更记录或不可篡改的快照机制

# 条款标识（顶层）
clause_id: "167"
clause_name: "变更追溯链"
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 核心约束
change_traceability:
  required: true

  # 变更记录要求
  change_log:
    required: true
    format: "git commit hash + timestamp + author + description"
    immutable: true
    note: "所有实验代码/配置/数据的变更必须通过 git 记录，不允许静默修改"

  # 快照机制
  snapshot:
    required: true
    type: "immutable"
    algo: "SHA-256"
    note: "关键产物（manifest、权重、配置文件）必须保存不可篡改的快照"

  # 追溯链要求
  trace_chain:
    required: true
    one_to_one: true
    note: "每次实验运行必须有唯一的追溯链：git commit → manifest → 产物目录"

# 验证项
verification_items:
  # 1. git 历史中存在变更记录
  git_commit_records_exist: true

  # 2. manifest 中包含追溯信息
  manifest_has_trace_info: true

  # 3. 快照机制存在
  snapshot_mechanism_exists: true

  # 4. 变更记录与产物关联
  change_log_linked_to_artifacts: true

# 关联检查
related_checks:
  - "P147"
  - "P158"
  - "P13"

# 约束声明
constraint_declaration:
  clause_id: "167"
  clause_name: "变更追溯链"
  source_file: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
  source_line: 554
  enforce_level: "hard"
  rationale: "确保实验结果可追溯，防止静默修改导致的结果污染"
  related_clauses:
    - "[147] 目录级可追溯性 + 数据校验和"
    - "[158] 日志含 git commit 和配置 hash"
    - "[13] 违反即处置"
