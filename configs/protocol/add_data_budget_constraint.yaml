# 条款 [89] · 加 seed/轨迹预算约束
# 手册原文：docs/最终交付_异步手册_424条_20260917.md 第324行
# 加 seed/轨迹：仅在预算内且预设判据内进行（如补 seed/轨迹到设计值）

clause_id: "89"
clause_name: "加 seed/轨迹预算约束"

add_seed_or_trajectory:
  allowed_conditions:
    - budget_within_limit
    - preset_criteria_followed

  purpose: "补至设计值"
  purpose_description: "仅在数据不足影响论文级完成时，按预设判据补 seed/轨迹至设计值"

  uncontrolled_expansion_forbidden: true
  uncontrolled_expansion_forbidden_description: "禁止超出预算或无预设判据的随意扩容"

  design_values:
    target_seed_count: 10
    target_trajectories_per_seed: 100
    min_trajectories_per_seed: 100

  budget_constraints:
    max_seed_additions_without_approval: 2
    max_trajectory_additions_without_approval: 50
    approval_required_for_excess: true

  preset_criteria:
    - name: "below_design_value"
      description: "当前 seed/轨迹数低于设计值"
      condition: "current_count < design_count"
      action: "允许补至设计值"
    - name: "within_budget"
      description: "补加量不超过预算上限"
      condition: "addition_count <= max_budget"
      action: "允许补加"
    - name: "preset_purpose_only"
      description: "补加目的必须是补至设计值，不得用于其他目的"
      condition: "purpose == '补至设计值'"
      action: "允许补加"

  expansion_rules:
    direction: "only_increase"
    direction_description: "只增不减——seed/轨迹数只增加不减少"
    no_downgrade: true
    scale_never_less_than_design_value: true

manual_ref: "docs/最终交付_异步手册_424条_20260917.md 第324行"
