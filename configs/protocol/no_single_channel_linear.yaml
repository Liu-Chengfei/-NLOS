# 条款 [34] 禁止"单通道从头做到尾不交叉"
# 手册位置：docs/异步实验_执行手册_终版v15_总纲条款版.md 第278行
# 五铁律：唯一真源=手册原文，状态只认磁盘，逐字执行

# 禁止项声明
prohibition:
  single_channel_linear_execution_prohibited: true
  description: >
    禁止任何单通道从头到尾执行到底而不与其他通道交叉的实现方式。
    单线执行是干漏风险最高的形态。

# 风险定义
risk_definition:
  single_line_execution: "干漏风险最高形态"
  explanation: >
    单通道线性执行（从头到尾不交叉）会导致遗漏风险无法被其他通道发现，
    一旦执行偏差即全部传导，无任何制衡机制。

# 执行要求
enforcement:
  cross_channel_required: true
  description: >
    执行任何条款落实或实验流程时，必须采用多通道交叉验证，
    至少两条独立通道互相校验，禁止单通道独自完成全部流程。
