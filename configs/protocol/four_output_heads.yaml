# 文件职责：声明四个输出头（uwb_scaling / bias / vio_scaling / risk）对三源量测的自适应加权、偏差补偿与门控配置（第44条配置落点）。
# 本文件是手册第44条的配置落点，回答「四个输出头如何构成 NLOS 识别 → 协方差调制/降权 → 鲁棒门控 机制链」。
# 验证：第44条要求四个输出头对 UWB/VIO/IMU 三源量测做自适应加权、偏差补偿与门控，
# 正是"NLOS 识别 → 协方差调制/降权 → 鲁棒门控"机制链的落地，与 S4.2 鲁棒融合组合拳一致。

# 四输出头配置（对应手册第[44]条）
output_heads:
  - uwb_scaling
  - bias
  - vio_scaling
  - risk

# 机制链原文（与条款逐字对应）
mechanism_chain: "NLOS 识别 → 协方差调制/降权 → 鲁棒门控"

# 机制链环节开关
nlos_identification: true
covariance_modulation: true
robust_gating: true

# 三源量测
three_source_measurements:
  - "UWB"
  - "VIO"
  - "IMU"

# 自适应加权与偏差补偿
adaptive_weighting: true
bias_compensation: true

# 与 S4.2 鲁棒融合一致性
s4_2_consistent: true
robust_fusion_components:
  - "NLOS识别"
  - "协方差膨胀/调制"
  - "鲁棒核/残差拒斥"
  - "自适应噪声"

# 四输出头各自职责说明
head_roles:
  uwb_scaling:
    description: "UWB 通道自适应降权系数，NLOS 识别后对 UWB 量测协方差进行膨胀/调制，降低离群 UWB 量测权重"
    mechanism: "协方差调制/降权"
    source: "UWB"
  bias:
    description: "偏差补偿输出头，对三源量测的系统性偏差进行补偿校正"
    mechanism: "偏差补偿"
    source: "三源量测"
  vio_scaling:
    description: "VIO 通道自适应降权系数，NLOS 识别后对 VIO 量测协方差进行膨胀/调制，降低离群 VIO 量测权重"
    mechanism: "协方差调制/降权"
    source: "VIO"
  risk:
    description: "风险门控输出头，基于 NLOS 识别结果与协方差调制状态执行鲁棒门控，拒斥高风险量测"
    mechanism: "鲁棒门控"
    source: "三源量测"

# S4.2 鲁棒融合组合拳对照（与条款原文逐字对应）
s4_2_robust_fusion_check:
  nlos_recognition: true
  covariance_inflation_modulation: true
  robust_kernel_residual_rejection: true
  adaptive_noise: true
