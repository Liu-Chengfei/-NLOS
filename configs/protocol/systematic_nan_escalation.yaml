# 条款 [85] 系统性NaN升级实现层诊断
# 手册位置：docs/最终交付_异步手册_424条_20260917.md 第320行
# 通过标准：若 5 方法中某一方法系统性 NaN（≥3 单元同因）→ 升级查实现（第二层 实现层诊断 / ），禁止通过调 lr 反复试探掩盖

clause_id: "85"
clause_name: "系统性NaN升级实现层诊断"

systematic_nan:
  threshold_units: 3                    # ≥3 单元同因视为系统性 NaN
  description: "若 5 方法中某一方法系统性 NaN（≥3 单元同因）"
  pass_criteria: "每种方法的 NaN 单元数必须少于阈值，若超过需升级至实现层诊断"

escalation:
  escalate_to_implementation_diagnosis: true
  description: "系统性 NaN 触发时必须升级查实现（第二层 实现层诊断）"
  pass_criteria: "发现 NaN 后必须进入实现层诊断流程，不得回避"

lr_tuning:
  lr_tuning_for_masking_forbidden: true  # 禁止通过调 lr 反复试探掩盖 NaN
  lr_tuning_only_for_undertrained: true   # lr 只允许用于"训练不充分"场景
  description: "学习率调优的限制使用场景"
  pass_criteria: "lr 调优仅限于训练不充分场景，禁止作为 NaN 掩盖手段"

methods_context:
  n_methods: 5                          # 5 方法总数
  description: "本条款适用于 5 方法评估场景"

manual_ref: "docs/最终交付_异步手册_424条_20260917.md 第320行"