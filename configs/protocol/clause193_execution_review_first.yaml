# 条款 [193] · 先审执行至无可再审，再查数据适配（失败判别顺序铁律）
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 613 行

clause_id: "193"
clause_name: "先审执行再查数据适配：失败判别顺序铁律"
severity: hard

purpose: |
  失败判别总入口的顺序铁律：任何未达标分析必须先完成执行偏差审计（第一问，
  审至无可再审），才允许进入数据适配性检查（第二问）；结论表述必须带前提限定语。

execution_order:
  first_question:
    description: "第一问：执行有没有偏差？"
    audit_items:
      - "E-1: 漏跑/gate 走过场"
      - "E-2: 改码未重冒烟"
      - "E-3: 数据新旧混用"
      - "E-4: 统计口径漂移"
      - "E-5: 清场遗漏"
      - "E-6: 其他执行偏差"
    prerequisite: "E-1–E-6 独立复核全部通过（无可再审）"
    reference_clause: "584"

  second_question:
    description: "第二问：数据集是否适配研究问题？"
    check_items:
      - "难度梯度（信息量）"
      - "信噪比是否太低"
      - "分布是否不可学"
      - "样本量是否不足"
    prerequisite: "第一问审至无可再审"
    note: "仍不排除'执行偏差尚未审尽'的可能"

conclusion_grammar:
  require_prerequisite_phrase: true
  prerequisite_phrase: "在已排除执行/代码根因的前提下"
  forbidden_without_phrase:
    - "方法失败"
    - "数据不支持该问题"
    - "负结果"
  rule: "上述任何结论性表述，若不附带 prerequisite_phrase，视为无效"

boundaries:
  forbidden:
    - "未审执行就先宣称方法不行"
    - "跳过第一问直接做数据适配性检查"
    - "在 E-1–E-6 未独立复核的情况下得出数据/方法结论"
    - "结论表述不带'在已排除执行/代码根因的前提下'"
  required:
    - "E-1–E-6 独立复核全部通过后才可进入第二问"
    - "每份归因报告须写明'执行已审至无可再审'作为前提声明"
    - "结论中须使用 prerequisite_phrase"

related_clauses:
  - "192"
  - "584"
  - "597"
  - "195"
  - "601"

verification_items:
  execution_review_first:
    description: "执行审查优先顺序的配置和实现到位"
    checks:
      - execution_order_first_question_defined
      - conclusion_grammar_require_prerequisite_phrase
      - prerequisite_phrase_correct
      - related_clauses_cover_584_597

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
