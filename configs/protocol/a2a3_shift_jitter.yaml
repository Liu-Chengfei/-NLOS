# 档位协议条款 · A 轴 —— 同步精度 (A2/A3 偏移与抖动)
# 对应手册第 58 条
# 条款原文：A2/A3 的偏移与抖动数值按协议生效（见档位协议 A 轴）
# ——按 A2/A3 全参数核对：A2：UWB 时钟偏移 20-50ms、UWB 往返延迟 40-80ms、
# IMU 时钟偏移 5-15ms、IMU 采样抖动+/-3ms、VIO 时钟偏移 20-50ms、VIO 处理延迟 30-80ms

protocol_version: 27
clause_id: "58"
clause_reference: "docs/最终交付_异步手册_424条_20260917.md:285"
axis: A
axis_name: "异步程度 (Asynchrony)"
description: "A2/A3 档位的偏移与抖动参数按协议生效"

# A2 档位参数（中度异步）
A2:
  label: "主"
  description: "中度异步，时间偏差明显，需算法主动补偿"
  uwb_clock_offset_ms: [20, 50]      # UWB 时钟偏移 20-50ms
  uwb_round_trip_delay_ms: [40, 80]  # UWB 往返延迟 40-80ms
  imu_clock_offset_ms: [5, 15]       # IMU 时钟偏移 5-15ms
  imu_sampling_jitter_ms: [3, 3]     # IMU 采样抖动+/-3ms
  vio_clock_offset_ms: [20, 50]      # VIO 时钟偏移 20-50ms
  vio_processing_delay_ms: [30, 80]  # VIO 处理延迟 30-80ms

# A3 档位参数（重度异步）
A3:
  label: "重"
  description: "重度异步，时间偏差严重，对算法鲁棒性构成重大挑战"
  uwb_clock_offset_ms: [100, 200]     # UWB 时钟偏移 100-200ms
  uwb_round_trip_delay_ms: [120, 250] # UWB 往返延迟 120-250ms
  imu_clock_offset_ms: [20, 50]       # IMU 时钟偏移 20-50ms
  imu_sampling_jitter_ms: [10, 10]    # IMU 采样抖动 +/-10ms
  vio_clock_offset_ms: [100, 200]     # VIO 时钟偏移 100-200ms
  vio_processing_delay_ms: [150, 300] # VIO 处理延迟 150-300ms

# 验证元数据
verification:
  required_parameters:
    - uwb_clock_offset_ms
    - uwb_round_trip_delay_ms
    - imu_clock_offset_ms
    - imu_sampling_jitter_ms
    - vio_clock_offset_ms
    - vio_processing_delay_ms
  required_levels:
    - A2
    - A3
