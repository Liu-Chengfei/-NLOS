# 条款 [171] 切换 epoch 点

# 手册原文：切换 epoch 点；论文级值：前/后段分界写入 manifest 与论文方法节
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 171 条

clause_id: "171"
clause_name: "切换 epoch 点"

# 核心断言：前/后段 lr 分界 epoch 点必须明确指定并落盘
epoch_boundary:
  # 必填：前后段分界 epoch（1-indexed）
  switch_epoch: 75
  # 必填：论文级值声明——该分界点写入 manifest 和论文方法节
  must_write_to_manifest: true
  must_write_to_paper_section: true
  # 必填：分段说明（前段/后段各段名称或用途）
  segment_description:
    pre_switch: "warmup 或峰值阶段"
    post_switch: "衰减阶段"
  # 必填：分界 epoch 必须为正整数
  constraint:
    type: "positive_integer"
    min_value: 1
    max_value: null  # 由总 epoch 数决定
    must_be_defined: true

# 边界约束
boundaries:
  # 禁止：分界 epoch 未定义
  forbidden:
    - "split_epoch 为 null/缺失"
    - "前/后段分界未写入 manifest"
    - "分界 epoch 未写入论文方法节"
  # 前后段必须明确划分
  required_fields:
    - "switch_epoch"
    - "segment_description.pre_switch"
    - "segment_description.post_switch"

# 相关条款映射
related_checks:
  - "169"   # 峰值 lr（lr_peak）
  - "170"   # 后段 lr 衰减方式
  - "172"   # 非全量规模（冒烟/quick）
  - "173"   # 写入 manifest（学习率区间）

# 约束声明
constraint_declaration:
  clause_id: "171"
  binding_level: "hard"
  violation_consequence: "切换 epoch 点未写入 manifest 或论文方法节 → 该次训练配置无效，需补写 manifest 后重验"
  related_clauses:
    - "[169] 峰值 lr（lr_peak）"
    - "[170] 后段 lr 衰减"
    - "[173] 写入 manifest（学习率区间）"

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: >
  本条款约束学习率调度中前/后段的切换 epoch 点。
  实现时需在 lr schedule 代码中显式声明 split_epoch（而非隐含推算），
  并在 manifest 写入时显式包含该字段，同时在论文方法节中说明其数值来源。
