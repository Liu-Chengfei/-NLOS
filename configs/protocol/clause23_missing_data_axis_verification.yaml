# 条款[23]：数据缺失档位协议（治理层）
# 版本: 2026-05-04 (初始版本)
# 修订: 2026-05-04 (补全规则文件)

clause_id: 23
clause_name: 数据缺失档位协议
constraint_level: 硬约束
governance_phase: 零

# 核心判据
criterion:
  - 数据缺失必做
  - 档位协议条款校验
  - M轴缺失数据参数验证
  - 与手册定义一致性检查

# 禁止项
forbidden:
  - 省略数据缺失验证
  - 修改缺失数据参数
  - 混用不同缺失数据

# 允许范围
allowed:
  - 调整具体参数数值（需在manifest中记录）
  - 增加额外缺失验证场景

# 执行保障
execution:
  rule_file: rules/数据缺失档位协议.md
  config_file: configs/protocol/clause23_missing_data_axis_verification.yaml
  check_function: clause_gates.py:p23_missing_data_axis_verification
  precommit_hook: .git/hooks/pre-commit
  agents_md: AGENTS.md
  status_table: rules/指令状态表.md
  report: outputs/compliance_report_23.md
