clause_name: '[31] 档位协议条款 · V 轴 —— 视觉退化'
clause_level: scenario_spec
governance_phase: '0'
axis: V
description: VIO 质量退化档位协议
note: 视觉里程计（VIO）质量退化。A轴丢帧=数据不在（时间戳级缺失）；V1=数据在但置零；V2=数据在但变糙（σ×5）；V3=数据不在（质量触发）+ 恢复跳变。
gears:
  V0:
    label: 健康
    features_per_frame_min: 50
    increment_noise_sigma_m:
      min: 0.01
      max: 0.03
    frame_validity_pct: 100
    gap: null
  V1:
    label: 黑屏
    increment_mode: zeroed
    scaling: 0.0
    episodes_per_sequence:
      min: 1
      max: 2
    episode_duration_s:
      min: 0.5
      max: 2.0
    trajectory_ratio_pct:
      min: 5
      max: 10
  V2:
    label: 特征丢失
    features_per_frame:
      min: 10
      max: 20
    increment_noise_amplification: 5
    increment_noise_sigma_m:
      min: 0.05
      max: 0.15
    trajectory_ratio_pct:
      min: 20
      max: 40
    continuous_segment_s:
      min: 1
      max: 3
    scaling:
      min: 0.3
      max: 0.7
  V3:
    label: 关键帧中断
    increment_mode: missing
    trigger: quality
    episodes_per_sequence:
      min: 2
      max: 4
    gap_s:
      min: 0.5
      max: 3.0
    trajectory_ratio_pct:
      min: 10
      max: 20
    relocalization_jump_m:
      min: 0.3
      max: 1.0
verification:
  method: 档位参数验证
  checkpoints:
  - 'V0健康: 特征>50/帧，σ=0.01-0.03m/步，帧有效100%'
  - 'V1黑屏: 增量置零，scaling→0，每序列1-2次'
  - 'V2特征丢失: 特征10-20/帧，σ放大5倍，占轨迹20-40%'
  - 'V3关键帧中断: 增量缺失(质量触发)，间隙0.5-3s，恢复跳变0.3-1m'
