# 条款 [210] 论文级旧产物隔离禁令
# 手册原文：任何早于论文级正式执行的旧数据、旧权重、旧结果（含冒烟阶段临时数据/权重、早期试跑产物）一律不得进入最终统计与论文表格
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 649 行

clause_id: "210"
clause_name: "论文级旧产物隔离禁令"
severity: hard

# 禁止对象定义
forbidden_items:
  - name: "冒烟阶段临时数据"
    label: "smoke_temp_data"
    description: "冒烟测试过程中生成的临时仿真数据集（npz/manifest），不得进入论文级统计"
  - name: "冒烟阶段临时权重"
    label: "smoke_temp_weights"
    description: "冒烟测试过程中训练产生的临时权重（checkpoint），不得进入论文级统计"
  - name: "早期试跑产物"
    label: "early_trial_results"
    description: "论文级正式执行前的任何试跑/诊断轨产生的数据、权重或结果，不得进入论文表格"

# 禁止范围
scope:
  forbidden_into_final_stats: true
  forbidden_into_paper_tables: true
  applies_to_all_channels: true
  description: "任何早于论文级正式执行的旧数据、旧权重、旧结果一律不得进入最终统计与论文表格"

# 核心约束
hard_constraint:
  no_old_product_in_final: true
  no_smoke_data_in_paper: true
  no_early_trial_in_final: true
  note: "否则验收验收的是混合产物，审稿人按 manifest 复核即穿帮"

# 相关检查
related_checks:
  - "P74-no-old-new-mixing"
  - "P75-no-smoke-merge"
  - "p211_row_clear_before_run"

# 手册参考
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
manual_section: "生成数据（条款 [159-294]）"
manual_clause: "[210]"
manual_line: 649
