# 条款 [79] 大修前冻结数据/评估脚本
# 手册位置：docs/最终交付_异步手册_424条_20260917.md 第306行
# 通过标准：git 核验（status 干净 + commit 已记录）→ 全过才进实验准备

clause_id: "79"
clause_name: "git 核验"

git_verification:
  status_check:
    description: "检查 git 状态是否干净"
    command: "git status --porcelain"
    expected_empty_output: true
    pass_criteria: "工作区状态必须完全干净（无未提交的修改、无未跟踪的核心文件）"

  commit_check:
    description: "检查最近一次 commit 已记录"
    command: "git log -1 --format=%H"
    required_field: "commit_hash"
    pass_criteria: "必须存在有效的 commit 记录"

  freeze_check:
    description: "数据/评估脚本在大修前已冻结"
    data_scripts_frozen: true
    eval_scripts_frozen: true
    pass_criteria: "数据生成脚本与评估脚本在进入实验准备前必须被冻结，不能随意修改"

manual_ref: "docs/最终交付_异步手册_424条_20260917.md 第306行"
