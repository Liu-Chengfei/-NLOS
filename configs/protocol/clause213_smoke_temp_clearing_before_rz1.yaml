# 条款 [213] 冒烟后、RZ-1 前清场（总纪律）
# 手册原文：
# 冒烟通过、code freeze 之后进入 RZ-1 之前 ——冒烟产生的临时数据/临时权重也必须一并清场
# （冒烟只验管线，其数据/权重不进入最终统计 ——与"测试轨迹重新生成：全量 10 seed 的测试轨迹
# 必须全部重新生成，不能用冒烟那 ≥12 条凑数"同一原则的整批化执行）。
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 655 行

clause_id: "213"
clause_name: "冒烟后RZ-1前清场临时数据与权重"
severity: hard

# 核心约束定义
core_constraint:
  action: "clear_smoke_temp_after_smoke_pass"
  description: "冒烟通过后、code freeze 后进入 RZ-1（重新生成）之前，必须清场冒烟产生的临时数据与临时权重"
  prerequisite:
    - "冒烟通过"
    - "code freeze 已完成"
  target_phase: "RZ-1 之前"

# 冒烟产生临时数据/权重不进入最终统计
temp_data_exclusion:
  smoke_data_not_in_final_stats: true
  smoke_weights_not_in_final_stats: true
  principle: "冒烟只验管线，其数据/权重不进入最终统计"

# 与测试轨迹重新生成同一原则（整批化执行）
same_principle_as:
  clause: "[214] 或相关条款"
  principle: "全量 10 seed 测试轨迹必须全部重新生成，不能用冒烟那 ≥12 条凑数"
  type: "整批化执行"

# 清场范围
clearing_scope:
  smoke_data:
    - "冒烟产生的临时训练数据集"
    - "冒烟产生的临时验证数据集"
    - "冒烟产生的临时测试数据集"
  smoke_weights:
    - "冒烟产生的临时权重/checkpoint"
  isolation_required: "archive/ 物理隔离"

# 禁止对象
forbidden_items:
  - name: "冒烟临时数据"
    label: "smoke_temp_data"
    description: "冒烟产生的临时训练/验证/测试数据，不得进入最终统计"
  - name: "冒烟临时权重"
    label: "smoke_temp_weights"
    description: "冒烟产生的临时权重/checkpoint，不得进入最终统计"

# 硬约束
hard_constraint:
  no_smoke_data_in_final_stats: true
  no_smoke_weights_in_final_stats: true
  clear_before_rz1: true
  archive_physical_isolation: true

# 验证方式
verification_method:
  - "冒烟通过后确认临时数据已清场（活动目录为空或已迁 archive/）"
  - "冒烟通过后确认临时权重已清场（活动目录为空或已迁 archive/）"
  - "记录清场操作日志"
  - "进入 RZ-1 时活动目录无冒烟残留"

# 相关检查
related_checks:
  - "p211_experiment_pre_run_data_weight_clearing"
  - "p104_smoke_test_gate"
  - "c9_pre_run_cleanup"

# 手册参考
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
manual_section: "训练（条款 [346-456]）"
manual_clause: "[213]"
manual_line: 655
