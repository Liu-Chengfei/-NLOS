# Clause [169] 权重/梯度范数监控（冒烟训练时打印）
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [169]

clause_id: "169"
clause_name: "权重/梯度范数监控（冒烟训练时打印）"
severity: hard

# 核心约束
weight_gradient_norm:
  monitor_enabled: true
  print_in_smoke_training: true
  check_nan_inf: true
  check_explosion: true

# 监控指标
metrics:
  weight_norm:
    enabled: true
    log_frequency: "per_step"
  gradient_norm:
    enabled: true
    log_frequency: "per_step"
  loss:
    enabled: true
    log_frequency: "per_step"

# 异常检测阈值
thresholds:
  nan_inf_stop: true           # 遇到 NaN/Inf 立即停止
  gradient_explosion_threshold: 100.0  # 梯度范数超过此值视为爆炸
  weight_explosion_threshold: 100.0    # 权重范数超过此值视为爆炸

# 相关条款
related_checks:
  - "P66"       # 无 NaN/Inf/梯度爆炸
  - "166"       # 产物存活性
  - "148"       # 跑前第一道门

# 手册参照
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
