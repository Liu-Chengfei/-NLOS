# 条款 [190] · M轴缺失只作用于 UWB（M1），VIO 缺失仅在 M2/M3（不在异步高NLOS实验）出现
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 606 行

clause_id: "190"
clause_name: "M轴缺失只作用于 UWB（M1）"
severity: hard

m_axis_missing_spec:
  purpose: |
    确保持 M 轴缺失只作用于 UWB（M1），VIO 缺失仅在 M2/M3 出现。
    本实验不涉及 M2/M3 中的 VIO 缺失。

  m1_scope:
    applies_to: "UWB"
    missing_rate: 0.05
    cluster_gap_seconds: [0.3, 2.0]
    description: "UWB 5% 成簇丢包（含 NLOS 引起的不可解帧，统一为缺失注入）"

  m2_scope:
    applies_to: "VIO"
    exists_in_clauses: ["M2", "M3"]
    description: "VIO 缺失仅在 M2/M3（不在异步高NLOS实验）出现"

m_axis_scope_constraint:
  uwb_only_in_m1: true
  vio_only_in_m2_m3: true
  not_in_async_nlos_experiment: true

s9_contract:
  purpose: "S9 数据生成校验脚本契约"
  execution_timing:
    - "生成后"
    - "预检前必跑"
  script_path: "scripts/s9_validate_seeds.py"
  required: true

constraints:
  m_axis_uwb_only_in_m1: true
  vio_missing_restricted_to_m2_m3: true
  s9_validation_timing: true

verification_items:
  m_axis_scope_enforced:
    description: "M 轴缺失只作用于 UWB（M1）"
    checks:
      - m_axis_uwb_only_check
      - m2_vio_isolation_check
      - s9_validation_after_generation_check
  s9_validation_enforced:
    description: "S9 校验脚本在生成后、预检前必跑"
    checks:
      - s9_script_exists
      - s9_validation_timing_check

boundaries:
  forbidden:
    - "M 轴缺失作用于 VIO（M1 之外）"
    - "VIO 缺失在 M1 中出现"
    - "S9 校验脚本未在生成后运行"
  required:
    - "M 轴缺失只作用于 UWB（M1）"
    - "S9 校验脚本在生成后、预检前必跑"

related_clauses:
  - "188"
  - "189"
  - "191"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
