# 条款 [208] V0 档负向排除（协议判别规则反向断言）配置
# 手册原文：
# [208] 26a. V0 档负向排除（协议判别规则反向断言，硬约束）：
# 检查生成序列的 VIO 段不得出现协议 V1/V2/V3 退化档症状 ——
# 任一症状出现 = 生成代码悄悄引入了非 V0 档压力，须修生成器后重新生成：
# 无"数据在但置零"（V1 黑屏症状：vio_pos/vio_yaw 连续段恒为 0 而 vio_valid=1，
# 或增量恒 0——置零会让 vio_scaling 头消融的 Δ 虚假）
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 643 行

clause_id: "208"
clause_name: "V0档负向排除（协议判别规则反向断言）"
severity: "hard"

# 核心断言：V0 档位生成序列的 VIO 段不得出现 V1/V2/V3 退化档症状
v0_degradation_exclusion:
  required: true
  description: "V0档（视觉健康）生成序列的VIO段必须无退化症状"
  violation_consequence: "任一退化症状出现=生成代码悄悄引入了非V0档压力，须修生成器后重新生成"

  # 禁止症状清单
  forbidden_symptoms:
    - name: "vio_data_zeroed_while_valid"
      label: "数据在但置零（V1黑屏症状）"
      description: "vio_pos/vio_yaw 连续段恒为 0 而 vio_valid=1"
      fields: ["vio_pos", "vio_yaw", "vio_valid"]
      condition: "连续段恒为0 且 vio_valid=1"
      severity: "hard"

    - name: "vio_increment_always_zero"
      label: "增量恒为0"
      description: "vio_pos/vio_yaw 相邻帧增量恒为 0（即使原始值非零，变化量为零）"
      fields: ["vio_pos", "vio_yaw"]
      condition: "相邻帧差分的绝对值恒为0"
      severity: "hard"

  # 验证方法
  validation:
    method: "negative_assertion"
    scope: "V0档所有生成序列的VIO段"
    check_points:
      - "逐序列检查vio_pos/vio_yaw是否有非零值"
      - "检查vio_valid=1的帧是否对应合理的vio_pos/vio_yaw非零段"
      - "计算相邻帧增量，确认不恒为0"

# 相关条款
constraint_declaration:
  clause_id: "208"
  binding_level: "hard"
  violation_consequence: "生成代码引入非V0档压力→数据作废→修生成器→重新生成"
  related_clauses:
    - "[209] UWB/VIO/gt输出行数N以UWB帧数为准"
    - "[210] 旧数据旧权重不得进入最终统计"
    - "[41] VIO输出规范（单目+IMU前端，20Hz）"
    - "[26] V轴档位协议"

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: >
  Stage 3 生成数据阶段的硬约束。V0 档位是视觉健康档，VIO 输出必须包含
  合理的非零位移和航向变化。若发现"数据在但置零"或"增量恒为0"的症状，
  说明生成器代码悄悄引入了非 V0 档的压力（如 V1 黑屏退化逻辑被错误触发），
  必须修生成器后重新生成全部相关数据。