# 条款 [208] V0档负向排除（协议判别规则反向断言）
# 手册原文：docs/异步实验_执行手册_终版v15_总纲条款版.md
# 检查生成序列的 VIO 段不得出现协议 V1/V2/V3 退化档症状 ——
# 任一症状出现 = 生成代码悄悄引入了非 V0 档压力

clause_id: "208"
severity: hard

v0_degradation_exclusion:
  description: "VIO 段不得出现协议 V1/V2/V3 退化档症状。任一症状出现意味着生成代码引入了非 V0 档压力，须修生成器后重新生成。"
  forbidden_symptoms:
    - name: "vio_data_zeroed_while_valid"
      label: "V1 黑屏症状"
      description: "vio_pos/vio_yaw 连续段恒为 0 而 vio_valid=1，或增量恒 0——置零会让 vio_scaling 头消融的 Δ 虚假"
      fields:
        - "vio_pos"
        - "vio_yaw"
        - "vio_valid"
      condition: "vio_pos/vio_yaw 连续段恒为 0 且 vio_valid=1，或增量恒 0"
    - name: "vio_increment_always_zero"
      label: "V2 增量消失症状"
      description: "VIO 增量（位置/姿态差）在连续段内恒为 0，即使 vio_valid=1，表明数据未真正更新"
      fields:
        - "vio_pos_increment"
        - "vio_yaw_increment"
      condition: "vio_pos_increment/vio_yaw_increment 连续段恒为 0"

  validation:
    method: "反向断言——确认无退化档症状"
    check_points:
      - "遍历所有 VIO 段，检查 vio_pos/vio_yaw 是否出现连续恒 0 且 vio_valid=1 的情况"
      - "遍历所有 VIO 段，检查 vio_pos_increment/vio_yaw_increment 是否出现连续恒 0 的情况"
      - "任一症状出现 = 标记为 V1/V2/V3 退化档，触发重新生成"

boundaries:
  forbidden:
    - "vio_pos/vio_yaw 连续段恒为 0 且 vio_valid=1"
    - "vio_pos_increment/vio_yaw_increment 连续段恒为 0"
    - "发现退化档症状后继续使用而非重新生成"
    - "静默覆盖退化档数据而不报告"
  required:
    - "VIO 段必须保持 V0 档特征"
    - "任何退化档症状必须触发重新生成"
    - "发现症状后须修生成器代码"

constraint_declaration:
  related_clauses:
    - "207"
    - "209"