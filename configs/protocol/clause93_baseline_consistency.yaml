# [93] 基线一致：消融各变体与主实验同数据/同 seed/同超参/同评估口径
# 对应手册条款 [93]
# 五铁律：唯一真源=手册原文，状态只认磁盘，逐字执行

clause_id: "93"
clause_name: "[93] 基线一致"
constraint_level: "硬约束"
description: "消融各变体与主实验必须使用同数据、同 seed、同超参、同评估口径，确保消融实验的差异仅来自被消融的组件，而非其他变量。"
manual_ref: "最终交付_异步手册_424条_20260917.md"
manual_line: 328
verification_gate: "p98_baseline_consistency"

# 消融变体与主实验一致性要求
baseline_consistency_requirements:
  same_data: true              # 使用相同的训练/测试数据集
  same_seed: true              # 使用相同的随机种子初始化
  same_hyperparams: true       # 使用相同的学习率、batch size 等超参数
  same_eval_standard: true     # 使用相同的评估口径（指标计算方式）
  ablation_variable_only: true # 唯一差异应为被消融的组件

# 验证检查项
checks:
  - data_manifest_consistency    # 数据清单一致性
  - seed_initialization_match    # 种子初始化匹配
  - hyperparam_table_identical   # 超参数表一致
  - eval_metric_definition_same  # 评估指标定义相同
