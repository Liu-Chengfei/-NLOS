# 条款 [177] · 机体系为前-左-上（FLU）或右-前-上（RFU）二选一，全流程固定并写入 manifest
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md

clause_id: "177"
clause_name: "机体系为前-左-上（FLU）或右-前-上（RFU）二选一，全流程固定并写入 manifest"
severity: hard

# 坐标系核心约束
coordinate_frame:
  # 二选一：必须且只能取 "FLU" 或 "RFU"
  allowed_values:
    - "FLU"   # 前-左-上（Forward-Left-Up）
    - "RFU"   # 右-前-上（Right-Front-Up）
  # 当前实验统一选用的机体系
  selection: "FLU"
  # 全流程固定：不得中途切换坐标系约定
  fixed_per_full_pipeline: true
  # 必须写入 manifest
  must_record_in_manifest: true
  description: >
    机体系为前-左-上（FLU）或右-前-上（RFU）二选一，全流程固定并写入 manifest。
    不允许混合使用两种约定，不允许在同一 seed 内切换坐标系。

# manifest 要求
manifest:
  required_fields:
    - "coordinate_frame"
  description: "每个 seed 的 manifest.json 必须包含 coordinate_frame 字段，值为 FLU 或 RFU"

# 相关条款映射
related_checks:
  - "176"   # 场景类型为工业/商业混合遮挡环境（共同定义场景几何基准）

# 边界约束
boundaries:
  forbidden:
    - "同一 seed 内混用 FLU 和 RFU"
    - "coordinate_frame 字段缺失或为空"
    - "coordinate_frame 取值为 FLU/RFU 以外的任意值"
  required:
    - "selection 必须为 FLU 或 RFU 之一"
    - "fixed_per_full_pipeline = true"
    - "must_record_in_manifest = true"
    - "manifest.required_fields 包含 coordinate_frame"

# 约束声明
constraint_declaration:
  clause_id: "177"
  binding_level: "hard"
  violation_consequence: "机体系前后不一致或 manifest 未记录 → 该 seed 数据作废，须 RZ-1 重生成 + RZ-2 重训"
  related_clauses:
    - "[176] 场景类型为工业/商业混合遮挡环境（共同定义场景几何基准）"
    - "[40] IMU 输出规范（含 FLU/RFU 约定配套）"

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: >
  本条款与 [176] 共同构成场景几何基准：[176] 固定场景类型（工业/商业混合遮挡 + 三区域布局），
  [177] 在此基础上固定机体系约定（FLU 或 RFU）。选择 FLU/RFU 后，全链路（数据生成 → 预处理 →
  特征提取 → 定位估计）必须严格使用该坐标系，manifest 必须记录 coordinate_frame 字段，
  以便后续审计时核验坐标系一致性。
