# 条款 [219]：每 seed manifest 必含字段
# 手册原文：每 seed manifest 含生成器 commit hash、规模参数、随机根 seed、注入统计（ρ/μ/σ 实测）、文件数/字节。
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 668 行

clause_id: "219"
clause_name: "每seed manifest必含字段"
severity: hard

# 条款核心约束：每份 seed manifest 必须包含以下五类字段
required_manifest_fields:
  generator_commit_hash:
    description: "生成器 commit hash"
    required: true
    note: "标识生成本份 manifest 数据所依据的生成器代码版本，确保可回溯到具体 commit"
    example: "a1b2c3d4e5f6..."

  scale_parameters:
    description: "规模参数"
    required: true
    note: "论文级规模参数（seed 数、单元数、组合数等），确保数据规模与论文一致"
    example:
      seeds: 10
      units: 50
      combinations: ["A2N2", "A2N3", "A3N2", "A3N3"]

  random_root_seed:
    description: "随机根 seed"
    required: true
    note: "本份 manifest 所用随机根 seed，保证轨迹/噪声/注入/划分的可复现性"
    example: 42

  injection_statistics:
    description: "注入统计（ρ/μ/σ 实测）"
    required: true
    note: "NLOS 注入统计实际测量值：ρ 丢包率、μ NLOS 偏差均值、σ NLOS 偏差标准差"
    metrics:
      rho: "丢包率实际值（ρ）"
      mu: "NLOS 偏差均值实际值（μ）"
      sigma: "NLOS 偏差标准差实际值（σ）"
    note_measured: "必须为实测值，不得为理论值或估计值"

  file_count_bytes:
    description: "文件数/字节"
    required: true
    note: "本份 manifest 对应数据集中文件总数和总字节数，用于完整性校验"
    fields:
      file_count: "文件总数"
      total_bytes: "总字节数"

# 校验计划
verification_plan:
  - step: 1
    name: "检查配置文件存在且可解析"
    actions:
      - "确认 configs/protocol/clause219_seed_manifest.yaml 存在"
      - "解析 YAML 确认结构完整"
    output: "配置文件合规判定"
  - step: 2
    name: "检查规则文档存在"
    actions:
      - "确认 rules/条款 219_每seed manifest必含字段.md 存在"
      - "确认文档包含条款原文和验收标准"
    output: "规则文档合规判定"
  - step: 3
    name: "检查验证器函数"
    actions:
      - "确认 clause_gates.py 中存在 p219_seed_manifest() 函数"
      - "确认函数已注册到 _ALL 列表"
    output: "验证器注册合规判定"
  - step: 4
    name: "验证 manifest 必含字段"
    actions:
      - "遍历每份 seed manifest.json"
      - "检查是否包含生成器 commit hash 字段"
      - "检查是否包含规模参数字段"
      - "检查是否包含随机根 seed 字段"
      - "检查是否包含注入统计 ρ/μ/σ 字段"
      - "检查是否包含文件数/字节字段"
    output: "manifest 字段完整性判定"
  - step: 5
    name: "手册真源验证"
    actions:
      - "确认 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 668 行包含 [219]"
    output: "手册真源一致性判定"

# 边界约束
boundaries:
  forbidden:
    - "manifest 缺少生成器 commit hash"
    - "manifest 缺少规模参数"
    - "manifest 缺少随机根 seed"
    - "manifest 缺少注入统计 ρ/μ/σ"
    - "manifest 缺少文件数/字节"
    - "注入统计使用理论值替代实测值"
  required:
    - "每份 seed manifest 必须包含全部五类必填字段"
    - "注入统计 ρ/μ/σ 必须为实测值"
    - "生成器 commit hash 必须为实际 git commit"
    - "规模参数必须与论文级配置一致"
    - "随机根 seed 必须唯一且可复现"

# 相关条款
related_clauses:
  - "182"
  - "183"
  - "202"
  - "217"
  - "218"
  - "220"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
