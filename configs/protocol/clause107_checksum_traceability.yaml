# 条款 [107] 数据校验和与 run 目录对应 配置
# 手册原文：每个 run 的配置/指标/日志与目录一一对应（可追溯的目录级实现）；数据校验和：每个 npz / manifest 生成时记录 SHA-256 校验和
# 对应 docs/最终交付_异步手册_424条_20260917.md 第 345 行

clause_id: "107"
clause_name: "数据校验和与 run 目录对应"
manual_line: 345
manual_text: "每个 run 的配置/指标/日志与目录一一对应（可追溯的目录级实现）数据校验和：每个 npz / manifest 生成时记录 SHA-256 校验和"

# 核心断言：每个 run 的配置/指标/日志与目录一一对应，且数据文件带 SHA-256 校验和
run_directory_mapping:
  required: true
  description: "每个 run 的配置/指标/日志与 run 目录一一对应"
  mapping_fields:
    - "config"
    - "metrics"
    - "log"
  directory_level: "run"
  traceable: true

# 数据校验和
checksum:
  required: true
  algorithm: "SHA-256"
  trigger: "生成时"
  target_files:
    - "npz"
    - "manifest"
  record_fields:
    - "sha256"
    - "generated_at"
    - "file_path"
  validation_field_names:
    - "sha256"
    - "generated_at"
    - "file_path"

# 验证项
verification_items:
  run_directory_mapping_required: true
  run_mapping_fields_3_complete: true
  checksum_required: true
  checksum_algorithm_sha256: true
  checksum_target_files_2: true
  checksum_record_fields_3_complete: true
  manual_text_present: true
  manual_line_345: true

# 约束声明
constraint_declaration:
  clause_id: "107"
  clause_name: "数据校验和与 run 目录对应"
  source_file: "docs/最终交付_异步手册_424条_20260917.md"
  source_line: 345
  manual_line: 345
  binding_level: "hard"
  violation_consequence: "run 目录不可追溯 / 数据文件无 SHA-256 校验和 → 无法验证数据完整性，相关实验结果作废"
  related_clauses:
    - "[106] 决策日志（decision log）"
    - "[108] 跑前第一道门：逐项确认并留痕"
    - "[64] 重新生成全部 seed 数据"

# 手册引用
manual_ref: "docs/最终交付_异步手册_424条_20260917.md 第 345 行"

# 实施说明
implementation_note: >
  条款 [107] 要求两个层面：
  1. 每个 run 的配置/指标/日志与 run 目录一一对应（可追溯的目录级实现）
  2. 每个 npz / manifest 生成时记录 SHA-256 校验和
  校验和是数据完整性的核心保障，目录对应是 traceability 的基础。
  校验和算法固定为 SHA-256（不允许可配置），目标文件固定为 .npz 和 .manifest。
