# 条款 [215] 验收轨完整清场（论文级正式执行前 + 冒烟后进 RZ-1 前，6 项逐项留痕，缺一不可）
# 手册原文：
# [215] 验收轨完整清场（论文级正式执行前 + 冒烟后进 RZ-1 前，6 项逐项留痕，缺一不可）：
# 旧仿真数据集清零：全部旧训练/验证/测试 npz + manifest 从活动数据目录
# 删除或整体迁移至 archive/（物理隔离迁移必须保证实验脚本任何路径都读不到 archive，否则视为未清场）
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 659 行

clause_id: "215"
clause_name: "验收轨完整清场"
severity: hard

# 触发时机
trigger_timing:
  - "论文级正式执行前（Pre-1 之前）"
  - "冒烟通过后进入 RZ-1 前"
mode_type: "paper_grade"
description: "验收轨完整清场，6 项逐项留痕，缺一不可"

# 清场范围
clearing_scope:
  simulation_data:
    training:
      - "旧训练 npz 文件"
      - "旧训练 manifest"
    validation:
      - "旧验证 npz 文件"
      - "旧验证 manifest"
    testing:
      - "旧测试 npz 文件"
      - "旧测试 manifest"
  target: "archive/"
  isolation_requirement: "物理隔离迁移必须保证实验脚本任何路径都读不到 archive，否则视为未清场"

# 6 项逐项留痕（硬性约束）
traceability_items:
  - name: "目录"
    label: "directory"
    required: true
  - name: "文件数"
    label: "file_count"
    required: true
  - name: "字节"
    label: "bytes"
    required: true
  - name: "hash"
    label: "hash"
    required: true
  - name: "时间戳"
    label: "timestamp"
    required: true
  - name: "操作人"
    label: "operator"
    required: true
  - name: "archive 路径"
    label: "archive_path"
    required: true

# 核心约束
hard_constraint:
  no_old_data_in_current_run: true
  no_old_weights_in_current_run: true
  no_old_results_in_current_run: true
  archive_physical_isolation: true
  six_traceability_items_required: true
  note: "6 项逐项留痕，缺一不可"

# 禁止对象
forbidden_items:
  - name: "旧仿真数据集"
    label: "old_simulation_data"
    description: "训练/验证/测试 npz + manifest，不能进入当前实验读取"
  - name: "旧权重文件"
    label: "old_weights"
    description: "checkpoint/权重文件，不能进入当前实验读取"
  - name: "旧结果文件"
    label: "old_results"
    description: "旧指标/日志/统计输出/验收表，不能进入最终统计"

# 验证方式
verification_method:
  - "清场清单（目录、文件数、字节、hash、时间戳、操作人、archive 路径）写入 decision log"
  - "论文可复现性附录中列一行数据/权重/结果自清场后重新生成"
  - "确认活动数据目录中无旧 npz/manifest 残留"
  - "确认活动权重目录中无旧 checkpoint 残留"
  - "确认 archive/ 物理隔离，脚本无法读取"

# 相关检查
related_checks:
  - "p211_experiment_pre_run_data_weight_clearing"
  - "p210_paper_grade_old_product_isolation"
  - "p212_pure_generation_from_scratch"
  - "p213_smoke_temp_clearing_before_run"
  - "p214_diagnostic_clear_action_checklist"

# 手册参考
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
manual_section: "论文级验收执行规范（RZ-0–RZ-3）"
manual_clause: "[215]"
manual_line: 659