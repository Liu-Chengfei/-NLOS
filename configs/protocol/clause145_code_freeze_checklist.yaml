# Clause 145: 动作清单：生成器代码冻结确认
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [145]
# [145] 动作清单：生成器代码冻结确认

clause_id: "145"
clause_name: "动作清单：生成器代码冻结确认"
description: |
  数据生成器代码必须与冒烟通过的 git commit 一致，
  code freeze 覆盖训练、评估、统计、数据生成四类代码。
  保证代码版本在全流程中锁定，不存在随意变更。

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

code_freeze:
  scope:
    - "训练代码"
    - "评估代码"     
    - "统计代码"
    - "数据生成代码"
  data_generator_freeze:
    must_match_smoke_commit: true
    smoke_commit_record: "冒烟通过的 git commit hash 必须记录"
    verification_method: "git diff 或 git checkout 对比实际代码与 freeze commit"
  freeze_confirmation:
    required_fields:
      - "freeze_timestamp"
      - "freeze_commit_hash"
      - "freeze_scope"
      - "smoke_gate_passed"
    cannot_modify_after_freeze: true

related_checks:
  - "P142"
  - "P143"
  - "C-1"
  - "C-2"
  - "Pre-5"

compliance:
  hard_constraint: true
  requires_manual_confirmation: true
  summary: "数据生成器代码冻结确认：必须与冒烟通过的 git commit 一致，覆盖四类代码，保证版本锁定"