# 条款 [142] 统计脚本冒烟验证 Gate 配置
# 手册原文：统计口径→统计脚本冒烟验证 gate
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 499 行

clause_id: "142"
clause_name: "统计口径→统计脚本冒烟验证 gate"

# 条款原文
clause_text: |
  **[142]** 统计口径→统计脚本冒烟验证 gate

# 冒烟验证 gate 机制
smoke_gate:
  purpose: "统计口径变更必须通过冒烟验证 gate 才能生效"
  trigger: "统计口径任何变更（RMSE口径、排除规则、坐标转换等）"
  gate_check:
    - "statistical_script_runs_without_error"
    - "output_contains_expected_metrics"
    - "aggregate_matches_manual_compute"
  fail_action: "阻断实验推进，回退口径变更"
  pass_action: "口径变更写入 decision log，实验可继续"

# 统计口径冻结定义
statistical_spec:
  rmse_口径: "对齐Sim/2D/世界系/warm-up剔除"
  排除规则: "warm-up 10s剔除 + outlier（>3σ）"
  坐标转换: "Sim→世界系，2D投影"
  冻结机制: "实验方案冻结后统计口径version tag锁定，变更需重新冒烟"

# 相关检查引用
related_checks:
  - "P22: 统计方法"
  - "P139: 输出对齐"
  - "R-2: 根因分析记录"
  - "R-3: 重跑轮次控制"

# 手册真源引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 约束声明
constraint_declaration:
  clause_id: "142"
  binding_level: "hard"
  violation_consequence: "统计口径变更未通过冒烟gate → 阻断实验推进，口径变更回退"
  freeze_enforcement: "version_tag锁定 + decision_log记录"