# 条款 [154] C-7 并行度最大化 + 断点恢复（Pre-5 细化第 5/6 条）
# 手册原文：第C-7项 并行度最大化 + 断点恢复（Pre-5 细化第 5/6 条）；代码实现要求（细化）：
#   并发调度器在 RAM ≤12G 内自动最大化并行度，支持断点恢复
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 154 条

clause_id: "154"
clause_name: "C-7 并行度最大化 + 断点恢复（Pre-5 细化第 5/6 条）"

# 并行度最大化声明
parallel_maximize:
  purpose: "在 RAM ≤12GB 硬上限约束下自动最大化并行度，禁止拍脑袋设并发度"
  auto_compute: true            # 必须自动计算，不能手动设置
  formula: "并发单元数 × 单单元峰值内存 ≤ 12GB"  # 公式化核算
  ram_hard_limit: 12            # GB，硬上限
  pre_check: true               # 事前核算，启动前计算
  method: "compute_parallel_limits()"  # 实现函数
  on_exceed: "降低并发度或降为串行排队"    # 超限处置（衔接 P150/P151）

# 断点恢复声明
checkpoint_resume:
  support: true                 # 支持断点恢复
  resume_from_last_checkpoint: true  # 从最后断点继续
  no_full_rerun: true           # 不需要从头开始重跑
  atomic_write: true            # 原子写入防半文件
  consistency_check: true       # 断点恢复一致性校验（重跑前段对比）
  checkpoint_dir: "checkpoints/"  # checkpoint 目录

# Pre-5 细化对应
pre5_refinement:
  item_5: "并行度最大化（Pre-5 细化第 5 条）"
  item_6: "断点恢复（Pre-5 细化第 6 条）"

# 关联条款
related_checks:
  - "C-7"      # 并行最大化 min(GPU, RAM, 待执行)
  - "Pre-5"    # Pre-5 资源门控
  - "P150"     # RAM硬上限与并发调度器闸门
  - "P151"     # RAM超限降并发串行排队
  - "P152"     # RAM无模糊系数

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md 第154条"

# 实施说明
implementation_note: >
  并发调度器必须按"并发单元数 × 单单元峰值内存 ≤ 12GB"公式自动计算最大可行并发度，
  禁止手动设置或使用模糊系数。断点恢复支持从中断位置继续运行，
  通过 checkpoint 机制记录运行进度，恢复时进行一致性校验确保数据完整性。
