# Clause 144: 代码实现正确性独立检查（硬约束）
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [144]
# [144] 代码实现正确性独立检查（硬约束，防"代码写得出来但写错了"）

clause_id: "144"
clause_name: "代码实现正确性独立检查（硬约束）"
description: "代码实现必须经过独立于编码者本人的检查，由未参与该模块编码的独立角色（复核者/交叉检查子任务）检查，五类检查范围全覆盖，没有独立检查的代码不能合并/发布。"
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

independent_review:
  role_separation: true
  reviewer_independence_requirement: "未参与该模块编码的独立角色"
  cannot_self_review: true
  review_methods:
    - "交叉检查子任务"
    - "复核者 review"
    - "pair programming 交换角色"
  code_author_never_same_as_reviewer: true

five_check_categories:
  s6_interface_data_contract:
    description: "字段/形状/单位与设计文档一致"
    required: true
  c1_c2_training_evaluation:
    description: "batch/seed/对齐/不混批"
    required: true
  numerical_modes:
    description: "TF32/AMP/确定性设置"
    required: true
  resource_gating_pre5:
    description: "12GB RAM 与并行度核算"
    required: true
  error_handling:
    description: "OOM/NaN/断点恢复"
    required: true

review_evidence:
  required:
    - "review_comment"
    - "sign_off"
    - "checklist_completion"
  no_review_no_merge: true
  evidence_must_be_traversable: true

related_checks:
  - "S6"
  - "C-1"
  - "C-2"
  - "Pre-5"
  - "P6"
  - "P19"

compliance:
  hard_constraint: true
  cannot_skip: true
  summary: "代码实现必须经独立角色检查；五类检查范围全覆盖；检查记录可追溯；没有独立检查的代码不能合并/发布"
