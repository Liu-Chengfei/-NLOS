# 条款 [147] 目录级可追溯性 + 数据校验和（SHA-256）配置
# 手册原文：每个 run 的配置/指标/日志与目录一一对应（P39 可追溯的目录级实现） Pre-4 **数据校验和** 每个 npz / manifest 生成时记录 SHA-256 校验和
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 [行]

clause_id: "147"
clause_name: "目录级可追溯性 + 数据校验和（SHA-256）"

# 第一部分：目录级可追溯性
traceability:
  required: true
  purpose: "每个 run 的配置/指标/日志与目录一一对应"
  p39_implementation: "P39 可追溯性的目录级实现"
  run_directory_structure:
    config: "run 的配置文件"
    metrics: "run 的指标输出"
    logs: "run 的日志文件"
  one_to_one_mapping: true  # 配置/指标/日志与目录一一对应

# 第二部分：数据校验和
data_checksum:
  required: true
  trigger: "Pre-4 阶段，每个 npz / manifest 生成时"
  algorithm: "SHA-256"
  required_files:
    - "npz 数据文件"
    - "manifest 清单文件"
  checksum_record: "校验和必须与实际文件内容一致"
  integrity_verification: true  # 数据完整性可验证

# 相关检查
related_checks:
  - "P39"  # 可追溯性
  - "Pre-4"  # 数据校验和
  - "P19"  # 复制/推断防线

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: >
  1. 目录级可追溯性：每个 run 必须有独立的目录，该目录下包含 config/、metrics/、logs/ 子目录，
  每个子目录存储对应的配置文件、指标输出、日志文件，确保配置/指标/日志与目录一一对应。
  2. 数据校验和：在 Pre-4 阶段（数据准备阶段），每个 npz 数据文件和 manifest 清单文件在生成时
  必须计算 SHA-256 校验和，并记录在文件元数据或独立的校验和文件中。