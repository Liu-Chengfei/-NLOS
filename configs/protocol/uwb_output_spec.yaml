# 文件职责：声明 UWB 传感器输出数据规范（第39条配置落点）。
# 本文件是手册第39条的配置落点，声明 UWB 芯片型号、采样频率与输出数据结构。
# 验证：第39条要求 UWB(DW1000级, 10Hz)；输出 uwb_ranges(N×4, m) + uwb_valid(N×4, 有效掩码)。

# UWB 传感器输出规范（对应手册第[39]条）
chip_model: "DW1000 级"
frequency_hz: 10

# 输出数据字段声明
output_fields:
  - name: "uwb_ranges"
    description: "N×4 测距, m"
    dimensions: "N×4"
    unit: "m"
    type: "测距矩阵"
  - name: "uwb_valid"
    description: "N×4 有效掩码"
    dimensions: "N×4"
    unit: "bool"
    type: "有效掩码矩阵"

# 数据格式说明
data_format:
  uwb_ranges: "形状为 (N, 4) 的浮点矩阵，N 为时间步数，4 为锚点数量，值域为测距值(单位: m)"
  uwb_valid: "形状为 (N, 4) 的布尔矩阵，N 为时间步数，4 为锚点数量，标识对应测距值是否有效"
