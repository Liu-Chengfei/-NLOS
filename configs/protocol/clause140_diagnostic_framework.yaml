clause_id: "140"
clause_name: "异常结果诊断框架（七成/二成一成归因）"
status: enforced

# 条款原文（手册第 495 行）
clause_text: |
  **[140]** 七成情况是"假象"（评估口径/单 seed 偶然）或"任务压力不足"，两成是"实现/机制未生效"，一成才是真问题。

# 合格标准分解
diagnostic_triage:
  # 第一级：假象（70%）—— 必须优先排查
  first_tier:
    percentage: "70%"
    label: "假象"
    description: "评估口径/单 seed 偶然或任务压力不足"
    evaluation_axis_issues:
      - "Sim 对齐不一致"
      - "2D/3D 混合评估"
      - "世界系/局部系混用"
      - "warm-up 剔除规则不一致"
    single_seed_note: |
      单 seed 结果受初始化随机性影响大，不代表模型真实性能。
      要求 n_seeds >= 10（P19），单 seed 结果不具代表性。
    task_pressure_note: |
      任务压力不足指测试轨迹过短或场景过简单，
      无法区分方法的实际差异。

  # 第二级：实现/机制未生效（20%）—— 在第一级排除后才考虑
  second_tier:
    percentage: "20%"
    label: "实现未生效"
    description: "代码逻辑存在但运行中未生效"
    code_path_check:
      - "dropout 实际启用（非关闭状态）"
      - "正则项权重非零"
      - "Liquid 时间常数在合理范围（未退化）"
      - "梯度实际流动（无静默梯度为 0）"
    mechanism_verification: |
      检查代码路径是否实际被执行（非仅存在）：
      通过日志或断言确认关键代码路径在运行时被触发。

  # 第三级：真问题（10%）—— 排除前两级后认定
  third_tier:
    percentage: "10%"
    label: "真问题"
    description: "模型真实性能缺陷、架构局限或任务能力不足"
    true_issue_criteria: |
      排除七成假象和两成实现问题后，
      确认模型在正确评估口径、充分 seed 下的真实性能缺陷。

# 必须执行的操作
required_actions:
  before_anomaly_report: |
    报告任何异常结果前，必须先完成第一级排查（评估口径 + seed 充分性）。
    具体检查清单：
    1. 所有方法的评估口径（对齐/维度/坐标系/warm-up）是否一致（P20/P37/P38/P39）
    2. 是否满足 n_seeds >= 10 要求（P19）
    3. 测试轨迹长度是否足够区分方法差异
  before_true_issue_claim: |
    在认定第三级真问题前，必须完成第二级排查（代码路径验证）。
    具体检查清单：
    1. 关键机制（dropout/正则/Liquid 时间常数）实际生效
    2. 梯度实际流动，无静默失效
    3. 代码路径在运行时被触发
  third_tier_only_after: |
    第三级认定仅在以下条件下成立：
    1. 第一级排查已全部通过（评估口径一致，seed 充分）
    2. 第二级排查已全部通过（代码路径实际生效）
    3. 异常仍在排除上述因素后持续出现

# 配套 P 条款清单
related_checks:
  - "P19: seed 体系（n_seeds >= 10）"
  - "P20: 配对样本对齐"
  - "P37: warm-up 剔除"
  - "P38: 2D 世界系"
  - "P39: UWB 输出规范"
  - "R-1: 失败分类登记"
  - "R-2: 根因分析记录"
  - "R-3: 重跑轮次"

# 约束声明
constraint_declaration:
  clause_id: "140"
  clause_name: "异常结果诊断框架（七成/二成一成归因）"
  source_file: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
  source_line: 495
  enforce_level: "hard"
  rationale: |
    异常结果必须先排除假象和实现问题，才能认定为真问题。
    这一诊断顺序防止错误归因导致的无效重跑和资源浪费。
    七成假象是经验统计：多数异常源于评估口径不一致或单 seed 偶然性。
  category: "诊断纪律"
