# Clause [162] 数据集 mmap/磁盘重读降低驻留
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [162]

clause_id: "162"
clause_name: "数据集 mmap/磁盘重读降低驻留"
severity: hard

# 核心约束
constraints:
  dataset_loading_method: "mmap_or_disk_reread"
  ram_limit_gb: 12
  worker_num_per_manifest: true

# worker 数核定（基于 Pre-5）
precheck_reference:
  name: "Pre-5"
  purpose: "核定 worker_num"
  
# manifest 字段
manifest_fields:
  worker_num: "按 Pre-5 核定写入"
  dataset_loading_method: "mmap_or_disk_reread"

# 相关条款
related_checks:
  - "150"    # RAM 12G 硬上限
  - "151"    # RAM 超限处置
  - "152"    # 无 0.8 系数
  - "Pre-5"   # Pre-5 检查点

# 手册参照
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
