# Clause [158]: 日志含 git commit + 配置 hash
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [158]

clause_id: "158"
clause_name: "日志含 git commit + 配置 hash"
severity: hard
description: |
  每条实验日志必须包含 git commit hash 和配置 hash（SHA-256），
  确保代码版本可追溯、配置可复现。
  P39 结果持久化的日志溯源细化。

# 溯源字段要求
trace_fields:
  git_commit:
    required: true
    source: "git rev-parse HEAD"
    purpose: "代码版本追踪"
  config_hash:
    required: true
    algorithm: "SHA-256"
    input: "配置文件序列化文本"
    purpose: "配置复现性追踪"

# 落盘位置
landing:
  manifest: true
  log_header: true
  checkpoint_metadata: true

# 相关条款
related_checks:
  - "P39"     # 结果持久化
  - "157"     # checkpoint 落盘格式
  - "C-1"     # 文件命名规范
  - "Pre-5"   # 资源管理

# 实施位置
implementation:
  git_utils: "src/liquidloc/common/git_utils.py"
  config_utils: "src/liquidloc/common/config_utils.py"

# 手册参照
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
