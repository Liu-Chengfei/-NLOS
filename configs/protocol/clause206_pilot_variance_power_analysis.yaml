clause_id: "206"
clause_name: "Pilot 估计的方差可用于 DQ-4/本项功效核算"
severity: hard

purpose: |
  本条是数据变更与功效分析的硬约束。核心原则：
  pilot 阶段（先导实验）所做的方差估计是功效分析（DQ-4）所必需的数学输入；
  但正式的结论必须基于冻结后全量 10 seed 数据，不得用 pilot 数据冒充正式结论。
  本条与 [62]（功效与样本量声明）、[63]（样本量扩张）、[65]（pilot定义）衔接，
  构成统计功效链条的闭环。

pilot_variance_use:
  description: "pilot 方差用于功效分析"
  purpose: "DQ-4 本项功效核算的方差输入"
  valid_for: "功效分析（power analysis）计算"
  not_valid_for: "正式结论或论文级结果陈述"

full_scale_conclusion:
  description: "正式结论来源于全量数据"
  seed_count: 10
  trajectory_count_per_seed: ">=100"
  combinations: "A2N2, A2N3, A3N2, A3N3 四组合"
  requirement: "正式结论只来自冻结后全量 10 seed 数据"

dq4_power_analysis:
  description: "DQ-4 本项功效核算"
  methodology: "基于 pilot 方差估计的功效分析"
  parameters:
    - alpha: 0.05
    - power_target: 0.8
    - effect_size_reference: "A-2 40% 下限折算"
  input_variance_source: "pilot 估计"

disposal_sequence:
  - step: 1
    name: "pilot 方差估计"
    actions:
      - "收集 pilot 阶段（1 seed × 4 组合 × 1–2 条轨迹）的误差方差"
      - "计算方差估计值 σ_pilot²"
      - "将该方差用于 DQ-4 功效分析"
    output: "pilot 方差估计值"
    prerequisite: "pilot 实验完成"
  - step: 2
    name: "功效分析核算"
    actions:
      - "调用 P22 功效分析脚本，用 σ_pilot² 作为输入"
      - "计算所需样本量 n = 2×σ²×(Z_α/2 + Z_β)²/δ²"
      - "核对实际样本量（10 seed × >=100 轨迹）是否足够支撑功效声明"
    output: "功效分析结论（达标/不达标）"
    prerequisite: "step 1 完成，sigma_pilot 估计可用"
  - step: 3
    name: "正式结论依据确认"
    actions:
      - "正式结论必须基于冻结后全量 10 seed 数据"
      - "若 pilot 方差用于 DQ-4，须在 decision log 中留痕说明用途"
      - "不得把 pilot 结果直接报告为正式结论"
    output: "正式结论依据确认记录"
    prerequisite: "step 2 功效分析完成"

boundaries:
  forbidden:
    - "用 pilot 数据直接报告正式结论"
    - "把 pilot 方差当作正式结果的输入"
    - "跳过 DQ-4 功效分析直接下结论"
    - "不记录 pilot 方差用于 DQ-4 的事实"
  required:
    - "pilot 方差必须用于 DQ-4 功效核算"
    - "正式结论必须基于 10 seed 全量数据"
    - "功效分析结果必须留痕到 decision log"
    - "DQ-4 检查 P22 中包含方差支撑性核查"

dq4_power_analysis_check:
  description: "DQ-4 功效分析方差支撑性核查"
  checks:
    - description: "方差来源明确"
      what_to_check: "核查 DQ-4 功效分析是否明确标注方差来源为 pilot 阶段"
      expected: "在功效分析报告中标明方差来源"
    - description: "样本量足够"
      what_to_check: "核查 10 seed × >=100 轨迹 是否满足功效分析要求的最小样本量"
      expected: "n_pilot × 10 ≥ n_dq4_required"
    - description: "结论与数据来源分离"
      what_to_check: "核查正式结论是否不引用 pilot 数据"
      expected: "结论段落不出现 pilot 数据指标"

related_clauses:
  - "62"   # 功效与样本量声明
  - "63"   # 样本量不足时的扩样路径
  - "65"   # 先导实验定义
  - "195"  # DQ-4 时机
  - "200"  # 规模与划分
  - "321"  # 统计口径核验

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"