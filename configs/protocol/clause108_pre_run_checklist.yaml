# 对应 docs/最终交付_异步手册_424条_20260917.md 第 338 行

clause_id: "108"
clause_name: "跑前检查清单（第一道门）"

# 核心断言：跑前第一道门检查
pre_run_gate:
  required: true
  description: "此清单是跑前第一道门：逐项确认并留痕（检查记录 + git commit）"
  pass_required: true
  step_progression: "全过才允许进入 Step 1"

# 留痕要求
trace_logging:
  required: true
  check_record: true
  git_commit: true
  implementation_items:
    - 数据生成器（数据生成流水线 7 步注入顺序）
    - 生成 1 条 120s 基准（论文级）序列
    - AMP 混合精度默认启用
    - RAM ≤12G 硬上限
    - 出口代码项与实现项全部通过

# 检查清单项
checklist:
  - item: "数据生成器检查"
    standard: "生成 1 条 120s 基准（论文级）序列"
    check_required: true
    log_required: true
  - item: "AMP 混合精度检查"
    standard: "三网络同一设置，代码实现写入 manifest"
    check_required: true
    log_required: true
  - item: "RAM 硬上限检查"
    standard: "RAM ≤12G 硬上限，并发调度器按并发单元数×单单元峰值内存计算"
    check_required: true
    log_required: true
  - item: "代码项与实现项检查"
    standard: "全部通过并留痕（git commit + 自测日志）"
    check_required: true
    log_required: true

# 约束声明
constraint_declaration:
  clause_id: "108"
  binding_level: "hard"
  violation_consequence: "未通过跑前检查即进入 Step 1 → 实验流程违规，可能导致不可复现结果"
  related_clauses:
    - "[107] 目录级实现与数据校验和"
    - "[109] AMP 混合精度默认启用"
    - "[110] RAM ≤12G 硬上限"
    - "[111] 出口代码项与实现项全部通过"

