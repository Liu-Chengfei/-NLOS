# Clause [157]: checkpoint 落盘格式细则
# Source: docs/异步实验_执行手册_终版 v15_总纲条款版.md, [157]
# [157] checkpoint 落盘格式细则（硬约束，P39 结果持久化的落盘实现细则）

clause_id: "157"
checkpoint_format: "pt"  # .pt 或 .pth
save_interval_epoch: 5   # 每 5 个 epoch 保存一次
keep_last_k: 3          # 保留最近 3 个 checkpoint
include:                # checkpoint 必须包含的内容
  - "model_weights"
  - "optimizer_state"
  - "epoch"
  - "metrics"
  - "rng_state"
verify_after_save: true # 保存后必须验证
atomic_write: true      # 原子写避免中断损坏

related_checks:
  - "148"  # 跑前第一道门
  - "154"  # 断点恢复
  - "150"  # RAM 12G

manual_ref: "docs/异步实验_执行手册_终版 v15_总纲条款版.md"
