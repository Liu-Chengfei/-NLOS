# 文件职责：声明手册第 116 条配置落点 —— 日志含 git commit + 配置 hash
# 本文件是手册第 [116] 条的配置落点，规定日志必须包含 git commit hash 和配置 hash

# 核心配置：日志记录要求
clause_id: "116"
clause_title: "日志含 git commit + 配置 hash"
severity: "hard"

# 日志格式要求
log_format:
  git_commit_required: true
  config_hash_required: true
  position: "log_header"  # 日志文件头部或每次迭代记录

# git commit 要求
git_commit:
  format: "full_or_short"  # full: 40字符；short: 7字符（推荐）
  fallback: "no-git"  # 无 git 环境时的默认值

# 配置 hash 要求
config_hash:
  algorithm: "sha256"
  length: 12  # 前 12 位即可，足够区分
  scope: "task_contract"  # 哪部分配置的 hash（task_contract/liquid_bridge_contract 等）

# 编写要求
writing_requirements:
  mandatory_log_locations:
    - "实验目录下的 .log 文件"
    - "checkpoint 的 metadata.json 中的 git_commit 字段"
    - "metrics summaries 中的 config_hash 字段"

# 写入位置
log_entry_points:
  - "tee_logger.py：日志头写入 git commit"
  - "metrics_quality.py：结果文件写入 config_hash"

# 验证要求
verification_requirements:
  code_audit: true
  log_content_check: true

# 配置文件路径
config_version: "1.0"
last_updated: "2026-09-18"
manual_reference: "docs/最终交付_异步手册_424条_20260917.md 第 354 行"

# 手册真源行号与文本
manual_line: 354
manual_text: "\[116] 日志含 git commit + 配置 hash。"
