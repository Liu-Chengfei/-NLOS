# 条款 [172] 非全量规模（冒烟/quick）

# 手册原文：非全量规模（冒烟/quick）；论文级值：冒烟：1 序列/seed 级临时小数据（I-3 口径），quick 校准按 Part 2 冒烟合格标准
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 172 条

clause_id: "172"
clause_name: "非全量规模（冒烟/quick）"
severity: hard

# 冒烟规模定义
smoke_scale:
  # 冒烟实验数据规模：1 序列/seed 级临时小数据
  sequences_per_seed: 1
  scale_level: "non-full-scale"
  purpose: "临时小数据，用于方案冻结前快速验证可行性"
  implementation_scope: "I-3 口径"
  # I-3 口径引用：I-3 为 5 方法脚本清单（LNN/LSTM/Transformer + EKF/Robust-EKF）
  i3_reference: "precheck_orchestrator.py::check_I3_5_methods"

# Quick 校准定义
quick_calibration:
  # quick 校准参照 Part 2 冒烟合格标准
  reference_standard: "Part 2 smoke pass standard"
  calibration_required: true
  pass_criteria_from_part2: true

# Part 2 冒烟合格标准（与 [125] 口径一致）
part2_smoke_pass_standard:
  lnn_error_range: "3-4m"
  ekf_error_range: "6-8m"
  scenario: "N2+N3 混合池预期"
  lnn_improvement_over_ekf: "40-62.5%"
  note: "冒烟只作量级参考不作最终结论"

# 边界约束
boundaries:
  forbidden:
    - "冒烟数据并入全量测试集（违反 [66]）"
    - "冒烟数据序列数 >1 且无临时标记"
    - "quick 校准未参照 Part 2 标准"
  required:
    - "smoke_scale.sequences_per_seed = 1"
    - "quick_calibration.reference_standard 指向 Part 2 冒烟合格标准"

# 相关条款映射
related_checks:
  - "66"    # 禁止冒烟数据并入全量测试集
  - "81"    # 冒烟；验收人/验收机制
  - "125"   # 非全量规模（冒烟/quick）——口径与 [125] 同源
  - "142"   # 统计口径冒烟验证 gate
  - "171"   # 切换 epoch 点（冒烟同样需要声明分界）

# 约束声明
constraint_declaration:
  clause_id: "172"
  binding_level: "hard"
  violation_consequence: "冒烟未通过则不能进入全量实验"

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: >
  本条款约束冒烟/quick 非全量实验的规模定义。
  冒烟使用 1 序列/seed 级临时小数据（I-3 口径），仅用于方案冻结前快速验证可行性。
  quick 校准必须参照 Part 2 冒烟合格标准（与 [125] 口径同源）。
  冒烟数据严禁并入全量测试集（见 [66]）。
