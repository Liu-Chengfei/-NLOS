# Clause 117: Phase-dependent lr schedule must be frozen at code freeze and written into manifest; 5 methods share the same lr schedule
# Source: docs/最终交付_异步手册_424 条_20260917.md, line 350

clause_id: "117"
clause_title: "分阶段学习率冻结与 5 方法共用 lr schedule"
description: "分阶段 lr 属训练超参方案，必须在方案冻结（code freeze）时定死并写入 manifest，5 方法共用同一套 lr schedule；公平性不破坏：要改一起改、调优预算一致"

lr_schedule_requirements:
  frozen_at_code_freeze: true
  written_to_manifest: true
  shared_across_methods: true
  method_count: 5  # 5 methods share the same lr schedule
  change_rule: "要改一起改、调优预算一致"  # fairness constraint

verification_rules:
  check_code_freeze_mark:
    description: "检查 code freeze 标记是否存在"
    required: true
  check_manifest_contains_lr:
    description: "检查 manifest 中是否包含 lr schedule 配置"
    required: true
  check_five_methods_same_lr:
    description: "检查 5 方法是否使用同一套 lr schedule"
    required: true
  check_tuning_budget_consistent:
    description: "检查调优预算是否一致"
    required: true

manifest_fields_required:
  - lr_schedule
  - code_freeze_hash
  - method_count
  - lr_params

compliance:
  hard_constraint: true
  description: "分阶段学习率必须在 code freeze 时定死并写入 manifest，5 方法共用同一套 lr schedule，调优预算一致"
