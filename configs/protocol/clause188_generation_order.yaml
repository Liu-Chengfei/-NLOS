# 条款 [188] · 生成顺序钉死（避免 NLOS 不可解帧与人为丢包在缺失统计上重复或漏算）

# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 597 行

clause_id: "188"
clause_name: "生成顺序钉死"
severity: hard

# S8 数据生成流水线 - 注入顺序契约
generation_order_spec:
  # 本节目的
  purpose: |
    此节钉死生成顺序，避免"NLOS 不可解帧"与"人为丢包"在缺失统计上重复或漏算。

  # 严格规定的生成顺序（每条序列必须按此顺序执行）
  sequence:
    step_1:
      order: 1
      stage: "场景/轨迹生成"
      description: "生成基础场景布局和运动轨迹"
    step_2:
      order: 2
      stage: "传感器量测仿真"
      description: "UWB/IMU/VIO 原始量测"
    step_3:
      order: 3
      stage: "A 轴异步偏移注入"
      description: "在重采样前注入异步偏移"
      timing: "重采样前"
    step_4:
      order: 4
      stage: "N 轴 NLOS 偏差注入"
      description: "按遮挡区注入 NLOS 偏差"
    step_5:
      order: 5
      stage: "M 轴缺失注入"
      description: "人为丢包注入"
    step_6:
      order: 6
      stage: "统一重采样"
      description: "统一到公共时间轴"
      uwb_vio_gt_hz: 10
      imu_hz: 150  # IMU 保留 150Hz 原生，不降采样，写 imu_t
      imu_keep_native: true
    step_7:
      order: 7
      stage: "写 npz + manifest"
      description: "保存数据和清单"

  # M 轴缺失的作用范围限制
  m_axis_missing_scope:
    applies_to: "UWB"
    m1_only: true
    vio_missing_in_m2_m3: true  # VIO 缺失仅在 M2/M3 出现，不在异步高NLOS实验

# 关键约束
constraints:
  # 禁止顺序颠倒
  no_order_reversal: true
  # 禁止跳过步骤
  no_skip_steps: true
  # 禁止重复注入
  no_duplicate_injection: true
  # IMU 必须保持原生频率
  imu_keep_150hz: true

# 验证项
verification_items:
  generation_order_enforced:
    description: "生成顺序严格执行"
    checks:
      - step_order_correct
      - no_duplicate_injection
      - no_skipped_steps
  m_axis_scope_correct:
    description: "M 轴缺失作用范围正确"
    checks:
      - uwb_only
      - m1_applies
  imu_frequency_preserved:
    description: "IMU 频率保持 150Hz"
    checks:
      - imu_150hz_native
      - imu_t_written

# 边界约束
boundaries:
  forbidden:
    - "颠倒生成顺序"
    - "跳过任意步骤"
    - "重复注入同一类效应"
    - "漏算 NLOS 不可解帧"
    - "漏算人为丢包"
    - "IMU 降采样"
  required:
    - "严格按 7 步顺序执行"
    - "NLOS 偏差在人为丢包之前注入"
    - "IMU 保留 150Hz 原生"
    - "重采样前注入 A 轴异步偏移"

# 相关条款映射
related_clauses:
  - "187"   # P27 激活热图 ↔ S6 nl_flag/scene_mask，S8 数据生成流水线
  - "189"   # 生成顺序（每条序列）
  - "190"   # M 轴缺失只作用于 UWB（M1）
  - "191"   # 输出：每 seed 一份校验报告（JSON）

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: |
  本条款规定 S8 数据生成流水线的注入顺序，目的是避免"NLOS 不可解帧"与"人为丢包"
  在缺失统计上重复或漏算。核心要点：
  1. 严格按 7 步顺序执行：场景/轨迹 → 传感器量测 → A 轴偏移 → N 轴 NLOS → M 轴缺失 → 重采样 → 写 npz+manifest
  2. NLOS 偏差注入必须在人为丢包之前（否则无法区分哪些是 NLOS 丢失、哪些是人为丢包）
  3. A 轴异步偏移注入在重采样之前（因为异步偏移是基于原始时间轴的）
  4. IMU 必须保留 150Hz 原生频率，不降采样（写入 imu_t 字段）
  5. M 轴缺失只作用于 UWB 的 M1 档，VIO 缺失仅在 M2/M3 出现（本实验不涉及）
