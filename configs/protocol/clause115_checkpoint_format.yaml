# 文件职责：声明手册第 115 条配置落点 —— checkpoint 落盘格式细则
# 本文件是手册第 [115] 条的配置落点，规定 checkpoint 结果持久化的落盘实现细则
# 第 115 条要求：checkpoint 落盘必须符合规定的格式细则，确保结果持久化可追溯

# 核心配置：checkpoint 落盘格式细则
clause_id: "115"
clause_title: "checkpoint 落盘格式细则"
severity: "hard"

# checkpoint payload 必需字段（torch.save 落盘前必须写入）
required_payload_fields:
  - "model_state"       # 模型参数状态字典
  - "optimizer_state"   # 优化器状态字典
  - "config_hash"       # 配置文件的 git hash（CODE-9④ 绑定）
  - "checkpoint_format" # 格式版本标识 "liquid_real_v1"
  - "best_epoch"        # 最佳 epoch 索引
  - "best_loss"        # 最优验证损失

# 原子写入要求（CODE-9⑦ 落盘细则）
atomic_save:
  required: true
  method: "temp_then_rename"
  temp_extension: ".tmp"
  rename_mechanism: "os.replace"
  # 崩溃时仅留 tmp 文件，恢复器只认完整 checkpoint
  on_failure_behavior: "temp_file_orphaned_no_partial_write"

# config_hash 校验（CODE-9④：加载前必须校验，不匹配 → 禁止使用）
config_hash_validation:
  required: true
  mismatch_action: "reject"
  tolerance: "exact"

# 禁止模式
forbidden_patterns:
  - "write_directly_to_final_path"
  - "partial_save_without_cleanup"

# 验证要求
verification_requirements:
  code_audit: true
  payload_field_check: true
  atomic_save_check: true

# 配置文件路径
config_version: "1.0"
last_updated: "2026-09-18"
manual_reference: "docs/最终交付_异步手册_424条_20260917.md 第 353 行"

# 手册真源行号与文本
