# 触发词映射配置 · 条款 [32]
# 对应手册位置：docs/异步实验_执行手册_终版v15_总纲条款版.md 第274行
# 五铁律：唯一真源=手册原文，状态只认磁盘，逐字执行
#
# [32] 触发词映射 ——当收到"开始执行 / 跑第 X 批 / 按手册走 / 全流程 / 继续跑"等指令时，
#      一律先执行本条款的三样锚点读取，再判断本批范围，任何情况下不跳过本工序直接跑实验代码。

protocol_version: "v15"
manual_reference: "docs/异步实验_执行手册_终版v15_总纲条款版.md 第274行"
clause_id: "32"
clause_name: "触发词映射"

description: >
  当收到"开始执行 / 跑第 X 批 / 按手册走 / 全流程 / 继续跑"等指令时，
  一律先执行本条款的三样锚点读取，再判断本批范围，
  任何情况下不跳过本工序直接跑实验代码。

# === 触发词列表 ===
trigger_words:
  - "开始执行"
  - "跑第 X 批"
  - "按手册走"
  - "全流程"
  - "继续跑"

# === 锚点优先级（三样锚点，顺序不可调换） ===
# 三样锚点与条款 [29] 完全一致：
#   anchor_1 = 阶段覆盖总表中本批涉及的 gate 清单
#   anchor_2 = 阶段覆盖总表中本批涉及的出口判据
#   anchor_3 = 上一批 decision log 的断点状态
anchor_precedence:
  - anchor_1:
      name: "阶段覆盖总表中本批涉及的 gate 清单"
      description: "阶段覆盖总表中本批涉及的 gate 清单。防'读到旧文/凭记忆执行'。"
      source: "阶段覆盖总表"
      must_read_first: true
  - anchor_2:
      name: "阶段覆盖总表中本批涉及的出口判据"
      description: "阶段覆盖总表中本批涉及的出口判据。防'读到旧文/凭记忆执行'。"
      source: "阶段覆盖总表"
      must_read_after_anchor_1: true
  - anchor_3:
      name: "上一批 decision log 的断点状态"
      description: "上一批 decision log 的'断点状态'（上批跑到哪个 gate、留了什么未决项）。三样读完才允许执行本批动作。"
      source: "decision log"
      must_read_after_anchor_2: true

# === 范围判定 ===
scope_determination:
  description: >
    三样锚点全部读取完成后，根据本批指令类型判定本批范围：
    "开始执行"/"全流程"→ 跑当前阶段链全批；
    "跑第 X 批"→ 仅跑指定批；
    "按手册走"/"继续跑"→ 按断点状态续跑未完成部分。
  rule: "先读三样锚点，再判定本批范围"
  anchors_required_before_scope: true

# === 禁止跳过 ===
skip_prohibited:
  constraint_declaration:
    clause_reference: "手册第32条"
    skip_anchor_reading_prohibited: true
    skip_scope_determination_prohibited: true
    skip_to_experiment_code_prohibited: true
    any_condition_no_exception: true
  description_constraint: >
    任何情况下不跳过本工序直接跑实验代码。
    即使时间紧迫、批次简单、历史已跑过相同内容，
    也必须先执行三样锚点读取，再判定本批范围。
  exception_allowed: false
