# 条款 176：场景类型为工业/商业混合遮挡环境
# 配置文件：configs/protocol/clause176_manifest.yaml

clause_id: "176"
clause_name: "场景类型为工业/商业混合遮挡环境（manifest 记录）"
severity: hard

# 核心约束
scenario:
  type: "industrial_commercial_mixed_occlusion"
  regions:
    - "shelf_area"     # 货架区
    - "partition_wall" # 隔断墙
    - "open_area"      # 开放区
  occlusion:
    fixed_distribution: true
    must_record_in_manifest: true

# manifest 要求
manifest:
  required_fields:
    - "scenario_type"
    - "occlusion_map"
    - "region_layout"

# 相关条款
related_checks:
  - "177"    # 机体系固定
  - "174"    # 通道级独占
  - "175"    # 论文级独占

# 手册参照
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
