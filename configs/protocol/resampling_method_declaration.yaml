# [59] 重采样方法声明配置
# 手册原文：docs/最终交付_异步手册_424条_20260917.md 第286行
# 五铁律：唯一真源=手册原文，状态只认磁盘，逐字执行

clause_id: "59"
clause_name: "重采样方法声明"
clause_type: "hard_constraint"

# 核心约束字段
resampling_method: "nearest-neighbor"
target_rate: "10Hz"

# 禁止插值设定
interpolation_not_linear: true
interpolation_not_spline: true

# UWB/VIO 对齐要求
UWB_10Hz_frame_timestamp: true
VIO_20Hz_nearest: true
gt_alignment_direct: true

# 说明
description: |
  UWB/VIO 重采样到 10Hz 公共轴的插值方法统一指定 —— 本实验采用最近邻（nearest-neighbor）对齐到 UWB 帧时刻。
  UWB 10Hz 帧时刻本身是采样点，VIO 20Hz 取最近时刻，gt 同轴直接对齐。
  不使用线性/样条插值生成测距或 VIO 值。

# 论文方法节写入
write_to_paper_method_section: true

# 手册引用
manual_ref: "docs/最终交付_异步手册_424条_20260917.md 第286行"