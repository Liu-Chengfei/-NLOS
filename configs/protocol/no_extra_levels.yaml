#
# 目的：防止在档位协议空间外引入新参数、定义插值档或新档；
# 只允许使用当前协议已定义的档位范围（参见 configs/base/scene_axis_protocol.yaml）。
prohibition_reason: "禁止使用档位空间外的参数、禁止自行定义插值档/新档"
forbidden_params: "档位空间外参数"
