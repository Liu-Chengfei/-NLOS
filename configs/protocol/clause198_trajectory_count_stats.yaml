clause_id: "198"
clause_name: "打印各组合实际轨迹数量与 rho/mu/sigma 误差超阈值重生成"
severity: hard

purpose: |
  本条是数据生成环节的观测与判定硬约束。核心原则：
  数据生成完成后，必须打印每个组合（A2N2/A2N3/A3N2/A3N3）的实际轨迹数量、
  误差统计量 rho、mu、sigma，并在以下情况触发重生成：
  （1）任一统计量误差超 10%；（2）任一组合比例偏差超 5%。
  本条与 [197]（四组合分布一致性）、[200]（规模与划分）、[240]（S9 校验）衔接，
  构成数据质量闭环。

four_combinations:
  - "A2N2"
  - "A2N3"
  - "A3N2"
  - "A3N3"

trajectory_count_print:
  description: "各组合实际轨迹数量打印要求"
  per_combination:
    - name: "A2N2"
      expected_share: "25%"
    - name: "A2N3"
      expected_share: "25%"
    - name: "A3N2"
      expected_share: "25%"
    - name: "A3N3"
      expected_share: "25%"

stat_metrics:
  rho:
    description: "误差率或归一化残差 (rho)"
    threshold_percent: 10
    unit: "百分比"
  mu:
    description: "误差均值 (mu)"
    threshold_percent: 10
    unit: "百分比"
  sigma:
    description: "误差标准差 (sigma)"
    threshold_percent: 10
    unit: "百分比"

error_threshold:
  error_exceeds_10_percent:
    description: "误差超 10% 触发重生成"
    condition: "任一统计量（rho/mu/sigma）相对期望值偏差 > 10%"
    action: "重生成训练集"
  proportion_deviation_exceeds_5_percent:
    description: "任一组合比例偏差超 5% 触发重生成"
    condition: "任一组合实际比例 vs 期望 25% 偏差 > 5%（即 < 20% 或 > 30%）"
    action: "重生成训练集"
    note: "此条件与 [197] 的 5% 偏差阈值一致，作为交叉核验"

disposal_sequence:
  - step: 1
    name: "打印各组合轨迹数与 rho/mu/sigma"
    actions:
      - "统计各组合（A2N2/A2N3/A3N2/A3N3）实际轨迹数量"
      - "计算各组合误差统计量：rho（误差率）、mu（均值）、sigma（标准差）"
      - "打印汇总输出，格式化为表格"
    output: "各组合轨迹数 + rho/mu/sigma 汇总表"
    prerequisite: "数据生成完成，manifest 存在"
  - step: 2
    name: "误差阈值判定"
    actions:
      - "检查任一统计量误差是否超 10%"
      - "检查任一组合比例偏差是否超 5%"
    output: "通过/需重生成"
  - step: 3
    name: "重生成训练集"
    actions:
      - "对误差超限或比例偏差超限的组合定向重生成"
      - "保持四组合各 25% 均衡分布"
      - "重新执行前两步验证"
    prerequisite: "step 2 判定为不通过"
    forbidden_before: "未打印统计量直接重生成"

boundaries:
  forbidden:
    - "打印轨迹数但不打印 rho/mu/sigma 统计量"
    - "误差超 10% 不重生成继续训练"
    - "比例偏差超 5% 不重生成继续训练"
    - "跳过统计量打印直接进入训练"
    - "用旧数据替换新数据而不重生成"
  required:
    - "数据生成后必须打印各组合轨迹数量"
    - "必须打印 rho/mu/sigma 三项统计量"
    - "任一统计量误差超 10% 必须重生成"
    - "任一组合比例偏差超 5% 必须重生成"
    - "重生成后必须重新验证"

verification_items:
  trajectory_count_and_stats_print:
    description: "各组合实际轨迹数量与 rho/mu/sigma 打印核查"
    checks:
      - trajectory_count_printed_per_combination
      - rho_mu_sigma_metrics_specified
      - error_10_percent_threshold_specified
      - proportion_deviation_5_percent_threshold_specified
      - regenerate_trigger_specified
      - forbidden_core_violations_specified
      - required_print_and_regenerate_specified

related_clauses:
  - "192"
  - "194"
  - "195"
  - "196"
  - "197"
  - "200"
  - "240"
  - "273"
  - "276"
  - "321"
  - "414"

