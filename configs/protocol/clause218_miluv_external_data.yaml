clause_id: "218"
clause_name: "MILUV外部真实域数据——不重生成仅适配评估"
severity: hard

purpose: |
  本条是 MILUV 外部真实域数据的核心约束。核心原则：
  （1）MILUV 为第三方公开数据，不重生成，保持原始数据不变；
  （2）仅做适配评估，包括字段映射、序列路由、场景 ID 解析、锚点布局投影；
  （3）本条与 [217]（RZ-1 重生成）衔接，明确 MILUV 不属于 RZ 链条的数据生成范围；
  （4）本条与 [95]（MILUV 外部域布局随机化层声明）配套，[95] 规定使用方式，[218] 规定数据不可变性。

trigger_timing:
  - "论文级实验评估阶段"
  - "MILUV 适配流程启动前"
  - "任何尝试重生成 MILUV 数据的操作"

data_origin: external_public

no_regeneration_rule:
  description: "MILUV 数据不重生成规则"
  must_preserve: "原始第三方公开数据不变"
  note: "任何情况下不得尝试重生成、修改或替换 MILUV 原始数据文件"
  check_scope:
    - "确认 MILUV 数据文件为原始下载版本"
    - "确认未对 MILUV 数据执行过重生成操作"
    - "确认 RZ-1 重生成流程不包含 MILUV 数据路径"

adaptation_only_rule:
  description: "仅做适配评估规则"
  allowed_operations:
    - "字段映射（field_mapper）"
    - "序列发现与路由"
    - "场景 ID 解析"
    - "锚点布局投影"
    - "误差评估与报告生成"
  forbidden_operations:
    - "重生成原始数据"
    - "修改原始数据文件"
    - "替换原始数据为仿真数据"
  note: "适配评估仅为让仿真管线正确消费外部数据，不得改变数据本身"

related_clauses:
  - "217"
  - "95"
  - "171"
  - "172"
  - "173"

verification_plan:
  - step: 1
    name: "检查配置文件存在"
    actions:
      - "确认 configs/protocol/clause218_miluv_external_data.yaml 存在"
      - "解析 YAML 确认结构完整"
    output: "配置文件合规判定"
  - step: 2
    name: "检查规则文档存在"
    actions:
      - "确认 rules/条款 218_MILUV外部数据.md 存在"
      - "确认文档包含条款原文"
    output: "规则文档合规判定"
  - step: 3
    name: "检查验证器注册"
    actions:
      - "确认 clause_gates.py 中存在 p218_miluv_external_data() 函数"
      - "确认函数已注册到 _ALL 列表"
    output: "验证器注册合规判定"
  - step: 4
    name: "手册真源验证"
    actions:
      - "确认 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 666 行包含 [218]"
    output: "手册真源一致性判定"

boundaries:
  forbidden:
    - "尝试重生成 MILUV 原始数据"
    - "修改或替换 MILUV 数据文件"
    - "将 MILUV 数据纳入 RZ-1 重生成流程"
    - "用仿真数据替换真实域数据"
  required:
    - "MILUV 数据必须保持原始第三方公开状态"
    - "仅允许进行字段映射等适配操作"
    - "RZ-1 重生成必须排除 MILUV 数据路径"
    - "适配评估不得改变数据本身"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
