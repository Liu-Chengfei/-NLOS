# 条款 [192] · S9 表格校验目的：数据按协议正确生成（正确性 gate）
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 611 行

clause_id: "192"
clause_name: "S9正确性gate：数据按协议正确生成"
severity: hard

purpose: |
  S9 表格校验的是"数据是否按协议正确生成"（正确性 gate）。
  本条说明 S9 校验章节存在的根本目的——对数据生成过程的正确性进行前置验证，
  确保数据在正式使用前满足全部协议约束。

s9_correctness_gate:
  purpose: "S9 数据生成校验脚本 = 正确性 gate"
  script_path: "scripts/s9_validate_seeds.py"
  execution_timing:
    - "生成后"
    - "预检前必跑"
    - "DQ 检查之前"

  checks:
    composition:
      description: "四组合各 25%，偏差 ≤5%"
      tol: 0.05
    nlos_injection:
      description: "ρ/μ/σ 落在 N2/N3 协议区间，误差 ≤10%"
      tol: 0.10
    missing_stats:
      description: "M1 人为丢包为主，与 N 注入统计可交叉验证"
    gdop:
      description: "与 S2 实测 ≈1.19 一致，偏差 ≤20%"
      expected: 1.19
      tol: 0.20
    boundary_violations:
      description: "轨迹全程 ≥1.5m 凸包缓冲"
      buffer_m: 1.5
    schema:
      description: "字段级 data contract validation"
    overall:
      description: "任一不合格 → 该 seed 重新生成"
      fail_action: "regenerate_seed"

dq_prerequisite:
  condition: "S9 正确性校验通过后"
  next_step: "DQ-1–DQ-4 数据适配性检查（[195]）"
  order: "S9 → DQ，不可逆序"

related_clauses:
  - "191"
  - "195"
  - "196"
  - "220"

verification_items:
  correctness_gate_enforced:
    description: "S9 作为正确性 gate 的配置和实现到位"
    checks:
      - s9_script_exists
      - s9_correctness_checks_complete
      - s9_timing_before_dq
      - s9_fail_action_regenerate

boundaries:
  forbidden:
    - "跳过 S9 直接运行 DQ"
    - "S9 任一校验收尾而不重生成"
    - "正确性 gate 失败却继续训练"
  required:
    - "S9 脚本存在并完整实现全部 7 项校验"
    - "S9 在生成后、DQ 前执行"
    - "任一 S9 不合格 seed 必须重新生成"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
