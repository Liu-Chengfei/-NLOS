implementation_note: >
  第 148 条是跑前第一道门，必须在 Step 1（正式跑实验）之前逐项确认 I-1~I-5 实现项清单：
  1. I-1 数据生成器：生成 1 条 120s 基准序列，字段与 S6 契约对照，组件单测全覆盖
  2. I-2 S9 校验脚本：在 I-1 序列上跑通，7 项输出全部可判定，含 26a 项 V0 档负向排除
  3. I-3 5 方法脚本：LNN/LSTM/Transformer 冒烟跑通 + EKF/Robust-EKF 跑通 + overfit-one-batch
