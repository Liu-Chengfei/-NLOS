# 条款 [189] · 生成顺序（每条序列）
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 599 行

clause_id: "189"
clause_name: "生成顺序（每条序列）"
severity: hard

generation_sequence_spec:
  purpose: |
    每条数据序列必须严格按 7 步顺序生成，
    避免"NLOS 不可解帧"与"人为丢包"在缺失统计上重复或漏算。
  sequence:
    step_1:
      order: 1
      stage: "场景/轨迹生成"
      description: "生成基础场景布局和运动轨迹"
    step_2:
      order: 2
      stage: "传感器量测仿真"
      description: "UWB/IMU/VIO 原始量测"
    step_3:
      order: 3
      stage: "A 轴异步偏移注入"
      description: "在重采样前注入 A 轴异步偏移"
      timing: "重采样前"
    step_4:
      order: 4
      stage: "N 轴 NLOS 偏差注入"
      description: "按遮挡区注入 NLOS 偏差"
    step_5:
      order: 5
      stage: "M 轴缺失注入"
      description: "人为丢包注入"
    step_6:
      order: 6
      stage: "统一重采样到公共时间轴"
      description: "UWB/VIO/gt 重采样到 10Hz；IMU 保留 150Hz 原生"
      uwb_vio_gt_hz: 10
      imu_hz: 150
      imu_keep_native: true
      imu_t_written: true
    step_7:
      order: 7
      stage: "写 npz + manifest"
      description: "保存数据和清单"
  m_axis_missing_scope:
    applies_to: "UWB"
    m1_only: true

constraints:
  no_order_reversal: true
  no_skip_steps: true
  no_duplicate_injection: true
  imu_keep_150hz: true

verification_items:
  generation_sequence_enforced:
    description: "生成顺序（每条序列）严格执行"
    checks:
      - step_order_correct
      - no_duplicate_injection
      - no_skipped_steps

boundaries:
  forbidden:
    - "颠倒生成顺序"
    - "跳过任意步骤"
  required:
    - "严格按 7 步顺序执行"
    - "NLOS 注入在丢包前"
    - "IMU 保持 150Hz 原生"

related_clauses:
  - "188"
  - "190"
  - "191"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
