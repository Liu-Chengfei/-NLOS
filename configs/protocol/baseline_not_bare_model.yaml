# 条款 [58] 基线不是裸模型配置
# 手册原文：基线不是裸模型：确认 LSTM/Transformer 确实带头运行——否则 LNN 赢它们="4 个头 + 液态骨干"双重优势，对比不公平。
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第327行

clause_id: "58"
clause_name: "基线不是裸模型"

# 核心断言：LSTM/Transformer 基线必须带头运行
baseline_has_head: true

# 基线模型列表（带头配置）
baselines:
  - name: "LSTM"
    with_head: true
    description: "LSTM + 输出头"
  - name: "Transformer"
    with_head: true
    description: "Transformer + 输出头"

# 公平性说明
fairness_reason: "否则 LNN 赢它们='4 个头 + 液态骨干'双重优势，对比不公平"

# 对比维度
comparison_dimensions:
  - "4个头（多头输出）"
  - "液态骨干（LNN backbone）"

# 禁止裸模型运行
no_bare_model_allowed: true

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md 第327行"
