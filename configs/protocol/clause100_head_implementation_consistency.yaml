# 条款 [100] · 头实现一致性配置
# 手册位置：docs/最终交付_异步手册_424条_20260917.md 第 335 行
# 条款原文：头实现一致性：三个网络的 4 个头参数结构逐层一致，只骨干不同（防止实现偏差污染对比）。
# 对应手册 docs/最终交付_异步手册_424条_20260917.md:335

# 条款标识（顶层）
clause_id: "100"
clause_name: "头实现一致性"

# 核心约束
head_consistency:
  # 三个网络：LNN / LSTM / Transformer
  networks:
    - LiquidNeuralNetwork
    - LSTMNetwork
    - TransformerNetwork

  # 四个头：bias / risk / uwb_scaling / vio_scaling（见条款 [42]）
  heads:
    - bias
    - risk
    - uwb_scaling
    - vio_scaling

# 验证项（5 项逐层一致检查）
verification_items:
  - head_architecture_equal
  - projection_linear_shape_equal
  - activation_function_equal
  - parameter_count_equal
  - initialization_method_equal

# 约束声明
constraint_declaration:
  clause_id: "100"
  clause_name: "头实现一致性"
  source_file: "docs/最终交付_异步手册_424条_20260917.md"
  source_line: 335
  enforce_level: "hard"
  rationale: "防止实现偏差污染对比，确保 LNN vs LSTM/Transformer 的差异仅来自骨干网络"

  # 3 个网络必须统一
  3_networks: true

  # 4 个头必须统一
  4_heads: true

  # 约束 1: 参数结构逐层一致
  layer_structure_consistent:
    enforce_level: hard
    expected: lnn_lstm_transformer
    note: "三个网络的 4 个头在各对应层的参数形状、初始化方式、激活函数必须完全一致"

  # 约束 2: 只骨干不同
  backbone_only_different:
    enforce_level: hard
    note: "LNN/LSTM/Transformer 的唯一差异是骨干网络结构，头参数结构必须保持一致"

  # 约束 3: 防止实现偏差污染对比
  prevent_bias_contamination:
    enforce_level: hard
    note: "头参数不一致会导致 LNN vs LSTM/Transformer 的对比被头实现差异污染"

  # 相关条款
  related_clauses:
    - "[42] 四个输出头"
    - "[52] 基线不是裸模型"
    - "[61] 同 seed 初始化"
