# 条款 [88] 执行偏差默认假设
# 手册原文：docs/最终交付_异步手册_424条_20260917.md 第323行
# 长流程人工实验的执行偏差（漏跑单元、改码未重新冒烟、gate 走过场、日志与结果对不上、记录靠回忆）是常态而非例外——默认立场：执行存在偏差，直到本条 E 项被证据排除。

clause_id: "88"
clause_name: "执行偏差假设"

governance_assumption:
  scope: "long_running_human_experiments"
  default_stance: "execution_has_deviation"
  threshold_for_evidence_rejection: "E"
  description: "执行存在偏差，直到本条 E 项被证据排除"

deviation_types:
  - type: "skip_units"
    description: "漏跑单元"
  - type: "no_retest_after_code_change"
    description: "改码未重新冒烟"
  - type: "gate_bypass"
    description: "gate 走过场"
  - type: "log_result_mismatch"
    description: "日志与结果对不上"
  - type: "rely_on_memory"
    description: "记录靠回忆"

evidence_requirements:
  - criterion: "E"
    description: "必须有证据排除执行偏差才能认定为正确执行"

governance_mandate:
  default_behavior: "assume_deviation_present"
  override_condition: "E_evidence_provided"

manual_ref: "docs/最终交付_异步手册_424条_20260917.md 第323行"