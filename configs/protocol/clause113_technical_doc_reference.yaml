# 文件职责：声明手册第 113 条配置落点 —— 技术文档查阅纪律
# 本文件是手册第 [113] 条的配置落点，规定执行者在关键环节必须查阅技术文档
# 第 113 条要求：把"允许且应当查阅技术文档"从声明变成实现流程中的固定动作


# 核心配置：技术文档查阅纪律
clause_id: "113"
clause_title: "技术文档查阅纪律"
severity: "hard"

# 适用场景
applicable_scenarios:
  - "写代码"
  - "配环境"
  - "调接口"
  - "设数值精度模式（TF32/AMP/确定性）"

# 必查阅技术文档类型
required_document_types:
  - "官方文档"        # PyTorch/CUDA/NumPy 等官方文档
  - "库 API 说明"     # 第三方库 API 说明
  - "环境配置文档"   # 环境配置文档

# 查阅范围
document_checklist:
  # 接口签名与参数语义
  interface_signature: "查接口签名与参数语义"
  # dtype/shape 约定
  dtype_shape_constraints: "查 dtype/shape 约定"
  # 精度模式正确写法
  precision_mode: "查精度模式（autocast/GradScaler/确定性开关）的正确写法"
  # 版本兼容性
  version_compatibility: "查版本兼容性（nvcc/nvidia-smi/torch/gcc 四件套）"

# 记录方式
documentation_reference:
  method: "主动查阅"
  forbidden: "凭记忆写 API 用法"
  record_required: true
  record_format:
    - "文档名称"
    - "版本号"
    - "检索链接/页码"
    - "查阅时间戳"

# 验证要求
verification_requirements:
  context_documentation:
    enabled: true
    required_document_categories:
      - "PyTorch/CUDA/NumPy 官方文档"
      - "库 API 说明"
      - "环境配置文档"
  check_on:
    - "写代码"
    - "配环境"
    - "调接口"
    - "设数值精度模式"

# 配置文件路径
config_version: "1.0"
last_updated: "2026-09-18"
manual_reference: "docs/最终交付_异步手册_424条_20260917.md 第 343 行"