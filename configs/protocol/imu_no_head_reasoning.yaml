# 文件职责：声明 IMU 没有输出头的逻辑闭环说明（第42条配置落点）。
# 本文件是手册第42条的配置落点，回答「IMU 凭什么没有输出头」这一疑问，
# 从 IMU 的角色定位、数据流向、降权策略、解算方式、误差类型五个维度给出闭环论证。
# 验证：第42条要求说明 IMU 作为高频运动先验直接进入骨干，不需要自适应降权，
# 不单独解算绝对位置，误差是积分漂移而非单帧离群。

# IMU 没有输出头的逻辑闭环说明（对应手册第[42]条）
reason: "IMU 没有输出头的逻辑闭环说明"
imu_role: "高频运动先验"
data_flow: "直接进入骨干作为状态传播/预积分的底料"
no_adaptive_weighting: true
uwb_scaling_required: false
vio_scaling_required: false
no_absolute_position: true
error_type: "积分漂移"
not_single_frame_outlier: true

# 补充论证（与条款原文逐句对应，便于 Gate 做概念断言）
reasoning:
  role_argument: "IMU 是高频运动先验，直接进入骨干作为状态传播/预积分的底料"
  no_output_head_argument: "IMU 不单独解算绝对位置，其误差是积分漂移而非单帧离群"
  no_adaptive_weighting_argument: "IMU 不需要像 UWB/VIO 那样的自适应降权（uwb_scaling/vio_scaling）"
  contrast_uwb: "UWB 需要 uwb_scaling 自适应降权，因为 UWB 单独解算绝对位置，存在单帧离群"
  contrast_vio: "VIO 需要 vio_scaling 自适应降权，因为 VIO 单独解算绝对位置，存在单帧离群"