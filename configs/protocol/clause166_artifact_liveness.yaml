# 条款 [166] 每步当场验证产物
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [166]

clause_id: "166"
clause_name: "每步当场验证产物"

# 核心要求
requirement:
  when: "每完成一个阶段动作"
  what: "当场验证产物存在且数值正确"
  forbidden: "禁止'我觉得跑过了'"

# 检查方式
check_method:
  type: "artifact_liveness"
  description: "产物文件清单 + 哈希"

# 三证要求
three_certification:
  file:
    required: true
    description: "产物文件存在"
    verification: "文件路径存在且非空"
  value:
    required: true
    description: "数值正确"
    verification: "数值在预期范围内"
  log:
    required: true
    description: "日志时间戳"
    verification: "日志包含操作时间戳"

# 验证方式（必须可复核）
verification_methods:
  manifest_assertion:
    required: true
    description: "manifest 断言"
    implementation: "每次操作后写入manifest，可复核"
  log_timestamp:
    required: true
    description: "日志时间戳"
    implementation: "关键步骤记录ISO时间戳"
  checksum:
    required: true
    description: "校验和"
    implementation: "重要产物计算SHA-256"

# 产物清单
artifact_list:
  - npz 数据文件
  - manifest 清单文件
  - baseline_run_*.json
  - checkpoint
  - metrics 输出
  - 日志文件

# 相关条款
related_checks:
  - "159"   # 学习率分阶段调度
  - "160"   # 分阶段lr冻结
  - "164"   # 模式明确写入manifest

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
source_line: 166

# 实施说明
implementation_note: >
  1. 每步当场验证：每个阶段动作完成后，立即验证产物存在且数值正确
  2. 三证齐全：文件/数值/日志三者缺一不可
  3. 可复核性：验证方式必须是可复核的（manifest断言/日志时间戳/校验和）
  4. 禁止自我判断：不能依赖"我觉得跑过了"这类主观判断