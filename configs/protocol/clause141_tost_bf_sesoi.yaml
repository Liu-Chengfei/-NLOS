clause_id: "141"
clause_name: "TOST等效性检验与贝叶斯因子判定链（SESOI预注册）"
status: enforced

# 条款原文（手册第 497 行）
clause_text: |
  **[141]** TOST 等效性检验与贝叶斯因子（BF）是主张"无差异"的正规工具—— **判定链（按顺序执行，任一环节进入正式出口即停止）**： **预设等效边界（SESOI，实验方案冻结时定，Pre-2 预注册口径）**：在方案冻结时预设**最小有意义效应（SESOI）** ——本实验为 LNN vs EKF 相对提升的**实际判定下限 33%（窗口内数学可达下限，见 Part 0）**， 等效边界取该值的 ±50%（即相对提升 ±16.5% 内视为"等效/无实际差异"）

# SESOI 预注册参数
sesoi:
  method: "TOST_equivalence"
  comparison: "LNN vs EKF"
  metric: "relative_improvement"
  actual_lower_bound: 0.33  # 33%，窗口内数学可达下限（Part 0）
  equivalence_boundary_pct: 0.5  # ±50% of SESOI
  equivalence_range: [-0.165, 0.165]  # ±16.5%
  pre_registered: true
  freeze_stage: "Pre-2"
  immutable_after_freeze: true

# 判定链三步（按顺序执行，任一环节进入正式出口即停止）
decision_chain:
  step1: "预设等效边界（SESOI）——方案冻结时定，Pre-2预注册"
  step2: "TOST 等效性检验——输出 90%CI 与等价边界判定"
  step3: "BF01 贝叶斯因子——支持H0的强度，与frequentist结论并列报告"
  stop_on_formal_exit: true

# 工具映射
tools:
  tost: "src/liquidloc/analysis/handbook_p22_statistics.py → tost_equivalence_test"
  bf01: "src/liquidloc/analysis/handbook_p22_statistics.py → bayes_factor_null"
  sesoi_manager: "src/liquidloc/analysis/handbook_p22_statistics.py → preset_sesoi"

# 配套 P 条款清单
related_checks:
  - "P22: 统计方法框架"
  - "P60: 边界/极端情况"
  - "R-1: 失败分类登记"
  - "R-2: 根因分析记录"

# 约束声明
constraint_declaration:
  clause_id: "141"
  clause_name: "TOST等效性检验与贝叶斯因子判定链（SESOI预注册）"
  source_file: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
  source_line: 497
  enforce_level: "hard"
  rationale: |
    TOST + BF01 是主张"无差异"的正规统计工具，替代"不显著=无差异"的误读。
    判定链三步（SESOI→TOST→BF01）有序执行，不可跳步。
    SESOI 在 Pre-2 方案冻结时预注册，事后不可更改，防止事后选择性报告。
  category: "统计纪律"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
