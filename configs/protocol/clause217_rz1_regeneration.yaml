clause_id: "217"
clause_name: "RZ-1重生成——code freeze后生成全新数据集"
severity: hard

purpose: |
  本条是数据重生成的核心约束。核心原则：
  （1）必须使用 code freeze 后的同一套生成器代码重新生成；
  （2）必须使用论文级规模参数；
  （3）重新生成的数据集必须是全新的，不得复用旧产物；
  （4）本条与 [215]（RZ-0 清场）、[216]（不带旧产物）衔接，构成 RZ 链条的数据层保障。

trigger_timing:
  - "RZ-0 清场完成后"
  - "论文级实验启动前"
  - "任何已跑单元因代码修改后重跑时"

mode_type: paper_grade

code_freeze_requirement:
  description: "代码冻结要求"
  must_use: "code freeze 后的生成器代码"
  note: "不允许使用 code freeze 前的版本，确保数据与最终论文代码一致"
  check_scope:
    - "git commit 历史确认 code freeze 时间点"
    - "生成器脚本版本一致性"

paper_grade_params:
  description: "论文级规模参数"
  must_match: "最终提交的配置参数"
  note: "规模参数必须与论文最终版本一致，不得降级"
  check_scope:
    - "configs/ 目录下的最终配置"
    - "manifest 中的规模字段"

new_dataset_requirement:
  description: "新数据集要求"
  must_be_new: true
  note: "重新生成的数据集必须是全新文件，不得与旧 manifest 或旧 npz 路径冲突"
  check_scope:
    - "manifest 时间戳"
    - "npz 文件哈希"
    - "输出目录为全新路径"

verification_plan:
  - step: 1
    name: "检查 code freeze 标识"
    actions:
      - "确认 git commit 历史中存在 code freeze 标记"
      - "确认当前使用的生成器代码版本与 code freeze 版本一致"
    output: "code freeze 版本一致性判定"
  - step: 2
    name: "检查论文级参数"
    actions:
      - "读取 configs/ 目录下的最终配置"
      - "确认规模参数符合论文级要求"
    output: "论文级参数合规判定"
  - step: 3
    name: "检查新数据集生成"
    actions:
      - "检查 manifest 是否为新生成（时间戳近期）"
      - "检查 npz 文件是否为全新路径"
      - "对比旧 manifest 确认无复用"
    output: "新数据集生成判定"
  - step: 4
    name: "RZ 链条完整性检查"
    actions:
      - "确认 RZ-0 清场已完成"
      - "确认未引用任何旧产物路径"
    prerequisite: "step 1-3 全部通过"

boundaries:
  forbidden:
    - "使用 code freeze 前的生成器代码"
    - "使用降级参数生成数据"
    - "复用旧 manifest 或旧 npz 路径"
    - "跳过 RZ-0 清场直接生成"
    - "新旧数据混用"
  required:
    - "必须使用 code freeze 后的生成器代码"
    - "必须使用论文级规模参数"
    - "必须生成全新数据集"
    - "必须在 RZ-0 清场完成后执行"
    - "manifest 和 npz 必须是新文件"

related_clauses:
  - "215"
  - "216"
  - "218"
  - "321"
  - "414"

manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
