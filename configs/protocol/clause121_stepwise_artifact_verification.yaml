# 条款121 每步当场验证产物（配置）
# 手册原文（docs/最终交付_异步手册_424条_20260917.md 第 354 行）：
# 每步当场验证产物——每完成一个阶段动作，当场验证产物存在且数值正确（文件/数值/日志三证），
# 验证方式必须是可复核的（manifest 断言 / 日志时间戳 / 校验和），禁止"我觉得跑过了"
clause_id: "121"
clause_title: "每步当场验证产物——当场验证产物存在且数值正确（文件/数值/日志三证），验证方式可复核"
manual_source:
  file: "docs/最终交付_异步手册_424条_20260917.md"
  line: 354

stepwise_verification:
  # 每完成一个阶段动作，当场验证产物存在且数值正确
  verify_immediately_after_each_stage_action: true
  existence_check: true
  correctness_check: true

  # 文件/数值/日志三证
  evidence_triple:
    - file        # 文件证：产物文件存在
    - value       # 数值证：关键数值正确
    - log         # 日志证：日志记录可查

  # 验证方式必须是可复核的
  verifiable_methods:
    - manifest_assertion   # manifest 断言
    - log_timestamp        # 日志时间戳
    - checksum             # 校验和

  # 禁止"我觉得跑过了"（主观臆断代替可复核证据）
  forbid_subjective_confirmation: true
  forbidden_phrases:
    - "我觉得跑过了"
    - "应该没问题"

compliance:
  hard_constraint: true
  verification_function: "p121_stepwise_artifact_verification"
