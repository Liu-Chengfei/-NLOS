# 文件职责：声明 UWB/VIO/gt 输出行数以 UWB 帧数为基准的行数规范（第209条配置落点）。
# 本文件是手册第[209]条的配置落点，声明 UWB/VIO/gt 输出行数基准与 IMU 行数基准。
# 验证：第209条要求 UWB/VIO/gt 输出行数 N 以 UWB 帧数为准（10Hz×120s≈1200行/序列，S3论文级基准120s），
#       imu 为 N_imu 行（150Hz×120s≈18000行/序列）。

# 条款标识
clause_id: "209"
clause_name: "UWB/VIO/gt行数基准与IMU行数规格"

# 核心约束：输出行数以 UWB 帧数为基准
row_count_baseline:
  # UWB 帧数作为 N 的基准（所有非 IMU 通道：UWB/VIO/gt 的行数与此对齐）
  uwb_frame_count_as_N: true
  note: "UWB/VIO/gt 输出行数 N 以 UWB 帧数为准"

# UWB 基准参数
uwb_baseline:
  frequency_hz: 10
  duration_seconds: 120
  expected_rows_per_sequence: 1200
  baseline_note: "10Hz × 120s ≈ 1200 行/序列；S3 论文级基准 120s"
  s3_paper_level_baseline: true
  s3_baseline_duration_s: 120

# VIO 与 gt 对齐到 UWB 帧数
vio_gt_aligned_to_uwb: true
vio_gt_alignment_note: "VIO (vio_pos, vio_yaw, vio_valid) 与 gt 输出行数与 UWB 帧数 N 保持一致，不得自行扩展行数"

# IMU 独立行数（N_imu，不同于 N）
imu_spec:
  chip_type: "消费级"
  frequency_hz: 150
  expected_rows_per_sequence: 18000
  duration_seconds: 120
  n_imu_note: "150Hz × 120s ≈ 18000 行/序列"
  independent_row_count: true
  note: "IMU 使用独立行数 N_imu，与 UWB 帧数 N 不同"

# 验收标准
qualifying_criteria:
  uwb_vio_gt_rows_equal_N: true
  uwb_vio_gt_rows_equal_uwb_frames: true
  imu_rows_independent_of_N: true
  s3_baseline_120s: true
  uwb_frequency_10hz: true
  imu_frequency_150hz: true

# 相关检查
related_checks:
  - "P40_imu_output_spec"     # IMU 输出规范（频率、字段）
  - "P39_uwb_output_spec"     # UWB 输出规范（频率、字段）
  - "p207_config_data_cross_check"  # 配置与数据交叉检查
  - "p208_v0_degradation_exclusion" # V0 档负向排除

# 手册参考
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
manual_section: "生成数据（条款 [159-294]）"
manual_clause: "[209]"
