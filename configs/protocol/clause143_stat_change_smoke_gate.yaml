# 条款 [143] 统计口径变更→统计脚本冒烟验证 gate（变更触发机制）配置
# 手册原文：统计口径变更 → 统计脚本冒烟验证（gate）
# 对应 docs/异步实验_执行手册_终版 v15_总纲条款版.md 条款 143

clause_id: "143"
clause_name: "统计口径变更→统计脚本冒烟验证 gate（变更触发机制）"

# 条款原文
clause_text: |
  **[143]** 统计口径变更 → 统计脚本冒烟验证（gate）

# 变更触发机制
change_trigger:
  trigger_on: "统计口径任何变更（RMSE 口径、排除规则、坐标转换方式、warm-up 规则等）"
  auto_trigger: true
  trigger_source:
    - "decision_log 变更记录"
    - "config 文件 diff"
    - "code commit 统计相关文件"
  description: "统计口径一旦发生变更，必须自动触发统计脚本冒烟验证，无需手动启动"

# 冒烟验证 gate 机制
smoke_gate:
  purpose: "变更后的统计脚本必须通过冒烟验证才能生效"
  trigger_condition: "change_trigger.auto_trigger=true AND 检测到统计口径变更"
  gate_check:
    - "statistical_script_runs_without_error"
    - "output_contains_expected_metrics"
    - "aggregate_matches_manual_compute"
  fail_action: "阻断实验推进，回退口径变更到上一个通过版本"
  pass_action: "变更生效，写入 decision log，记录触发时间与验证结果"

# 因果链三步定义
causal_chain:
  step1: "统计口径变更发生（由决策日志、config diff 或 code commit 记录）"
  step2: "自动触发统计脚本冒烟验证（无需人工干预）"
  step3: "gate 通过 → 变更生效；gate 不通过 → 阻断推进 + 回退到上一个通过版本"
  traceability: "变更→触发→验证→决策 四步全程可追溯"

# 与第 142 条的区别
differentiation_from_p142:
  p142_focus: "静态声明——统计口径冻结后的冒烟验证机制"
  p143_focus: "动态触发——统计口径变更时的自动触发机制"
  key_difference: "142 强调'口径定义本身'要冒烟，143 强调'口径变更事件'自动触发冒烟"

# 相关检查引用
related_checks:
  - "P22: 统计方法"
  - "P142: 统计口径→统计脚本冒烟验证 gate（静态声明）"
  - "P139: 输出对齐"
  - "R-2: 根因分析记录"
  - "R-3: 重跑轮次控制"

# 手册真源引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 约束声明
constraint_declaration:
  clause_id: "143"
  binding_level: "hard"
  violation_consequence: "统计口径变更未触发冒烟 gate → 实验推进被阻断，变更无效需回退"
  enforcement_mechanism: "auto_trigger=true 强制触发 + decision_log 全程追溯 + gate 阻断回退"
