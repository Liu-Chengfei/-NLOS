# 条款 [126] 写入 manifest（学习率区间）配置
# 手册原文：docs/最终交付_异步手册_424条_20260917.md 第 359 行
# [126] 写入 manifest（学习率区间 1e-4–1e-3）

clause_id: "126"
clause_title: "[126] 写入 manifest（学习率区间 1e-4–1e-3）"

# 学习率区间定义
learning_rate_manifest:
  parameter_name: learning_rate
  paper_level_interval:
    min: 0.0001
    max: 0.001
  must_write_to_manifest: true
  description: "学习率必须在 manifest 中写入，且数值应在 1e-4 至 1e-3 范围内"

# 适用对象
applicable_methods:
  - LNN
  - LSTM
  - Transformer

# 强制要求
requirements:
  manifest_key: "lr_config"
  lr_in_range:
    lower_bound: 0.0001
    upper_bound: 0.001
  violation_consequence: "学习率未写入 manifest 或超出规定区间视为违规"

# 关联条款
related_clauses:
  - "[122] 学习率三段式调度协议"
  - "[123] 峰值 lr（lr_peak）"
  - "[124] 后段 lr 衰减策略"

hard_constraint: true
