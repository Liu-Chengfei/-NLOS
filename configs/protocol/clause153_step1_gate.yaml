# 条款 [153] Step 1 入口门控：C-1~C-10 与 I-1~I-5 全部通过并留痕
# 手册原文：**[153]** **出口**：C-1–C-10 与 I-1–I-5 全部通过并留痕（git commit + 自测日志）→ 进入 Step 1
# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 153 条

clause_id: "153"
clause_name: "Step 1 入口门控：C-1~C-10 与 I-1~I-5 全部通过并留痕"

# Step 1 门控声明
step1_gate:
  purpose: "所有 C-1~C-10 和 I-1~I-5 条件全部通过后才能进入 Step 1"
  hard_gate: true              # 硬门控，不能绕过
  entry_requirement: "全过才允许进入 Step 1"

# C 系列检查（训练基础条件）
c_series:
  range: "C-1 到 C-10"
  count: 10
  all_must_pass: true          # 全部必须通过

# I 系列检查（实现项）
i_series:
  range: "I-1 到 I-5"
  count: 5
  all_must_pass: true          # 全部必须通过

# 留痕要求
trace_requirement:
  git_commit: true             # 每项必须有 git commit 留痕
  self_test_log: true          # 每项必须有自测日志留痕

# 关联检查
related_checks:
  - "C-1"
  - "C-2"
  - "C-3"
  - "C-4"
  - "C-5"
  - "C-6"
  - "C-7"
  - "C-8"
  - "C-9"
  - "C-10"
  - "I-1"
  - "I-2"
  - "I-3"
  - "I-4"
  - "I-5"
  - "P148"
  - "Step-1"

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"