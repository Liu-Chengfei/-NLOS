# 条款 [187] · P27（激活热图）↔ S6 `nl_flag`/`scene_mask`

# 对应 docs/异步实验_执行手册_终版v15_总纲条款版.md 第 594 行

clause_id: "187"
clause_name: "P27激活热图 scene_mask 对齐"
severity: hard

# P27 说明
p27_spec:
  # 激活热图目的：4 头激活值统计可视化
  activation_stats_enabled: true
  n_output_heads: 4  # risk, bias, uwb_scaling, vio_scaling
  heatmap_saved: true

# S6 数据契约 - nl_flag / scene_mask 字段
s6_nlv_data_contract:
  # UWB 数据 (10Hz 重采样后)
  uwb_ranges:
    field_name: "uwb_ranges"
    sample_rate_hz: 10
  uwb_valid:
    field_name: "uwb_valid"
    description: "UWB 是否有效 (0=失效/M1 缺失, 1=有效)"

  # nl_flag 字段说明
  nl_flag:
    field_name: "nl_flag"
    description: "NLOS 标记 (0=LOS, 1=NLOS) 来自 N 轴注入统计"
    type: "binary"
    sampling: "aligned_10hz"
    source: "S8_N_axis_injection"

  # scene_mask 字段说明
  scene_mask:
    field_name: "scene_mask"
    description: "场景阶段掩码 (0=startup, 1=normal, 2=NLOS, 3=missing)"
    type: "categorical"
    values: [0, 1, 2, 3]
    sampling: "aligned_10Hz"

# 关联条款
related_clauses:
  - "186"   # 新增验证层，复用 I-1–I-5/P22 脚手架
  - "188"   # 此节钉死生成顺序，避免"NLOS 不可解帧"与"人为丢包"在缺失统计上重复或漏算
  - "187"   # 自己（循环引用，确保完整性）

# 验证项
verification_items:
  p27_activation_stats:
    description: "P27 激活统计可视化"
    checks:
      - activation_heatmap_saved
      - n_4_heads_with_stats
  s6_nlv_fields:
    description: "S6 nl_flag/scene_mask 字段存在"
    checks:
      - nl_flag_in_npz
      - scene_mask_in_npz
      - field_alignment

# 边界约束
boundaries:
  forbidden: []
  required:
    - "激活热图必须保存 (activation_heatmap_saved=true)"
    - "4 个输出头必须计算统计 (n_4_heads_with_stats=4)"
    - "npz 中必须包含 nl_flag 字段"
    - "npz 中必须包含 scene_mask 字段"
    - "nl_flag 与 N 轴注入统计可交叉验证"

# 手册引用
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"

# 实施说明
implementation_note: |
  本条款规定 P27（激活热图）↔ S6 nl_flag/scene_mask 的对应关系：
  1. P27：激活值统计（4 head 可视化） - 风险、偏置、UWB 比例、VIO 比例 4 个输出头的激活统计
  2. S6：nl_flag/scene_mask 字段在数据生成后 (S8 流水线) 必须写入 npz
  3. nl_flag = 1 表示该帧受 NLOS 遮挡 (N 轴注入)，用于激活热图叠加显示
  4. scene_mask = 0/1/2/3 分别表示 startup/normal/NLOS/missing 场景阶段
  5. 四头激活热图应与 scene_mask/nl_flag 对齐，验证机制见条款 [324]