# Clause [159] 学习率分阶段调度细化
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [159]

clause_id: "159"
clause_name: "学习率分阶段调度（前大后小，warmup+衰减）"
severity: hard

# 执行流程
execution_flow:
  step1_nonfull_scale_probe:
    name: "先非全量探到达标再全量"
    description: "先跑冒烟/quick 校准/预达标，达标才跑论文级"
  step2_full_scale_or_acceleration:
    name: "全量或提速"
    description: "全量资源受限需提速时，使用 lr 分阶段调度"

# 学习率调度参数
lr_schedule:
  warmup:
    type: "linear_increase"
    epochs: "N1"
    start_lr: 0
    end_lr: "lr_peak"
  peak_hold:
    type: "constant"
    value: "lr_peak"
  decay:
    # 二选一：cosine_annealing 或 piecewise_constant
    type: "cosine_annealing_or_piecewise_constant"
    start_lr: "lr_peak"
    end_lr: "lr_end"
    must_write_to_manifest: true

# 边界约束
boundaries:
  no_quality_degradation: true
  maintain_paper_level_accuracy: true
  forbidden: "降质提速"

# 适用方法
applicable_methods:
  - "LNN"
  - "LSTM"
  - "Transformer"

# 相关条款
related_checks:
  - "122"   # 学习率三段式调度协议
  - "123"   # peak_lr 配置
  - "124"   # lr 衰减方式
  - "160"   # 5 方法共用同一套 lr schedule
  - "161"   # lr 参数写入 manifest 与论文方法节

# 手册参照
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
