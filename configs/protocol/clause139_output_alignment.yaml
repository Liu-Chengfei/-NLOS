clause_id: "139"
clause_name: "输出对齐（G-5合格标准）"
status: enforced

# 条款原文（手册第 493 行）
clause_text: |
  **[139]** 第G-5项 输出对齐；合格标准：五个方法的评估输入为**同一批测试轨迹**（配对 P20），
  RMSE 口径一致（Sim 对齐/2D/世界系/warm-up 剔除，P9/P10/P37/P38）

# 合格标准分解
qualifying_criteria:
  # 1. 同一批测试轨迹（配对 P20 / P53）
  same_test_trajectory:
    requirement: "五个方法的评估输入为同一批测试轨迹（配对）"
    enforce: true
    pairing_unit: "trajectory_seed"
    pairing_note: "同一轨迹 × 同 seed 为配对样本（与条款 [53] 配对样本对齐一致）"

  # 2. RMSE 口径一致
  rmse_consistency:
    # Sim 对齐（P9）
    alignment_method: "Sim/Umeyama"
    alignment_note: "使用 Sim/Umeyama 算法进行轨迹对齐（旋转+平移，2D 用 Sim(2)，3D 用 Sim(3)）"

    # 2D 维度（P10）
    dimension: "2D"
    dimensions_used:
      - x
      - y

    # 世界系（P38）
    coordinate_system: "world"
    coordinate_system_note: "误差以世界系计算，不依赖机体系"

    # warm-up 剔除（P37）
    warmup_removal:
      enabled: true
      duration_seconds: 10
      note: "warm-up 前 10s 数据不参与 RMSE 计算"

  # 五个方法列表
  five_methods:
    - "LNN"
    - "LSTM"
    - "Transformer"
    - "EKF"
    - "Robust-EKF"

# 配套 P 条款清单
related_checks:
  - "P9: Sim(3)对齐"
  - "P10: 2D维度"
  - "P20: 窗口化（warm-up 窗口定义）"
  - "P37: warm-up剔除"
  - "P38: 2D世界系"
  - "P53: 配对样本对齐"

# 约束声明
constraint_declaration:
  clause_id: "139"
  clause_name: "输出对齐（G-5合格标准）"
  source_file: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
  source_line: 493
  enforce_level: "hard"
  rationale: |
    五个方法必须在同一批测试轨迹、同一 RMSE 口径下评估，
    配对检验才有效；口径不一致会导致比较失真。
    本条款为 G-5 输出对齐的合格标准具体声明。
  category: "评估口径"