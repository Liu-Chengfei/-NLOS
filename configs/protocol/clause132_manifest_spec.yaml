# Clause 132: Manifest Specification
# 每个 seed 一个 JSON ——含场景图、锚点坐标、档位、各组合轨迹数、注入统计、随机源 seed、外参/杆臂

clause_id: "132"
clause_title: "[132] manifest 规格"

# Manifest 必须包含的字段
manifest_fields:
  scene_graph: "场景图（场景布局描述）"
  anchor_coordinates: "锚点坐标（4 锚位置）"
  gear_configuration:
    description: "档位配置（A2/A3 与 N2/N3 四组合）"
    combinations:
      - "A2N2"
      - "A2N3"
      - "A3N2"
      - "A3N3"
    distribution: "各组合各占 25%"
  trajectory_count_per_combination: "各组合轨迹数量"
  injection_statistics:
    rho: "丢包率实际值"
    mu: "NLOS 偏差均值实际值"
    sigma: "NLOS 偏差标准差实际值"
  random_source_seed: "随机源 seed 值"
  extrinsic_arm:
    T_cam_imu: "相机-IMU 外参（按理想值固定）"
    lever_arm: "IMU 相对 tag 中心的杆臂（按理想值固定）"

# 验证约束
constraints:
  mandatory_fields:
    - "scene_graph"
    - "anchor_coordinates"
    - "gear_configuration"
    - "trajectory_count_per_combination"
    - "injection_statistics"
    - "random_source_seed"
    - "extrinsic_arm"
  four_combinations_equal_distribution: true
  extrinsic_fixed_ideal_values: true

hard_constraint: true
