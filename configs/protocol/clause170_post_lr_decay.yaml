# Clause [170] 后段 lr 衰减细化
# Source: docs/异步实验_执行手册_终版v15_总纲条款版.md, [170]

clause_id: "170"
clause_name: "后段 lr 衰减（余弦退火或分段常数衰减二选一，写入 manifest）"
severity: hard

# 后段学习率衰减配置
post_lr_decay:
  # 衰减方式：二选一
  decay_type: "cosine_annealing OR piecewise_constant"
  # 必须提供具体的衰减方式
  must_select_one:
    - "cosine_annealing"
    - "piecewise_constant"
  
  # 起始和终止学习率
  lr_start: "lr_peak"
  lr_end: "lr_end"
  
  # 关键约束：必须写入 manifest
  must_write_to_manifest: true
  
  # 论文级值要求
  paper_level_values:
    - "lr_peak 值明确"
    - "lr_end 值明确"
    - "衰减方式明确选择其一"

# 边界约束
boundaries:
  forbidden: "同时使用两种衰减方式"
  requirement: "只能二选一"

# 适用方法
applicable_methods:
  - "LNN"
  - "LSTM"
  - "Transformer"

# 相关条款
related_checks:
  - "159"   # 学习率分阶段调度
  - "160"   # 5 方法共用同一套 lr schedule
  - "161"   # lr 参数写入 manifest

# 手册参照
manual_ref: "docs/异步实验_执行手册_终版v15_总纲条款版.md"
